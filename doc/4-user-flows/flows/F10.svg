<svg xmlns="http://www.w3.org/2000/svg" width="810" height="746" viewBox="0 0 810 746" font-family="'Noto Sans Thai', 'Noto Sans', 'DejaVu Sans', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="bold" fill="#111827">F10  Publish and change later</text><text x="40" y="74" font-size="14" fill="#4b5563">HEAD only  -  details: user-flows.txt</text><rect x="60" y="110" width="380" height="46" rx="23" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="250" y="138" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">step 9: Publish</text><line x1="250" y1="156" x2="250" y2="186" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><polygon points="250,186 400,223 250,260 100,223" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="250" y="228" font-size="13" font-weight="normal" fill="#111827" text-anchor="middle">is it the head?</text><line x1="400" y1="223" x2="460" y2="223" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="430" y="215" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">no</text><rect x="460" y="200" width="300" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="610" y="228" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">assistant: only the head publishes</text><line x1="610" y1="246" x2="610" y2="268" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="460" y="268" width="300" height="46" rx="23" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="610" y="296" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">head gets a notice</text><line x1="250" y1="260" x2="250" y2="326" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="264" y="279" font