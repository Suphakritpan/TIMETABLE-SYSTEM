-width="2"/><text x="610" y="906" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">next red: PDF opens at the spot</text><line x1="610" y1="924" x2="610" y2="946" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><rect x="460" y="946" width="300" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="610" y="974" font-size="13.5" font-weight="normal" fill="#111827" text-anchor="middle">fix it or mark it right</text><line x1="250" y1="938" x2="250" y2="1004" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/><text x="264" y="957" font-size="12.5" font-weight="bold" fill="#15803d" text-anchor="start">no</text><rect x="60" y="1004" width="380" height="52" rx="26" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="250" y="1026" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">every row: program, year, term, code / slot,</text><text x="250" y="1044" font-size="13.5" font-weight="bold" fill="#111827" text-anchor="middle">credits</text><rect x="40" y="1084" width="18" height="14" rx="3" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="64" y="1096" font-size="12" fill="#374151">start</text><rect x="109" y="1084" width="18" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="133" y="1096" font-size="12" fill="#374151">page</text><rect x="171" y="1084" width="18" height="14" rx="3" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="195" y="1096" font-size="12" fill="#374151">action</text><rect x="247" y="1084" width="18" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="271" y="1096" font-size="12" fill="#374151">question</text><rect x="337" y="1084" width="18" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="361" y="1096" font-size="12" fill="#374151">problem</text><rect x="420" y="1084" width="18" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width