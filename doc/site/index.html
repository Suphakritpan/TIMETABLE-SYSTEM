<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>เอกสารระบบตารางเรียน</title>
<style>
/* ธีมออฟฟิศ: ขาว + เงิน (สว่างอย่างเดียว) ค่าสีตรงกับ tokens.css ของแอป */
:root{
  --page:#eceef1;          /* พื้นหลังเงินอ่อน */
  --paper:#ffffff;         /* กระดาษเนื้อหา */
  --silver:#e5e7eb;        /* แถบข้าง / หัวตาราง */
  --silver-2:#f3f4f6;      /* แถวสลับ / โค้ด */
  --border:#cfd4db;
  --text:#1f2937;
  --text2:#4b5563;         /* 7.5:1 บนขาว */
  --primary:#1f5fae;
  --primary-bg:#e8f0fb;
  --warn-bg:#fff4e0;--warn-bd:#f0b45a;
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--page);color:var(--text);font:17px/1.8 Sarabun,"Noto Sans Thai",system-ui,sans-serif;display:grid;grid-template-columns:276px minmax(0,1fr)}

/* แถบสารบัญซ้าย */
nav.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(#f4f5f7,#e5e7eb);border-right:1px solid var(--border);padding:16px 12px}
nav.side h1{font-size:1.05rem;margin:4px 8px 10px;line-height:1.4}
nav.side input{width:100%;height:36px;padding:0 10px;margin:0 0 6px;border:1px solid #9ca3af;border-radius:4px;background:#fff;color:var(--text);font:inherit;font-size:.95rem}
nav.side h2{font-size:.78rem;letter-spacing:.02em;color:var(--text2);margin:18px 8px 4px;font-weight:600}
nav.side a{display:block;padding:5px 10px;border-radius:4px;color:var(--text);text-decoration:none;border-left:3px solid transparent;font-size:.95rem;line-height:1.5}
nav.side a:hover{background:#fff}
nav.side a[aria-current]{background:#fff;border-left-color:var(--primary);font-weight:600;color:var(--primary)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* พื้นที่อ่าน */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;padding:24px 28px 80px;align-items:start;max-width:1280px}
article{background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:32px 48px 40px;min-width:0}
article>*:first-child{margin-top:0}
article h1{font-size:2rem;line-height:1.35;margin:0 0 1.2rem;padding-bottom:.5rem;border-bottom:2px solid var(--silver)}
article h2{font-size:1.45rem;line-height:1.4;margin:2.4rem 0 .8rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
article h3{font-size:1.15rem;margin:1.8rem 0 .5rem}
article h4{font-size:1rem;margin:1.4rem 0 .4rem;color:var(--text2)}
article p,article li{max-width:75ch}
article ul,article ol{padding-left:1.5rem}
article li{margin:.2rem 0}
article hr{border:0;border-top:1px solid var(--border);margin:2rem 0}
a{color:var(--primary)}
article strong{font-weight:600}

/* ตาราง */
.tbl{overflow:auto;margin:1.2rem 0;border:1px solid var(--border);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.93rem;line-height:1.6}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:top;text-align:left}
th{background:var(--silver);font-weight:600;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
thead:has(th:empty + th:empty){display:none} /* ตารางหัวว่าง (ตารางคู่ ชื่อ-ค่า) ซ่อนแถวหัวสีเทา */
table td:first-child{font-weight:600}
tbody tr:nth-child(even){background:#f8f9fb}
td code{white-space:nowrap}

code{background:var(--silver-2);border:1px solid #e1e4e8;padding:1px 5px;border-radius:3px;font:.86em/1.5 Consolas,"Cascadia Mono",monospace}
pre{background:#f6f7f9;border:1px solid var(--border);padding:14px 16px;overflow:auto;border-radius:4px;line-height:1.55;font-size:.88rem;margin:1.2rem 0}
pre code{background:none;border:0;padding:0}
blockquote{margin:1.2rem 0;padding:10px 16px;border-left:4px solid var(--primary);background:var(--primary-bg);border-radius:0 4px 4px 0}
blockquote p{margin:.3rem 0}
img{max-width:100%;border:1px solid var(--border);border-radius:4px;background:#fff}

/* ไดอะแกรม: ขนาดจริง + ซูม + ลากเลื่อน */
.dg{margin:1.4rem 0;border:1px solid var(--border);border-radius:4px;background:#fff}
.dg-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--silver);border-bottom:1px solid var(--border);font-size:.9rem}
.dg-bar button{height:30px;min-width:32px;padding:0 10px;border:1px solid #9ca3af;border-radius:4px;background:#fff;color:var(--text);font:inherit;cursor:pointer}
.dg-bar button:hover{background:var(--primary-bg)}
.dg-bar .z{min-width:52px;text-align:center;color:var(--text2)}
.dg-bar .hint{margin-left:auto;color:var(--text2);font-size:.82rem}
.dg-view{overflow:hidden;height:min(460px,70vh);cursor:grab;padding:8px;touch-action:none}
.dg-view.drag{cursor:grabbing;user-select:none}
.dg-view svg{display:block;max-width:none!important}
.dg-full .dg-view,.dg:fullscreen .dg-view{height:calc(100vh - 46px)}.dg:fullscreen{background:#fff}

/* สารบัญในหน้า (ขวา) */
aside.outline{position:sticky;top:16px;font-size:.88rem;line-height:1.5;max-height:calc(100vh - 32px);overflow:auto}
aside.outline b{display:block;color:var(--text2);margin-bottom:6px;font-weight:600}
aside.outline a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--border);color:var(--text2);text-decoration:none}
aside.outline a:hover{color:var(--primary);border-left-color:var(--primary)}
aside.outline a.l3{padding-left:22px;font-size:.84rem}

.tip{position:fixed;z-index:50;max-width:380px;padding:8px 12px;background:#fff;color:var(--text);border:1px solid #9ca3af;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:.88rem;line-height:1.55;pointer-events:none;display:none}
.tip b{display:block;font-size:.95rem;margin-bottom:2px}
[data-tip]{cursor:help}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--border)}
.pager a{display:inline-block;padding:8px 14px;border:1px solid var(--border);border-radius:4px;text-decoration:none;background:var(--silver-2)}
.pager a:hover{background:var(--primary-bg);border-color:var(--primary)}

/* Skeleton loading: ส่วนเสริมจากสไตล์เดิม (ต้นฉบับไม่มี animation) เปิดให้ผู้ใช้ที่ตั้ง "ลดการเคลื่อนไหว" ไม่เห็นการวิบวับ */
.sk,.mermaid:not([data-processed]):not(.sk-fail){background:linear-gradient(90deg,var(--silver) 25%,var(--silver-2) 37%,var(--silver) 63%);background-size:400% 100%;animation:sk-shimmer 1.4s ease infinite;border-radius:4px}
@keyframes sk-shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sk-h1{height:34px;width:55%;margin-bottom:22px}
.sk-h2{height:24px;width:35%;margin:34px 0 14px}
.sk-line{height:14px;margin:12px 0}
.sk-table{height:150px;margin:20px 0}
.sk-diagram,.mermaid:not([data-processed]):not(.sk-fail){height:260px;margin:22px 0;font-size:0;color:transparent;overflow:hidden}
.sk-nav{height:12px;margin:14px 8px 8px;width:45%}
.sk-link{height:16px;margin:10px 10px;width:78%}
.sk-out{height:12px;margin:12px 0 12px 10px;width:80%}
.w90{width:90%}.w85{width:85%}.w75{width:75%}.w60{width:60%}
.mermaid.sk-fail{white-space:pre;font:.86em/1.5 Consolas,monospace;text-align:left;padding:12px;background:var(--silver-2)}
@media (prefers-reduced-motion:reduce){.sk,.mermaid:not([data-processed]){animation:none}}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr)}aside.outline{display:none}}
@media (max-width:800px){body{grid-template-columns:1fr}nav.side{position:static;height:auto;max-height:45vh}.wrap{padding:12px}article{padding:20px 18px}}
@media print{body{display:block;background:#fff}nav.side,aside.outline,.pager,.dg-bar{display:none}.wrap{padding:0;display:block}article{border:0;padding:0}.dg-view{max-height:none;overflow:visible}}
</style>
</head>

</div>

der (อ่านไฟล์)&#10;→ PostgreSQL ใน Docker&#10;→ A4 / PDF ให้นักศึกษา (ไม่ล็อกอิน) (ส่งออก)\"><rect x=\"528\" y=\"14\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"633\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">project service<\/text><text x=\"633\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">FastAPI + OpenAPI<\/text><\/g><g data-tip=\"FET solver + core lib checker&#10;มาจาก:&#10;← project service FastAPI + OpenAPI (รัน / ตรวจสด)\"><rect x=\"812\" y=\"14\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"917\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">FET solver<\/text><text x=\"917\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">+ core lib checker<\/text><\/g><g data-tip=\"import service pdftotext + OCR + format reader&#10;มาจาก:&#10;← project service FastAPI + OpenAPI (อ่านไฟล์)&#10;ไปที่:&#10;→ ไฟล์หลักสูตร og_upload / normalised\"><rect x=\"812\" y=\"110\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"917\" y=\"134\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">import service<\/text><text x=\"917\" y=\"152\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">pdftotext + OCR + format reader<\/text><\/g><g data-tip=\"ไฟล์หลักสูตร og_upload / normalised&#10;มาจาก:&#10;← import service pdftotext + OCR + format reader\"><rect x=\"1066\" y=\"110\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#f3f4f6\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/><text x=\"1171\" y=\"134\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ไฟล์หลักสูตร<\/text><text x=\"1171\" y=\"152\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">og_upload / normalised<\/text><\/g><g data-tip=\"PostgreSQL ใน Docker&#10;มาจาก:&#10;← project service FastAPI + OpenAPI\"><rect x=\"812\" y=\"206\" width=\"210\" heigh 1.0,229.0 801.0,239.0\" fill=\"#4b5563\"/><polygon points=\"812.0,330.0 801.0,325.0 801.0,335.0\" fill=\"#4b5563\"/><polygon points=\"1066.0,138.0 1055.0,133.0 1055.0,143.0\" fill=\"#4b5563\"/><rect x=\"697\" y=\"80\" width=\"61\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"727\" y=\"91\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">อ่านไฟล์<\/text><rect x=\"794\" y=\"188\" width=\"48\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"818\" y=\"199\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">ส่งออก<\/text><polyline points=\"230,42 274,42\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ผู้ใช้ HEAD / ASSISTANT / TEACHER / ADMIN → Frontend (ส่วนของเรา) React 19 + Vite\"/><polyline points=\"484,42 528,42\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"Frontend (ส่วนของเรา) React 19 + Vite → project service FastAPI + OpenAPI&#10;JSON + multipart / poll\"/><polyline points=\"738,24 775,24 775,42 812,42\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"project service FastAPI + OpenAPI → FET solver + core lib checker&#10;รัน / ตรวจสด\"/><polyline points=\"738,36 764,36 764,138 812,138\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"project service FastAPI + OpenAPI → import service pdftotext + OCR + format reader&#10;อ่านไฟล์\"/><polyline points=\"738,48 776,48 776,234 812,234\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"project service FastAPI + OpenAPI → PostgreSQL ใน Docker\"/><polyline points=\"738,60 788,60 788,330 812,330\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"project service FastAPI + OpenAPI → A4 / PDF ให้นักศึกษา (ไม่ล็อกอิน)&#10;ส่งออก\"/><polyline points=\"1022,138 1066,138\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"import service pdftotext + OCR + format reader → ไฟล์หลักสูตร og_upload / normalised\"/><\/svg><\/div>\n\n- **Frontend ไม่คุย solver ตรง ๆ** ทุกอย่างผ่าน project service ซึ่งเป็นตัวเดียวที่เขียนข้อมูลและบันทึกทุกการเปลี่ยน (N1)\n- **ฟ้า** = ส่วนที่เรารับผิดชอบ · **เขียว** = ฝั่งอานนท์ · ดู [เส้น API](api.md) และ [Tech Stack](../th/8-tech-stack.md)\n\n## ต้นฉบับกับชุดนี้\n\nชุดนี้เรียบเรียงใหม่จากเอกสารออกแบบขั้น 1-7 เพื่อให้นักพัฒนาใช้งานได้ ต้นฉบับยังอยู่ครบและไม่ถูกแก้:\n\n| ต้นฉบับ | ใช้เป็นหลักฐานเมื่อ |\n|---|---|\n| [`doc/1-users-and-goals`](../1-users-and-goals/users-and-goals.txt), [`2-user-journeys`](../2-user-journeys/user-journeys.txt), [`3-sitemap`](../3-sitemap/sitemap.txt), [`4-user-flows`](../4-user-flows/user-flows.txt) | ต้องการรายละเอียดหรือเหตุผลเดิม (ภาษาอังกฤษ + ไทยปน) |\n| [`doc/5-wireframes/prototype.html`](../5-wireframes/prototype.html) | ดูหน้าจอจริงแบบคลิกได้ (เมนู \"view as\" สลับบทบาท) |\n| [`doc/th/`](../th/) | ฉบับแปลไทยของขั้น 1-4 + ER + design system + tech stack |\n\n## อ่านตามลำดับ\n\n| # | เอกสาร | ตอบคำถาม |\n|---|---|---|\n| 1 | [requirements.md](requirements.md) | ใครใช้ ทำอะไรได้ อะไรอยู่นอกขอบเขต วัดความสำเร็จอย่างไร |\n| 2 | [pages-and-routes.md](pages-and-routes.md) | มีหน้าอะไร ใครเข้าได้ ต้องเรียกข้อมูลอะไร |\n| 3 | [flows.md](flows.md) | งานแต่ละอย่างไหลอย่างไร และพังตรงไหนได้ |\n| 3a | [diagrams.md](diagrams.md) | ภาพรวมทั้งระบบเป็นแผนภาพ: ผู้ใช้→เป้าหมาย, sitemap, 9 ขั้น, sequence ทั้งภาค, flow F1-F12, วงจรสถานะ |\n| 4 | [data-model.md](data-model.md) | เก็บข้อมูลอะไร ความสัมพันธ์ สถานะ และข้อกำหนดที่ห้ามผิด |\n| 3b | [wireframes-missing.md](wireframes-missing.md) | โครงหน้าที่ wireframe เดิมไม่มี: 0.2 รีเซ็ตรหัสผ่าน, 1.2 บัญชีของฉัน, 2.4.1 ตั้งค่ารูปแบบ |\n| 4a | [api.md](api.md) | มี endpoint อะไร ใครเรียกได้ รูปแบบ error และผลการรัน (ข้อเสนอให้อานนท์ตรวจ) |\n| 5 | [../th/8-tech-stack.md](../th/8-tech-stack.md) | ใช้เทคโนโลยีอะไร อะไรยืนยันแล้ว |\n| 6 | [../th/7-design-system/design-system.md](../th/7-design-system/design-system.md) | หน้าตา คอมโพเนนต์ โครงโค้ด Frontend |\n| 7 | [decisions.md](decisions.md) | ตัดสินใจอะไรไปแล้ว และอะไรยังเปิดอยู่ |\n\n## เริ่มรัน Frontend\n\n```bash\ncd frontend\nnpm install\nnpm run dev\n```\n\nข้อควรระวัง: โครง `src` อยู่ใต้ `frontend/public/` ซึ่ง Vite ไม่ bundle ต้องย้ายเป็น `frontend/src/` ก่อน `npm run build` จึงจะผ่าน ดู [decisions.md → ค้างอยู่](decisions.md#ที่ยังเปิดอยู่)\n\n## ศัพท์ที่ใช้ในเอกสาร\n\n| คำ | ความหมาย |\n|---|---|\n| Profile | หนึ่งภาควิชาต่อหนึ่งภาคเรียน ถูกตรวจทาน เผยแพร่ และเก็บเวอร์ชันเป็นก้อนเดียว |\n| Year plan | แผนของหนึ่ง **หลักสูตร × ชั้นปี** ใน profile อ่านจากหลักสูตรเวอร์ชันเดียวเท่านั้น |\n| Format definition | ไฟล์ตั้งค่า (ข้อมูล ไม่ใช่โค้ด) ที่บอกว่าคอลัมน์ไหนในไฟล์หลักสูตรคือรหัส ชื่อ หน่วยกิต |\n| BLOCKER / WARNING | ปัญหาจากข้อมูลอาจารย์: BLOCKER จัดตารางไม่ได้จนกว่าจะแก้, WARNING รันได้แต่มีคนอาจไม่พอใจ |\n| Pre-check | ตรวจนับก่อนรัน solver ว่าเป็นไปได้ไหม หัวหน้าต้อง acknowledge ก่อนปุ่ม Generate ปลดล็อก |\n| Pin | ล็อกคาบที่ตกลงแล้ว (ใน FET คือ lock) เพื่อรันใหม่โดยคาบนั้นไม่ขยับ |\n| Schedule / Reserve | วิชาเลือก: จัดลงตารางจริง / เก็บเวลาว่างไว้ให้นักศึกษา |\n| Direct edit | หัวหน้าแก้ตารางตรง ๆ ในสถานะ REVIEW เมื่อคุยกับอาจารย์แล้ว บันทึกเป็นการเปลี่ยนแปลงตามปกติ |\n| Project service | บริการเดียวที่เขียนข้อมูล บันทึกทุกการเปลี่ยนและเก็บเวอร์ชัน |\n| FET | ตัวจัดตารางโอเพนซอร์สที่ใช้เป็น solver |\n"}, {"g": "เอกสารนักพัฒนา", "id": "dev-requirements", "t": "ข้อกำหนด", "p": "dev/requirements.md", "md": "# ข้อกำหนด (Requirements)\n\nเรียบเรียงจาก users-and-goals และ user-journeys\n\n## 1. ปัญหาที่แก้\n\nตารางเรียนทำด้วยมือใน Excel และกระดาษ ใช้เวลา 3 วันถึง 1 สัปดาห์ต่อภาค ส่วนใหญ่หมดไปกับการที่อาจารย์คุยกันว่าใครสอนได้เมื่อไหร่ และการเปลี่ยนแปลงยังเข้ามาหลังตาราง \"สุดท้าย\"\n\n## 2. บทบาทและสิทธิ์\n\n| บทบาท | บัญชีสร้างโดย | ขอบเขต |\n|---|---|---|\n| **ADMIN** ผู้ดูแลสถาบัน | หน้าตั้งค่าครั้งแรกตอนติดตั้ง | ภาควิชา, หัวหน้า, ห้องร่วม, ปฏิทิน, รูปแบบหลักสูตร, ระบบ (สำรองข้อมูล SMTP อัปเดต) |\n| **HEAD** หัวหน้าภาควิชา (ผู้ใช้หลัก) | ADMIN เชิญ | ทุกหน้าของภาควิชาตน, เผยแพร่ได้ |\n| **ASSISTANT** ผู้ช่วย | HEAD เชิญ (เชิญได้เฉพาะหัวหน้า) | หน้าเดียวกับ HEAD ทำขั้น 1-8 ได้ |\n| **TEACHER** อาจารย์ | HEAD หรือ ASSISTANT เชิญ | เวลาว่างของฉัน, รายการของฉัน, ตารางของฉัน, คำขอของฉัน |\n| นักศึกษา | ไม่มี | ไม่ใช่ผู้ใช้ ได้รับตารางที่พิมพ์ / PDF จากอาจารย์ |\n\nกฎ:\n- คนเดียวมีหลายบทบาทข้ามภาควิชาได้ (เช่น HEAD ที่หนึ่ง TEACHER อีกที่) ผ่านตัวสลับภาควิชา\n- หนึ่งบัญชีสังกัดได้หลายภาควิชา\n- ADMIN เป็นสิทธิ์ระดับสถาบันติดกับบัญชี (`user.is_admin`) ไม่ใช่สมาชิกภาควิชา บัญชีเดียวเป็น ADMIN และ HEAD/TEACHER พร้อมกันได้ (decisions D12)\n- ไม่มีผู้ดูแลแพลตฟอร์มกลาง โครงการโอเพนซอร์สไม่เห็นข้อมูลของสถาบันใดเลย\n\n### เมทริกซ์สิทธิ์\n\n| การกระทำ | ADMIN | HEAD | ASSISTANT | TEACHER |\n|---|:-:|:-:|:-:|:-:|\n| สร้างภาควิชา / เชิญ HEAD / ห้องร่วม / ปฏิทิน | ✅ | | | |\n| อนุมัติรูปแบบหลักสูตรใหม่ | ✅ | | | |\n| เชิญอาจารย์ / ผู้ช่วย, จัดการห้องของภาควิชา | | ✅ | ✅* | |\n| สร้าง / คัดลอกโปรไฟล์ ทำขั้น 1-8 | | ✅ | ✅ | |\n| เผยแพร่ตาราง | | ✅ | ❌ (ขอให้ HEAD) | |\n| ลบ HEAD / เชิญผู้ช่วยคนอื่น | | ✅ | ❌ | |\n| ส่งเวลาว่าง จัดอันดับวิชา ขอเปลี่ยน | | | | ✅ (เฉพาะของตน) |\n| เห็นตารางของทุกคน | | ✅ | ✅ | ❌ เห็นเฉพาะของตน |\n\n\\* ผู้ช่วยเชิญอาจารย์ได้หรือไม่ ยังเป็นข้อเสนอ ดู [decisions.md](decisions.md)\n\n### แผนภาพ: ใครเชิญใคร และทำอะไรได้\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1046 333\" width=\"1046\" height=\"333\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"บทบาท\"><g data-tip=\"ADMIN ผู้ดูแลสถาบัน&#10;ไปที่:&#10;→ HEAD หัวหน้าภาควิชา (สร้างภาควิชา + เชิญ)&#10;→ ปฏิทิน ห้องร่วม รูปแบบหลักสูตร ระบบ\"><rect x=\"280\" y=\"20\" width=\"220\" height=\"56\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"390\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ADMIN<\/text><text x=\"390\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ผู้ดูแลสถาบัน<\/text><\/g><g data-tip=\"ปฏิทิน ห้องร่วม รูปแบบหลักสูตร ระบบ&#10;มาจาก:&#10;← ADMIN ผู้ดูแลสถาบัน\"><rect x=\"546\" y=\"20\" width=\"220\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"656\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ปฏิทิน ห้องร่วม<\/text><text x=\"656\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">รูปแบบหลักสูตร ระบบ<\/text><\/g><g data-tip=\"HEAD หัวหน้าภาควิชา&#10;มาจาก:&#10;← ADMIN ผู้ดูแลสถาบัน (สร้างภาควิชา + เชิญ)&#10;ไปที่:&#10;→ ASSISTANT ผู้ช่วย (เชิญ)&#10;→ TEACHER อาจารย์ (เชิญ)&#10;→ สร้าง/คัดลอกโปรไฟล์ ขั้น 1-8 + เผยแพร่&#10;→ นักศึกษา ไม่มีบัญชี (พิมพ์/PDF ให้)\"><rect x=\"14\" y=\"126\" width=\"220\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"124\" y=\"150\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">HEAD<\/text><text x=\"124\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">หัวหน้าภาควิชา<\/text><\/g><g data-tip=\"ASSISTANT ผู้ช่วย&#10;มาจาก:&#10;← HEAD หัวหน้าภาควิชา (เชิญ)&#10;ไปที่:&#10;→ TEACHER อาจารย์ (เชิญอาจารย์ได้ไหม (O3))&#10;→ ขั้น 1-8 ได้ เผยแพร่ ลบ HEAD เชิญผู้ช่วย: ไม่ได้\"><rect x=\"280\" y=\"126\" width=\"220\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"390\" y=\"150\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ASSISTANT<\/text><text x=\"390\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ผู้ช่วย<\/text><\/g><g data-tip=\"TEACHER อาจารย์&#10;มาจาก:&#10;← HEAD หัวหน้าภาควิชา (เชิญ)&#10;← ASSISTANT ผู้ช่วย (เชิญอาจารย์ได้ไหม (O3))&#10;ไปที่:&#10;→ เวลาว่าง จัดอันดับวิชา ขอเปลี่ยน เห็นเฉพาะตารางของตน&#10;→ นักศึกษา ไม่มีบัญชี (แจกตาราง)\"><rect x=\"546\" y=\"126\" width=\"220\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"656\" y=\"150\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">TEACHER<\/text><text x=\"656\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">อาจารย์<\/text><\/g><g data-ti ,149.0 801.0,159.0\" fill=\"#4b5563\"/><rect x=\"191\" y=\"84\" width=\"132\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"257\" y=\"95\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">สร้างภาควิชา + เชิญ<\/text><rect x=\"239\" y=\"136\" width=\"36\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"257\" y=\"147\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">เชิญ<\/text><rect x=\"606\" y=\"188\" width=\"36\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"624\" y=\"199\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">เชิญ<\/text><rect x=\"484\" y=\"224\" width=\"93\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"531\" y=\"235\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">พิมพ์/PDF ให้<\/text><polyline points=\"390,76 390,102 124,102 124,126\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ADMIN ผู้ดูแลสถาบัน → HEAD หัวหน้าภาควิชา&#10;สร้างภาควิชา + เชิญ\"/><polyline points=\"500,48 546,48\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ADMIN ผู้ดูแลสถาบัน → ปฏิทิน ห้องร่วม รูปแบบหลักสูตร ระบบ\"/><polyline points=\"234,154 280,154\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD หัวหน้าภาควิชา → ASSISTANT ผู้ช่วย&#10;เชิญ\"/><polyline points=\"124,182 124,208 648,208 648,182\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD หัวหน้าภาควิชา → TEACHER อาจารย์&#10;เชิญ\"/><polyline points=\"500,154 546,154\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ASSISTANT ผู้ช่วย → TEACHER อาจารย์&#10;เชิญอาจารย์ได้ไหม (O3)\"/><polyline points=\"108,182 108,218 124,218 124,254\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD หัวหน้าภาควิชา → สร้าง/คัดลอกโปรไฟล์ ขั้น 1-8 + เผยแพร่\"/><polyline points=\"390,182 390,244\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ASSISTANT ผู้ช่วย → ขั้น 1-8 ได้ เผยแพร่ ลบ HEAD เชิญผู้ช่วย: ไม่ได้\"/><polyline points=\"664,182 664,213 656,213 656,244\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"TEACHER อาจารย์ → เวลาว่าง จัดอันดับวิชา ขอเปลี่ยน เห็นเฉพาะตารางของตน\"/><polyline points=\"140,182 140,220 922,220 922,182\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD หัวหน้าภาควิชา → นักศึกษา ไม่มีบัญชี&#10;พิมพ์/PDF ให้\"/><polyline points=\"766,154 812,154\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"TEACHER อาจารย์ → นักศึกษา ไม่มีบัญชี&#10;แจกตาราง\"/><\/svg><\/div>\n\n## 3. เป้าหมาย\n\n### หัวหน้าภาควิชา\n\n| รหัส | เป้าหมาย | วิธีรองรับ |\n|---|---|---|\n| G1 | ตารางไม่ชนทุกกลุ่ม | FET + pre-check + core lib checker |\n| G2 | เร็วกว่า 3 วัน-1 สัปดาห์มาก | รอบเวลาว่างบนเว็บ, FET < 1 วินาที, คัดลอกจากภาคก่อน, ตัวเลือก N แบบ |\n| G3 | คุมได้เอง | หน้าจัดตาราง, ตรวจสดตอนวาง, pin + รันใหม่รอบ pin, Schedule/Reserve |\n| G4 | เชื่อข้อมูลที่อ่านจากไฟล์ได้ | ทุกค่าลิงก์ไปหน้าต้นทาง, แถวแดงพร้อมเหตุผล |\n| G5 | พิมพ์ A4 ดูเป็นทางการ | พรีวิวพิมพ์, ฟอนต์ไทย, ส่งออก PDF |\n| G6 | ใช้งานต่อภาคถัดไป | PostgreSQL, profile manager, คัดลอกจากภาคก่อน |\n\n### อื่น ๆ\n\n| รหัส | ผู้ใช้ | เป้าหมาย |\n|---|---|---|\n| T1 | อาจารย์ | เวลาไม่ว่างและความต้องการได้รับการเคารพ |\n| T2 | อาจารย์ | รู้เมื่อมีการเปลี่ยนที่กระทบตน |\n| I1 | ADMIN | ภาควิชาไม่จองห้องร่วมซ้ำ |\n\n## 4. ข้อกำหนดที่ห้ามผิด (ต้องเป็นจริงเสมอ)\n\n| รหัส | ห้าม | บังคับด้วย |\n|---|---|---|\n| N1 | เปลี่ยนตารางโดยผู้ใช้ไม่ได้สั่ง | project service เขียนเพียงตัวเดียว, บันทึกทุกการเปลี่ยน, เก็บเวอร์ชัน |\n| N2 | ข้อมูลอาจารย์ออกนอกสถาบัน | ล็อกอิน + บทบาท, self-hosted, PDPA |\n| N3 | นักศึกษาเข้าระบบ | ไม่มีบทบาทนักศึกษา ไม่มีลิงก์สาธารณะ |\n\n## 5. ตัวชี้วัดความสำเร็จ\n\n- ทั้งภาคจากไฟล์ถึงพิมพ์ ใช้แรงงาน ≤ 30 นาที (เป้าแรก)\n- ตารางที่บันทึกไม่มีการชนแบบ hard\n- ทุกคาบถูกจัดลง หรืออยู่ในถาด \"ยังไม่ลง\" พร้อมเหตุผลและวิธีแก้ใกล้สุด\n- ไม่ต้องแก้ไฟล์ด้วยมือ\n- วัดในแอป: เวลาต่อขั้น, จำนวนครั้งที่ย้ายด้วยมือ, จำนวนครั้งที่รัน FET, คะแนนคุณภาพ (กฎ soft + คะแนน 1-5 จากหัวหน้า)\n\n## 6. นอกขอบเขตตอนนี้\n\n- นักศึกษาเลือกวิชาเลือกในระบบ (Reserve เก็บเวลาไว้ให้เท่านั้น)\n- ตารางสอบ\n- ลิงก์สาธารณะสำหรับนักศึกษา (ตัดสินใจแล้ว: ไม่ทำ)\n\n## 7. ความต้องการเชิงฟังก์ชันที่พลาดไม่ได้\n\nที่มาจากเส้นทางผู้ใช้ เป็นข้อกำหนดที่กระทบการออกแบบโดยตรง:\n\n1. **ตรวจจับก่อน ยืนยันทีหลัง:** ระบบอ่านไฟล์แล้วเติมค่า ผู้ใช้ยืนยันหรือแก้ ทุกค่าแสดงหลักฐาน (หน้า + ข้อความที่จับคู่) เลย์เอาต์ที่ไม่รู้จักห้ามเดาเงียบ ๆ ให้ผู้ใช้ชี้คอลัมน์แล้วบันทึกเป็น format definition\n2. **ตรวจเร็ว:** คลิกค่าใดก็ได้ แล้วไฟล์ต้นฉบับเปิดข้างตารางที่หน้านั้นพร้อมไฮไลต์ มีปุ่ม \"แถวแดงถัดไป\" และไปต่อไม่ได้ตราบที่ยังมีแถวแดง\n3. **ปัญหาจากข้อมูลอาจารย์ถูกสร้างโดยระบบ:** BLOCKER ต้องแก้, WARNING แก้หรือ \"ยอมรับ + หมายเหตุ\" ปิดรายการได้ด้วยการตัดสินใจที่บันทึก (ใคร เมื่อไหร่ ทำไม) ไปต่อได้เมื่อไม่เหลือ BLOCKER และทุก WARNING ถูกตัดสินใจ\n4. **Pre-check รายงานต้อง acknowledge** ก่อน Generate ปลดล็อก การรับทราบถูกบันทึกกับการรัน\n5. **ผลบางส่วนไม่ใช่ความล้มเหลว:** ตารางบางส่วน + ถาดคาบที่ยังไม่ลง แต่ละคาบมีเหตุผลและวิธีแก้ใกล้สุด\n6. **เปลี่ยนน้อยที่สุด:** การอนุมัติคำขอรันใหม่โดยปักหมุดทุกอย่างที่เหลือ และแสดงผลกระทบก่อน (\"นี่จะย้ายอีก 2 คาบ\")\n7. **Direct edit:** ใน REVIEW หัวหน้าแก้บนตารางได้ตรง ๆ พร้อมช่อง \"ตกลงกับ ___\" แจ้งอาจารย์ที่ได้รับผลกระทบพร้อมเก่า / ใหม่ แก้เล็กที่ไม่กระทบอื่นมีผลทันที แก้ที่ย้ายคาบอื่นต้องถามก่อน หลังเผยแพร่จะสร้างเวอร์ชันใหม่เสมอ\n8. **เวลาว่างครั้งเดียวต่อคน** ใช้ร่วมทุกภาควิชา แต่การจัดอันดับวิชาแยกตามภาควิชา HEAD เห็นช่อง \"ไม่ว่างที่ภาควิชาอื่น\"\n"}, {"g": "เอกสารนักพัฒนา", "id": "dev-pages", "t": "หน้าและเส้นทาง", "p": "dev/pages-and-routes.md", "md": "# หน้าและเส้นทาง (Pages and routes)\n\nเรียบเรียงจาก sitemap เลขหน้า (เช่น `2.4`) ตรงกับต้นฉบับ ใช้อ้างอิงข้ามเอกสาร\nเส้นทาง URL ด้านล่างเป็น **ข้อเสนอ** (sitemap ไม่ได้กำหนด URL)\n\nสัญลักษณ์: `*` = หน้าใหม่ที่ยังไม่อยู่ในเส้นทางผู้ใช้เดิม\n\n## 1. โครงรวม\n\n<div class=\"er-svg\"><svg xmlns=\"http:// " stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ระบบ ตารางเรียน → 2  หัวหน้า / ผู้ช่วย\"/><polyline points=\"150,436 176,436 176,657 220,657\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ระบบ ตารางเรียน → 3  ผู้ดูแลสถาบัน\"/><polyline points=\"150,445 188,445 188,876 220,876\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ระบบ ตารางเรียน → 4  อาจารย์\"/><\/svg><\/div>\n\nทุกหน้าหลังล็อกอินมีแถบบน: ตัวสลับภาควิชา (ถ้า `is_admin` มีรายการ \"ผู้ดูแลสถาบัน\" แยก) · กระดิ่ง (1.1) · เมนูบัญชี (1.2)\n\n## 2. สาธารณะ (ยังไม่ล็อกอิน)\n\n| เลข | หน้า | เส้นทางเสนอ | หมายเหตุ |\n|---|---|---|---|\n| 0.0 * | ตั้งค่าครั้งแรก | `/setup` | แสดง **ครั้งเดียว** หลังติดตั้ง (ชื่อสถาบัน, ผู้ดูแลคนแรก, ภาษา) แล้วหายไป |\n| 0.1 | ล็อกอิน | `/login` | |\n| 0.2 | ลืม / รีเซ็ตรหัสผ่าน | `/reset` · `/reset/:token` | ไม่มี SMTP: บอกให้ขอลิงก์จากผู้ดูแล/หัวหน้า ผู้ดูแล/หัวหน้าสร้างลิงก์ให้คัดลอกส่งเอง (D12) ร่างหน้า: [wireframes-missing](wireframes-missing.md) |\n| 0.3 | รับคำเชิญ | `/invite/:token` | ตั้งรหัสผ่าน หรือเข้าด้วยบัญชีเดิมถ้าอยู่ภาควิชาอื่นแล้ว ลิงก์หมดอายุ → ขอส่งใหม่ |\n\n## 3. ทุกบทบาท\n\n| เลข | หน้า | เส้นทางเสนอ | เนื้อหา |\n|---|---|---|---|\n| 1.1 * | การแจ้งเตือน | `/notifications` | คำเชิญ กำหนดส่ง การเตือน \"แก้โดย <หัวหน้า>: <หมายเหตุ>\" เผยแพร่แล้ว |\n| 1.2 * | บัญชีของฉัน | `/account` | ชื่อ รหัสผ่าน ภาษา (ไทย/อังกฤษ) ตั้งค่าอีเมล ร่างหน้า: [wireframes-missing](wireframes-missing.md) |\n\n## 4. HEAD / ASSISTANT\n\n| เลข | หน้า | เส้นทางเสนอ | เนื้อหาหลัก | เส้นทาง* |\n|---|---|---|---|---|\n| 2.1 | หน้าแรก | `/` | ปุ่มใหญ่ \"เริ่มตารางเรียนภาคนี้\" + สิ่งที่ต้องทำ (อาจารย์ล่าช้า, blocker, คำขอใหม่) | A1 |\n| 2.2 | โปรไฟล์ | `/profiles` | รายการ (ชื่อ ภาคเรียน ชั้นปี สถานะ) ปุ่ม ใหม่ / คัดลอกจากภาคก่อน | A2 |\n| 2.3 * | บุคลากร & ห้อง | `/people` | อาจารย์ (เชิญ/ลบ) และห้องของภาควิชา อยู่ **นอก** โปรไฟล์ พิมพ์ครั้งเดียวใช้ซ้ำทุกภาค | F12 |\n| 2.4 | พื้นที่ทำงานโปรไฟล์ | `/profiles/:id/…` | แถบขั้นตอน 9 ขั้น + แท็บ หลักสูตร×ชั้นปี | A3-A11 |\n| 2.4.2 | เวอร์ชัน + บันทึก | `/profiles/:id/versions` | ทุกเวอร์ชัน ใครเปลี่ยนอะไร \"เริ่มการเปลี่ยนแปลง\" หลังเผยแพร่ | A11-A12 |\n\n\\* รหัสขั้นในเส้นทางผู้ใช้ (A1…A12)\n\n### 4.1 ขั้นในพื้นที่ทำงาน 2.4\n\n| ขั้น | หน้า | เส้นทางเสนอ | ทำอะไร | ต่อชั้นปี? | เงื่อนไขไปต่อ |\n|---|---|---|---|:-:|---|\n| 1 | ตั้งค่า (A3) | `…/setup` | ชื่อ เลือกภาคเรียน (จากปฏิทิน 3.4) อัปโหลดไฟล์ การ์ด \"สิ่งที่เราพบ\" | | ยืนยันค่าที่ตรวจจับ |\n| 1a | ตั้งค่ารูปแบบ 2.4.1 | `…/setup/format` | เฉพาะเมื่อเลย์เอาต์ไม่รู้จัก ชี้คอลัมน์ บันทึกเป็น format definition สถานะ unverified | | |\n| 2 | ตรวจข้อมูล (A4) | `…/review` | ตาราง / ผังกระบวนวิชา แผงไฟล์ข้าง \"แถวแดงถัดไป\" | ✅ | ไม่เหลือแถวแดง |\n| 3 | รอบเวลาว่าง (A5) | `…/availability` | เลือกอาจารย์ กำหนดส่ง กระดานสถานะ เตือน | | ทุกคนมีคำตอบ |\n| 4 | ข้อมูลอาจารย์ (A6) | `…/issues` | BLOCKER / WARNING + เธรดความเห็น | | ไม่มีรายการที่ยังไม่ตัดสินใจ |\n| 5 | กฎ + วิชาเลือก (A7) | `…/rules` | ตารางเวลา กลุ่ม จำนวนห้อง Schedule/Reserve น้ำหนักกฎ Check → รายงาน → Acknowledge | ✅ | acknowledge รายงาน |\n| 6 | สร้าง + จัดตาราง (A8) | `…/generate` | Generate ตาราง ถาด ตัวเลือก pin รันใหม่ แท็บย่อย จัดตาราง / พรีวิวพิมพ์ | ✅ | ทุกคาบมีเวลา ไม่ฝ่าฝืนกฎ hard |\n| 7 | ห้อง + อาจารย์ (A9) | `…/assign` | ยืนยันห้อง (FET วาง) ยืนยันอาจารย์ต่อคาบ พรีวิว A4 สด | | ทุกคาบมีห้องและอาจารย์ |\n| 8 | อาจารย์ตรวจทาน (A10) | `…/review-by-teachers` | ส่งเข้า REVIEW รายการคำขอ + ผลกระทบ direct edit | | |\n| 9 | เผยแพร่ + พิมพ์ (A11) | `…/publish` | เผยแพร่ → เวอร์ชันล็อก ดาวน์โหลดต่อกลุ่ม/อาจารย์/ห้อง | | เฉพาะ HEAD |\n\n**กฎแถบขั้น:** ขั้นหนึ่งปลดล็อกเมื่อขั้นก่อนเสร็จ ย้อนไปแก้ขั้นที่เสร็จแล้วจะทำให้ขั้นหลัง **ล้าสมัย** (out of date) และถ้าแก้ในแท็บชั้นปีเดียว จะล้าสมัยเฉพาะชั้นปีนั้น สถานะขั้น: เสร็จ ✓ / ปัจจุบัน / ล้าสมัย ⚠ / ล็อก 🔒 ขั้นล็อกต้องมี tooltip บอกว่าติดอะไร\n\n## 5. ADMIN\n\n| เลข | หน้า | เส้นทางเสนอ | เนื้อหา |\n|---|---|---|---|\n| 3.1 | หน้าแรกผู้ดูแล | `/admin` | ภาควิชาไหนเผยแพร่แล้ว ไหนล่าช้า มีอัปเดตไหม |\n| 3.2 | ภาควิชา + หัวหน้า | `/admin/departments` | สร้างภาควิชา เชิญ/ลบหัวหน้า แสดง \"เชิญเมื่อ N วันก่อน\" + ส่งอีกครั้ง |\n| 3.3 | ห้องร่วม | `/admin/rooms` | ห้องที่หลายภาควิชาใช้ การจองระหว่างภาควิชา |\n| 3.4 * | ปฏิทินการศึกษา | `/admin/calendar` | วันที่ภาคเรียนและวันหยุด **วันที่ภาคเรียนมาจากที่นี่เท่านั้น ไม่เอาจากไฟล์หลักสูตร** |\n| 3.5 * | รูปแบบหลักสูตร | `/admin/formats` | รูปแบบที่มากับรุ่น + ที่สร้างในที่นี้ อนุมัติ unverified, ส่งออกไปโครงการ |\n| 3.6 * | ระบบ | `/admin/system` | สำรอง/กู้คืน SMTP (ไม่บังคับ) เวอร์ชัน สถานะบริการ บันทึกการรัน solver |\n\n## 6. TEACHER\n\n| เลข | หน้า | เส้นทางเสนอ | เนื้อหา |\n|---|---|---|---|\n| 4.1 | หน้าแรก | `/t` | สิ่งที่ครบกำหนด: กำหนดส่ง รายการเกี่ยวกับฉัน การตรวจทานที่เปิด |\n| 4.2 | เวลาว่างของฉัน | `/t/availability` | ตารางไม่ว่างรายสัปดาห์ จัดอันดับวิชา ชั่วโมงสูงสุดต่อวัน แก้ได้จนกำหนด ใบรับ |\n| 4.3 | รายการของฉัน | `/t/issues` | blocker/warning เกี่ยวกับฉัน (เธรดความเห็นเดียวกับขั้น 4 ของ HEAD) |\n| 4.4 | ตารางของฉัน | `/t/timetable` | เฉพาะคาบของฉัน ติดป้าย DRAFT ใน REVIEW หรือเผยแพร่แล้ว พิมพ์/ดาวน์โหลด \"ขอเปลี่ยน\" |\n| 4.5 | คำขอของฉัน | `/t/requests` | รอ / อนุมัติ / ปฏิเสธ + หมายเหตุ และการเปลี่ยนที่หัวหน้าทำให้ฉัน |\n\n## 7. หน้าที่เชื่อมกัน\n\n| สถานการณ์ | ทางผ่านหน้า |\n|---|---|\n| ติดตั้ง | `docker compose up` → 0.0 → 3.1 |\n| หัวหน้า ภาคใหม่ | 0.1 → 2.1 → 2.2 (คัดลอกจากภาคก่อน) → 2.4 ขั้น 1…9 |\n| อาจารย์ใหม่ | 2.3 เชิญ → อีเมล → 0.3 → 4.1 |\n| รอบเวลาว่าง | HEAD 2.4(3) เปิดรอบ → TEACHER 1.1 → 4.2 → HEAD ดูสถานะ 2.4(3) |\n| รายการปัญหา | HEAD 2.4(4) ↔ TEACHER 4.3 (เธรดเดียวกัน) |\n| ตรวจทาน | HEAD 2.4(8) ส่ง → 4.4 → 4.5 ขอ → HEAD อนุมัติ/ปฏิเสธ → 1.1 |\n| แก้ตัวต่อตัว | HEAD 2.4(8) direct edit → 1.1 \"แก้โดย…\" → 4.4 |\n| หลังเผยแพร่ | HEAD 2.4.2 \"เริ่มการเปลี่ยนแปลง\" → เวอร์ชันใหม่ → 1.1 |\n| ไฟล์ที่ไม่รู้จัก | HEAD 2.4(1) → 2.4.1 → ADMIN 3.5 อนุมัติ → (ไม่บังคับ) ส่งออกไปโครงการ |\n\n### แผนภาพ: ล็อกอินแล้วไปหน้าไหน\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" ลับ<\/text><rect x=\"159\" y=\"84\" width=\"80\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"199\" y=\"95\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">เชิญผู้ช่วย<\/text><polyline points=\"184,158 214,158\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F1 ตั้งค่าสถาบัน → F2 เข้าร่วมด้วยคำเชิญ&#10;เชิญ HEAD\"/><polyline points=\"384,158 414,158\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F2 เข้าร่วมด้วยคำเชิญ → F3 เริ่มภาคใหม่\"/><polyline points=\"584,158 614,158\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F3 เริ่มภาคใหม่ → F4 อัปโหลด+อ่านไฟล์\"/><polyline points=\"784,158 814,158\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F4 อัปโหลด+อ่านไฟล์ → F5 รอบเวลาว่าง\"/><polyline points=\"899,186 899,240\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F5 รอบเวลาว่าง → F6 ปัญหาข้อมูลอาจารย์\"/><polyline points=\"784,268 814,268\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F6 ปัญหาข้อมูลอาจารย์ → F7 กฎ/สร้าง/จัดตาราง\"/><polyline points=\"584,268 614,268\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F7 กฎ/สร้าง/จัดตาราง → F8 ห้องและอาจารย์\"/><polyline points=\"384,268 414,268\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F8 ห้องและอาจารย์ → F9 ตรวจทาน\"/><polyline points=\"184,260 214,260\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F9 ตรวจทาน → F10 เผยแพร่\"/><polyline points=\"184,276 214,276\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F10 เผยแพร่ → F9 ตรวจทาน&#10;เปลี่ยนภายหลัง\"/><polyline points=\"691,76 691,130\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F4 อัปโหลด+อ่านไฟล์ → F11 อนุมัติรูปแบบ&#10;เลย์เอาต์ไม่รู้จัก\"/><polyline points=\"707,76 707,130\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F11 อนุมัติรูปแบบ → F4 อัปโหลด+อ่านไฟล์&#10;ส่งกลับ\"/><polyline points=\"99,76 99,102 299,102 299,130\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"F12 มอบงานผู้ช่วย → F2 เข้าร่วมด้วยคำเชิญ&#10;เชิญผู้ช่วย\"/><\/svg><\/div>\n\nเส้นทึบ = ลำดับปกติ · เส้นประ = ทางแยกหรือวนกลับ · 🟧 ADMIN · 🟦 HEAD/ASSISTANT · 🟩 ใช้ร่วมกับ TEACHER\n\n## F1 ตั้งค่าสถาบัน\n**ผู้ทำ** ADMIN (ครั้งเดียว) · **เริ่ม** `docker compose up` → 0.0\n\n1. 0.0 ตั้งค่าครั้งแรก: ชื่อสถาบัน ภาษา บัญชีผู้ดูแลคนแรก → 3.1\n2. 3.4 ปฏิทิน: ภาคเรียน + วันหยุด\n3. 3.2 เพิ่มภาควิชา → เชิญ HEAD\n   - ตั้ง SMTP ใน 3.6 แล้ว → ส่งอีเมล\n   - ยังไม่ตั้ง → หน้าแสดง **ลิงก์เชิญ** ให้คัดลอกส่งเอง\n4. 3.3 ห้องร่วม\n\n**ผลลัพธ์** 3.1 แสดงแต่ละภาควิชา: เชิญแล้ว / เข้าร่วมแล้ว / มีโปรไฟล์ / เผยแพร่แล้ว\n**ผิดพลาด** HEAD ไม่ยอมรับเชิญ → 3.2 แสดง \"เชิญเมื่อ 7 วันก่อน\" + ส่งอีกครั้ง\n\n## F2 เข้าร่วมด้วยคำเชิญ\n**ผู้ทำ** HEAD / ASSISTANT / TEACHER · **เริ่ม** 0.3\n\n| มีบัญชีแล้ว? | ทำ |\n|---|---|\n| ใช่ | ล็อกอิน → ภาควิชาใหม่ถูกเพิ่มในตัวสลับภาควิชา |\n| ไม่ | ตั้งชื่อ + รหัสผ่าน → สร้างบัญชี |\n\n**ผลลัพธ์** ไปหน้าแรกของบทบาทที่ถูกเชิญ (2.1 หรือ 4.1) ครั้งแรกมีแนะนำ 3 ขั้น\n**ผิดพลาด** ลิงก์หมดอายุ → \"ขอให้หัวหน้า/ผู้ดูแลส่งใหม่\" ไม่สร้างบัญชี\n\n## F3 เริ่มตารางเรียนภาคนี้\n**ผู้ทำ** HEAD / ASSISTANT · **เริ่ม** 2.1 \"เริ่มตารางเรียนภาคนี้\"\n\n1. มีโปรไฟล์ภาคก่อน?\n   - ใช่ → 2.2 **คัดลอกจากภาคก่อน** (เก็บบุคลากร ห้อง กฎ หลักสูตร; ชั้นปีเลื่อนขึ้น 1 ปี; เพิ่มกลุ่มปี 1 ใหม่)\n   - ไม่ → 2.2 ใหม่\n2. 2.4 ขั้น 1: เลือกภาคเรียนจากปฏิทิน (ไม่เอาจากไฟล์)\n3. เลือกหลักสูตรที่สอนในภาคนี้ (ค.บ. / เทียบโอน / ศษ.ม. / ปร.ด. …)\n4. อัปโหลดไฟล์หลักสูตรต่อหลักสูตร (PDF, Word, Excel, สแกน, รูปถ่าย) → F4\n\n**ผลลัพธ์** พื้นที่ทำงานมี 1 แท็บต่อ หลักสูตร × ชั้นปี ทุกขั้น \"ยังไม่เริ่ม\"\n**ผิดพลาด** ภาคเรียนไม่อยู่ในปฏิทิน → \"ขอให้ผู้ดูแลเพิ่ม\" (3.4) HEAD พิมพ์วันที่เองไม่ได้\n\n## F4 อัปโหลดและอ่านไฟล์หลักสูตร\n**ผู้ทำ** HEAD / ASSISTANT · **เริ่ม** 2.4 ขั้น 1\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 816 1098\" width=\"816\" height=\"1098\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"\"><g data-tip=\"2.4 ขั้น 1 อัปโหลด&#10;ไปที่:&#10;→ เก็บ og_upload ไฟล์ตามที่ให้มา ไม่เคยแก้\"><rect x=\"14\" y=\"20\" width=\"240\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"134\" y=\"45\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">2.4 ขั้น 1 อัปโหลด<\/text><\/g><g data-tip=\"เก็บ og_upload ไฟล์ตามที่ให้มา ไม่เคยแก้&#10;มาจาก:&#10;← 2.4 ขั้น 1 อัปโหลด&#10;ไปที่:&#10;→ ชนิดจริง (ดูจากเนื้อหา)\"><rect x=\"14\" y=\"104\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#f3f4f6\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/><text x=\"134\" y=\"128\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">เก็บ og_upload<\/text><text x=\"134\" y=\"146\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ไฟล์ตามที่ให้มา ไม่เคยแก้<\/text><\/g><g data-tip=\"ชนิดจริง (ดูจากเนื้อหา)&#10;มาจาก:&#10;← เก็บ og_upload ไฟล์ตามที่ให้มา ไม่เคยแก้&#10;ไปที่:&#10;→ แปลง + normalise (PDF มีข้อความ/Word/Excel)&#10;→ OCR + glyph tool (สแกน/รูป/PDF ไม่มีข้อความ)&#10;→ อ่านไฟล์นี้ไม่ได้: เหตุผล ไม่บันทึกอะไร (ว่าง เสีย zip)\"><polygon points=\"30,204 238,204 254,236 238,268 30,268 14,236\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"134\" y=\"232\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ชนิดจริง<\/text><text x=\"134\" y=\"250\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">(ดูจากเนื้อหา)<\/text><\/g><g data-tip=\"แปลง + normalise&#10;มาจาก:&#10;← ชนิดจริง (ดูจากเนื้อหา) (PDF มีข้อความ/Word/Excel)&#10;ไปที่:&#10;→ normalised_upload\"><rect x=\"14\" y=\"338\" width=\"240\" height=\"40\" rx=\"5\" fill=\"#f3f4f6\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/><text x=\"134\" y=\"363\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">แปลง + normalise<\/text><\/g><g data-tip=\"OCR + glyph tool&#10;มาจาก:&#10;← ชนิดจริง (ดูจากเนื้อหา) (สแกน/รูป/PDF ไม่มีข้อความ)&#10;ไปที ransparent\" stroke-width=\"14\" data-tip=\"normalised_upload → เลย์เอาต์เป็น รูปแบบที่รู้จัก?\"/><polyline points=\"126,584 126,609 134,609 134,634\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip='เลย์เอาต์เป็น รูปแบบที่รู้จัก? → การ์ด \"สิ่งที่เราพบ\" ทุกค่ามีหน้าที่มา&#10;ใช่'/><polyline points=\"142,584 142,610 408,610 408,634\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"เลย์เอาต์เป็น รูปแบบที่รู้จัก? → 2.4.1 ชี้คอลัมน์ตัวอย่าง บันทึกเป็น format unverified&#10;ไม่\"/><polyline points=\"408,690 408,734\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"2.4.1 ชี้คอลัมน์ตัวอย่าง บันทึกเป็น format unverified → ADMIN 3.5 → F11\"/><polyline points=\"134,690 134,734\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip='การ์ด \"สิ่งที่เราพบ\" ทุกค่ามีหน้าที่มา → ยืนยัน หรือเลือกรูปแบบอื่น'/><polyline points=\"134,774 134,818\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ยืนยัน หรือเลือกรูปแบบอื่น → ขั้น 2 ตรวจข้อมูล ต่อ หลักสูตร × ชั้นปี\"/><polyline points=\"134,874 134,918\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ขั้น 2 ตรวจข้อมูล ต่อ หลักสูตร × ชั้นปี → ยังมีแถวแดง?\"/><polyline points=\"118,966 118,1001 134,1001 134,1036\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ยังมีแถวแดง? → ขั้น 2 เสร็จ&#10;ไม่\"/><polyline points=\"134,966 134,992 408,992 408,1028\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ยังมีแถวแดง? → ไปต่อล็อก เหลือ N ค่าที่ต้องการคุณ&#10;ใช่\"/><polyline points=\"528,1056 562,1056\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ไปต่อล็อก เหลือ N ค่าที่ต้องการคุณ → แถวแดงถัดไป → ไฟล์เปิดข้างตาราง แก้ค่า หรือ ถูกแล้ว\"/><polyline points=\"150,966 150,1004 682,1004 682,1028\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"แถวแดงถัดไป → ไฟล์เปิดข้างตาราง แก้ค่า หรือ ถูกแล้ว → ยังมีแถวแดง?\"/><\/svg><\/div>\n\nขั้น 2 ตรวจข้อมูล (ต่อ หลักสูตร × ชั้นปี, ตาราง | ผังกระบวนวิชา):\n- ค่าที่ตัวอ่าน **มั่นใจ** แสดงปกติ ค่าที่ **ไม่มั่นใจ** เป็นแดงพร้อมเหตุผลและภาพครอบหน้า\n- \"แถวแดงถัดไป\" → ไฟล์เปิดข้างตาราง ไฮไลต์ตำแหน่ง → แก้ค่า หรือ \"ถูกแล้ว\"\n- ยังมีแดง → ปุ่มไปต่อล็อก (\"เหลือ 3 ค่าที่ต้องการคุณ\")\n\n**ผลลัพธ์** ทุกแถวของแผนมี: หลักสูตร ชั้นปี ภาคเรียน รหัส (หรือ \"slot\") ชื่อ หน่วยกิต L-P-S\n**ผิดพลาด**\n- วิชาเดียวกันอ่านต่างกันระหว่าง \"แผน\" กับ \"รายการวิชา\" → แดง แสดงสองค่า ให้ HEAD เลือก\n- อัปโหลดไฟล์ใหม่ทับ → ขั้นหลังจากนั้น **ล้าสมัยเฉพาะหลักสูตรนั้น**\n\n## F5 รอบเวลาว่าง\n**ผู้ทำ** HEAD/ASSISTANT เปิดรอบ · TEACHER ตอบ\n\n**HEAD** (2.4 ขั้น 3): เลือกอาจารย์ของภาคนี้จาก 2.3 → ตั้งกำหนดส่ง → เปิดรอบ → อาจารย์ได้แจ้งเตือน (1.1 + อีเมลถ้าตั้ง)\n\n**TEACHER** (4.1 → 4.2):\n- ภาคนี้กรอกให้ภาควิชาอื่นแล้ว? → แสดงตารางเดิม (ครั้งเดียวต่อคน); มีแต่ **การจัดอันดับวิชา** ที่แยกตามภาควิชา\n- ยังไม่เคย → คลิกเวลาไม่ว่างบนตารางรายสัปดาห์ + จัดอันดับวิชา + ชั่วโมงสูงสุด/วัน\n- ส่ง → ใบรับ (\"ส่งแล้ว หัวหน้าเห็น …\") แก้ได้จนกำหนด\n\n**HEAD ติดตาม:** กระดาน ส่งแล้ว / ยังไม่ส่ง / ล่าช้า → ส่งเตือน เลยกำหนดแล้วมีคนขาด → กรอกแทน หรือ \"ว่างได้ทุกเวลา\"\n\n**ผลลัพธ์** ขั้น 3 เสร็จเมื่อ **ทุกอาจารย์ที่เลือกมีคำตอบ**\n**ผิดพลาด** เวลาไม่ว่างเปลี่ยนหลังกำหนด → อาจารย์ขอ HEAD; HEAD แก้ (บันทึก)\n\n## F6 แก้ปัญหาจากข้อมูลอาจารย์\n**ผู้ทำ** HEAD/ASSISTANT · TEACHER ให้ความเห็น · **เริ่ม** 2.4 ขั้น 4\n\nระบบสร้างรายการเอง:\n\n| ชนิด | ตัวอย่าง | ทางแก้ |\n|---|---|---|\n| BLOCKER | วิชาที่ไม่มีใครสอนได้ | มอบอาจารย์ / ทำเครื่องหมาย \"อาจารย์ภายนอก / ต้องจ้าง\" / แบ่งกลุ่ม |\n| BLOCKER | อาจารย์สองคนอยากสอนวิชาเดียว | เลือกคนเดียว / แบ่งกลุ่มให้ทั้งสอง |\n| WARNING | ชั่วโมงของวิชาเกินเวลาว่างของอาจารย์ | แก้ หรือ **ยอมรับ + หมายเหตุ** |\n\n- เปิดรายการ → เธรดความเห็น (TEACHER เห็นที่ 4.3 และตอบที่นั่น)\n- ปิดรายการได้ด้วยการตัดสินใจ บันทึก **ใคร เมื่อไหร่ ทำไม**\n- ยังมีรายการไม่ตัดสินใจ → ขั้น 4 ยังเปิด\n\n**ผลลัพธ์** ทุกวิชามีอาจารย์ (หรืออาจารย์ภายนอกที่ทำเครื่องหมาย)\n\n## F7 กฎ ตรวจ สร้าง จัดตาราง\n**ผู้ทำ** HEAD/ASSISTANT · **เริ่ม** 2.4 ขั้น 5\n\n**ขั้น 5 (กฎ):**\n- ตารางเวลา (จากโปรไฟล์), กลุ่มต่อ หลักสูตร × ชั้นปี, จำนวนห้อง (**ต้องมีก่อนจัดตาราง**)\n- วิชาเลือกแต่ละช่อง → **Schedule** (เลือกวิชา) หรือ **Reserve** (เก็บชั่วโมงว่าง)\n- กฎ soft: เปิด/ปิด + น้ำหนัก · กฎ hard (จากหลักสูตร): แสดงแต่แก้ไม่ได้\n- Check → รายงาน pre-check (OK / ปัญหา / กฎเสี่ยง)\n  - เป็นไปไม่ได้เมื่อนับดู → เหตุผล + วิธีแก้ใกล้สุด (เช่น \"ปี 2 ต้องการ 38 ชม. สัปดาห์มี 30\") → กลับไปกฎ\n  - ผ่าน → **Acknowledge** → Generate ปลดล็อก (การรับทราบถูกบันทึกกับการรัน)\n\n**ขั้น 6 (Generate):**\n- ได้ตัวเลือกที่ดีที่สุด + คะแนนคุณภาพ\n- ลงครบ → ตาราง · ไม่ครบ → **ตารางบางส่วน + ถาด** (แต่ละคาบมีเหตุผล + วิธีแก้ใกล้สุด)\n- ลากคาบ → ตรวจสดตอนวาง: OK หรือช่องแดง + เหตุผล\n- Pin คาบที่ตกลง · รันใหม่รอบ pin (ขยับเฉพาะ หลักสูตร × ชั้นปีนั้น)\n- อาจารย์ที่ไม่ว่างในภาควิชาอื่น แสดงเป็นช่องเทา \"ไม่ว่างที่อื่น\"\n\n**ผลลัพธ์** ทุกคาบมีเวลา ไม่ฝ่าฝืนกฎ hard\n**ผิดพลาด** FET ค้างหรือแครช → \"ตัวจัดตารางหยุด: <เหตุผล>\" **เก็บผลดีล่าสุดไว้**\n\n## F8 ห้องและอาจารย์\n**ผู้ทำ** HEAD/ASSISTANT · **เริ่ม** 2.4 ขั้น 7\n\n1. เวลาล็อกแล้ว → วางห้องอัตโนมัติ (เฉพาะห้องของ FET)\n2. ต่อคาบ: ยืนยันอาจารย์ → ตรวจการชนต่อการมอบหมาย\n   - ห้องร่วมถูกภาควิชาอื่นจองแล้ว → แดงที่คาบนั้น + \"จองโดย <ภาควิชา>\"\n3. พรีวิว A4 ด้านล่างเปลี่ยนสด (1 ตารางต่อกลุ่ม ต่ออาจารย์/ห้องได้ด้วย)\n\n**ผลลัพธ์** ทุกคาบมีห้องและอาจารย์ พรีวิวเหมือนกระดาษที่พิมพ์\n\n## F9 ตรวจทานและการเปลี่ยนแปลง\n**ผู้ทำ** HEAD/ASSISTANT · TEACHER · **เริ่ม** 2.4 ขั้น 8\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 868 800\" width=\"868\" height=\"800\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"\"><g data-tip=\"HEAD ขั้น 8 ส่งตรวจทาน&#10;ไปที่:&#10;→ TEACHER 4.4 เห็นเฉพาะคาบตน ป้าย DRAFT&#10;→ คุยตัวต่อตัว: direct edit + ตกลงกับ ___ (คุยตัวต่อตัว)\"><rect x=\"14\" y=\"20\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"134\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">HEAD ขั้น 8<\/text><text x=\"134\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ส่งตรวจทาน<\/text><\/g><g data-tip=\"TEACHER 4.4 เห็นเฉพาะคาบตน ป้าย DRAFT&#10;มาจาก:&#10;← HEAD ขั้น 8 ส่งตรวจทาน&#10;ไปที่:&#10;→ พอใจ?\"><rect x=\"14\" y=\"126\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"134\" y=\"150\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">TEACHER 4.4<\/text><text x=\"134\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">เห็นเฉพาะคาบตน ป้าย DRAFT<\/text><\/g><g data-tip=\"คุยตัวต่อตัว: direct edit + ตกลงกับ ___&#10;มาจาก:&#10;← HEAD ขั้น 8 ส่งตรวจทาน (คุยตัวต่อตัว)&#10;ไปที่:&#10;→ ตรวจสด + ผลกระทบ ไม่กระทบอื่น = มีผลทันที\"><rect x=\"614\" y=\"126\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"734\" y=\"150\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">คุยตัวต่อตัว: direct edit<\/text><text x=\"734\" y=\"168\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">+ ตกลงกับ ___<\/text><\/g><g data-tip=\"พอใจ?&#10;มาจาก:&#10;← TEACHER 4.4 เห็นเฉพาะคาบตน ป้าย DRAFT&#10;ไปที่:&#10;→ ไม่ต้องทำอะไร (ใช่)&#10;→ ขอเปลี่ยน: คาบ อะไร ทำไม 4.5 สถานะ รอ (ไม่)\"><polygon points=\"30,230 238,230 254,254 238,278 30,278 14,254\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"134\" y=\"259\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">พอใจ?<\/text><\/g><g data-tip='ตรวจสด + ผลกระทบ ไม่กระทบอื่น = มีผลทันที&#10;มาจาก:&#10;← คุยตัวต่อตัว: direct edit + ตกลงกับ ___&#10;ไปที่:&#10;→ TEACHER ได้ \"แก้โดย หัวหน้า\" พร้อมเก่า/ใหม่'><rect x=\"614\" y=\"226\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#f3f4f6\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/><text x=\"734\" y=\"250\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ตรวจสด + ผลกระทบ<\/text><text x=\"734\" y=\"268\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ไม่กระทบอื่น = มีผลทันที<\/text><\/g><g data-tip=\"ขอเปลี่ยน: คาบ อะไร ทำไม 4.5 สถานะ รอ&#10;มาจาก:&#10;← พอใจ? (ไม่)&#10;ไปที่:&#10;→ HEAD เห็นผลกระทบ นี่จะย้ายอีก 2 คาบ\"><rect x=\"14\" y=\"332\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"134\" y=\"356\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ขอเปลี่ยน: คาบ อะไร ทำไม<\/text><text x=\"134\" y=\"374\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">4.5 สถานะ รอ<\/text><\/g><g data-tip=\"ไม่ต้องทำอะไร&#10;มาจาก:&#10;← พอใจ? (ใช่)\"><rect x=\"294\" y=\"340\" width=\"240\" height=\"40\" rx=\"20\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"414\" y=\"365\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ไม่ต้องทำอะไร<\/text><\/g><g data-tip='TEACHER ได้ \"แก้โดย หัวหน้า\" พร้อมเก่า/ใหม่&#10;มาจาก:&#10;← ตรวจสด + ผลกระทบ ไม่กระทบอื่น = มีผลทันที'><rect x=\"614\" y=\"332\" width=\"240\" height=\"56\" rx=\"28\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"734\" y=\"356\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">TEACHER ได้ \"แก้โดย หัวหน้า\"<\/text><text x=\"734\" y=\"374\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">พร้อมเก่า/ใหม่<\/text><\/g><g data-tip=\"HEAD เห็นผลกระทบ นี่จะย้ายอีก 2 คาบ&#10;มาจาก:&#10;← ขอเปลี่ยน: คาบ อะไร ทำไม 4.5 สถานะ รอ&#10;ไปที่:&#10;→ ตัดสินใจ\"><rect x=\"14\" y=\"432\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"134\" y=\"456\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">HEAD เห็นผลกระทบ<\/text><text x=\"134\" y=\"474\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">นี่จะย้ายอีก 2 คาบ<\/text><\/g><g data-tip=\"ตัดสินใจ&#10;มาจาก:&#10;← HEAD เห็นผลกระทบ นี่จะย้ายอีก 2 คาบ&#10;ไปที่:&#10;→ รันใหม่แบบน้อยที่สุด ที่เหลือ pin (อนุมัติ)&#10;→ ปฏิเสธ + หมายเหตุ (ปฏิเสธ)\"><polygon points=\"30,532 238,532 254,5 4b5563\"/><polygon points=\"134.0,730.0 139.0,719.0 129.0,719.0\" fill=\"#4b5563\"/><polygon points=\"414.0,738.0 419.0,727.0 409.0,727.0\" fill=\"#4b5563\"/><polygon points=\"734.0,126.0 739.0,115.0 729.0,115.0\" fill=\"#4b5563\"/><polygon points=\"734.0,226.0 739.0,215.0 729.0,215.0\" fill=\"#4b5563\"/><polygon points=\"734.0,332.0 739.0,321.0 729.0,321.0\" fill=\"#4b5563\"/><rect x=\"263\" y=\"290\" width=\"29\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"278\" y=\"301\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">ใช่<\/text><rect x=\"91\" y=\"284\" width=\"29\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"105\" y=\"296\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">ไม่<\/text><rect x=\"65\" y=\"586\" width=\"55\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"93\" y=\"596\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">อนุมัติ<\/text><rect x=\"254\" y=\"588\" width=\"48\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"278\" y=\"599\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">ปฏิเสธ<\/text><rect x=\"395\" y=\"84\" width=\"87\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"438\" y=\"95\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">คุยตัวต่อตัว<\/text><polyline points=\"126,76 126,101 134,101 134,126\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD ขั้น 8 ส่งตรวจทาน → TEACHER 4.4 เห็นเฉพาะคาบตน ป้าย DRAFT\"/><polyline points=\"134,182 134,230\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"TEACHER 4.4 เห็นเฉพาะคาบตน ป้าย DRAFT → พอใจ?\"/><polyline points=\"142,278 142,308 414,308 414,340\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"พอใจ? → ไม่ต้องทำอะไร&#10;ใช่\"/><polyline points=\"126,278 126,305 134,305 134,332\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"พอใจ? → ขอเปลี่ยน: คาบ อะไร ทำไม 4.5 สถานะ รอ&#10;ไม่\"/><polyline points=\"134,388 134,432\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ขอเปลี่ยน: คาบ อะไร ทำไม 4.5 สถานะ รอ → HEAD เห็นผลกระทบ นี่จะย้ายอีก 2 คาบ\"/><polyline points=\"134,488 134,532\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD เห็นผลกระทบ นี่จะย้ายอีก 2 คาบ → ตัดสินใจ\"/><polyline points=\"126,580 126,605 134,605 134,630\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ตัดสินใจ → รันใหม่แบบน้อยที่สุด ที่เหลือ pin&#10;อนุมัติ\"/><polyline points=\"142,580 142,606 414,606 414,630\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ตัดสินใจ → ปฏิเสธ + หมายเหตุ&#10;ปฏิเสธ\"/><polyline points=\"134,686 134,730\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"รันใหม่แบบน้อยที่สุด ที่เหลือ pin → แจ้งอาจารย์ + เก่า/ใหม่\"/><polyline points=\"414,686 414,738\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ปฏิเสธ + หมายเหตุ → แจ้งอาจารย์\"/><polyline points=\"142,76 142,102 734,102 734,126\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"HEAD ขั้น 8 ส่งตรวจทาน → คุยตัวต่อตัว: direct edit + ตกลงกับ ___&#10;คุยตัวต่อตัว\"/><polyline points=\"734,182 734,226\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"คุยตัวต่อตัว: direct edit + ตกลงกับ ___ → ตรวจสด + ผลกระทบ ไม่กระทบอื่น = มีผลทันที\"/><polyline points=\"734,282 734,332\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip='ตรวจสด + ผลกระทบ ไม่กระทบอื่น = มีผลทันที → TEACHER ได้ \"แก้โดย หัวหน้า\" พร้อมเก่า/ใหม่'/><\/svg><\/div>\n\n**ผลลัพธ์** ไม่มีคำขอค้าง (หรือ HEAD ตัดสินใจเผยแพร่เลย; คำขอที่ค้างยังเห็นอยู่)\n\n## F10 เผยแพร่และเปลี่ยนภายหลัง\n**ผู้ทำ** HEAD เท่านั้น · **เริ่ม** 2.4 ขั้น 9\n\n- ASSISTANT กดเผยแพร่ → \"มีแต่หัวหน้าที่เผยแพร่ได้\" + ขอให้หัวหน้า → HEAD ได้แจ้งเตือน\n- เผยแพร่ → **เวอร์ชัน 1 ล็อก** แจ้งอาจารย์ทุกคน ดาวน์โหลด/พิมพ์ต่อกลุ่ม อาจารย์ ห้อง\n- ภายหลัง: 2.4.2 \"เริ่มการเปลี่ยนแปลง\" → ร่างเวอร์ชันใหม่ (เวอร์ชันที่เผยแพร่ยังใช้ได้) → ตรวจผลกระทบ + เปลี่ยนน้อยสุด → เผยแพร่ → เวอร์ชัน 2 แจ้งเฉพาะอาจารย์ที่ได้รับผลกระทบ\n\n**ผลลัพธ์** นักศึกษาได้ตารางใหม่จากอาจารย์ (ไม่มีล็อกอิน ไม่มีลิงก์สาธารณะ)\n\n## F11 อนุมัติรูปแบบใหม่\n**ผู้ทำ** ADMIN · **เริ่ม** 3.5 \"1 รูปแบบ unverified จาก <ภาควิชา>\"\n\nเปิด → หน้าตัวอย่างพร้อมคอลัมน์ที่ HEAD ทำเครื่องหมาย และสิ่งที่อ่านได้จาก 3 หน้าอื่น\n- ถูกต้อง → **อนุมัติ** (ทุกภาควิชาในสถาบันใช้ได้) · ส่งออกเพื่อส่งให้โครงการ\n- ไม่ถูก → **ส่งกลับพร้อมหมายเหตุ** → HEAD เห็นในขั้น 1\n\n## F12 มอบงานให้ผู้ช่วย\n**ผู้ทำ** HEAD · **เริ่ม** 2.3\n\nเชิญเป็น ASSISTANT → F2 ผู้ช่วยทำขั้น 1-8 ได้\n**ทำไม่ได้:** เผยแพร่ (F10), ลบ HEAD, เชิญผู้ช่วยคนอื่น\nทุกการเปลี่ยนแปลงยังบันทึก **ใคร** ทำ (หัวหน้าหรือผู้ช่วย)\n\n---\n\n## ตารางผิดพลาดรวม (สำหรับ error handling ฝั่ง UI)\n\n| สถานการณ์ | ข้อความ / พฤติกรรมที่ต้องมี |\n|---|---|\n| ลิงก์เชิญหมดอายุ | \"ขอให้หัวหน้า/ผู้ดูแลส่งใหม่\" ไม่สร้างบัญชี |\n| ภาคเรียนไม่อยู่ในปฏิทิน | \"ขอให้ผู้ดูแลเพิ่ม\" ไม่ให้พิมพ์วันที่เอง |\n| ไฟล์อ่านไม่ได้ | \"อ่านไฟล์นี้ไม่ได้: <เหตุผล>\" ไม่บันทึกอะไร |\n| ยังมีแถวแดง | ปุ่มไปต่อ disabled + \"เหลือ N ค่าที่ต้องการคุณ\" |\n| เลย์เอาต์ไม่รู้จัก | ไม่เดา → 2.4.1 |\n| ชื่อวิชาไม่ตรงกันสองแหล่ง | แดง แสดงสองค่า ให้เลือก |\n| อัปโหลดไฟล์ใหม่ทับ | ขั้นหลังล้าสมัยเฉพาะหลักสูตรนั้น |\n| Pre-check ไม่ผ่าน | เหตุผล + วิธีแก้ใกล้สุด ไม่ปลด Generate |\n| ได้ผลไม่ครบ | ตารางบางส่วน + ถาด (ไม่ใช่ความล้มเหลว) |\n| FET ค้าง/แครช | \"ตัวจัดตารางหยุด: <เหตุผล>\" เก็บผลดีล่าสุด |\n| ห้องร่วมถูกจอง | แดงที่คาบ + \"จองโดย <ภาควิชา>\" |\n| ASSISTANT กดเผยแพร่ | disabled + เหตุผล + ปุ่มขอ HEAD |\n"}, {"g": "เอกสารนักพัฒนา", "id": "dev-diagrams", "t": "แผนภาพ", "p": "dev/diagrams.md", "md": "# แผนภาพ (Diagrams)\n\nรวมแผนภาพของระบบทั้งหมดที่ถอดจากเอกสารขั้น 1-4 เป็นภาพให้ดูได้ในเว็บนี้ ซูมและลากได้ทุกภาพ ภาพมีรหัสหน้าตรงกับ [หน้าและเส้นทาง](pages-and-routes.md) และ [Flows](flows.md)\n\n**วิธีอ่านสี:** 🟦 ฟ้า = หน้าจอ / ขั้นตอน · 🟥 แดง = ข้อผิดพลาดหรือเส้นทางปัญหา · 🟩 เขียว = ผลลัพธ์ปลายทาง · ⬜ เทา = การกระทำของระบบ\n\n| # | แผนภาพ | ตอบคำถาม |\n|---|---|---|\n| 1 | ผู้ใช้ → เป้าหมาย | ใครต้องการอะไร และเทคโนโลยีไหนรองรับ |\n| 2 | Sitemap | มีหน้าอะไรบ้าง ใครเห็น |\n| 3 | พื้นที่ทำงาน 9 ขั้น | ลำดับขั้นและสถานะของแต่ละขั้น |\n| 4 | เส้นทางหนึ่งภาคเรียน | ใครทำอะไรกับใคร ตามลำดับเวลา |\n| 5 | User flows F1-F12 | คลิกอย่างไรทีละขั้น และพังตรงไหนได้ |\n| 6 | วงจรสถานะ | สถานะของ profile, ขั้น, ปัญหา, คำขอ, การรัน |\n\n---\n\n## 1. ผู้ใช้ → เป้าหมาย → เทคโนโลยี\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 914 1282\" width=\"914\" height=\"1282\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"ผู้ใช้ เป้าหมาย เทคโนโลยี\"><text x=\"140\" y=\"32\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#4b5563\">ผู้ใช้<\/text><text x=\"454\" y=\"32\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#4b5563\">เป้าหมาย<\/text><text x=\"780\" y=\"32\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#4b5563\">เทคโนโลยี<\/text><g data-tip=\"G1 ตารางไม่ชนทุกกลุ่ม&#10;มาจาก:&#10;← หัวหน้าภาควิชา (ผู้ใช้หลัก)&#10;ไปที่:&#10;→ FET solver + pre-check + core lib\"><rect x=\"334\" y=\"118\" width=\"240\" height=\"40\" rx=\"5\" fill=\"#ffffff\" stroke=\"#4b5563\" stroke-width=\"1.5\"/><text x=\"454\" y=\"143\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">G1 ตารางไม่ชนทุกกลุ่ม<\/text><\/g><g data-tip=\"FET solver + pre-check + core lib&#10;มาจาก:&#10;← G1 ตารางไม่ชนทุกกลุ่ม&#10;← G2 เร็วกว่า 3 วัน-1 สัปดาห์&#10;← G3 คุมได้เอง ย้าย ปักหมุด วิชาเลือก&#10;← T1 เวลาไม่ว่างได้รับการเคารพ\"><rect x=\"660\" y=\"110\" width=\"240\" height=\"56\" rx=\"5\" fill=\"#f3f4f6\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/><text x=\"780\" y=\"134\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">FET solver<\/text><text x=\"780\" y=\"152\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">+ pre-check + core lib ke-width=\"14\" data-tip=\"4 ข้อมูลอาจารย์: blocker / warning → 5 กฎ + วิชาเลือก (ต่อชั้นปี)&#10;ไม่มีรายการที่ยังไม่ตัดสินใจ\"/><polyline points=\"184,452 184,510\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"5 กฎ + วิชาเลือก (ต่อชั้นปี) → 6 สร้าง + จัดตาราง (ต่อชั้นปี)&#10;acknowledge pre-check\"/><polyline points=\"184,550 184,608\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"6 สร้าง + จัดตาราง (ต่อชั้นปี) → 7 ห้อง + อาจารย์&#10;ทุกคาบมีเวลา ไม่ฝ่าฝืนกฎ hard\"/><polyline points=\"184,648 184,706\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"7 ห้อง + อาจารย์ → 8 อาจารย์ตรวจทาน&#10;ทุกคาบมีห้องและอาจารย์\"/><polyline points=\"184,746 184,804\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"8 อาจารย์ตรวจทาน → 9 เผยแพร่ + พิมพ์ (เฉพาะ HEAD)\"/><\/svg><\/div>\n\nกรอบหนา = ทำแยกต่อ **หลักสูตร × ชั้นปี** · ข้อความบนลูกศร = เงื่อนไขปลดล็อกขั้นถัดไป\n\n**สถานะของแต่ละขั้น:** ดู วงจรสถานะ ย้อนไปแก้ขั้นที่เสร็จแล้ว → ขั้นหลังเป็น **ล้าสมัย** (เฉพาะชั้นปีนั้น ถ้าแก้ในแท็บชั้นปีเดียว)\n\n---\n\n## 4. เส้นทางหนึ่งภาคเรียน (ตามลำดับเวลา)\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant ADM as ผู้ดูแลสถาบัน\n  participant HEAD as หัวหน้า/ผู้ช่วย\n  participant SYS as ระบบ\n  participant TEA as อาจารย์\n\n  Note over ADM,SYS: ตั้งค่าสถาบัน (ครั้งเดียว) F1\n  ADM->>SYS: ปฏิทิน ภาควิชา ห้องร่วม\n  ADM->>HEAD: เชิญหัวหน้า (อีเมล/ลิงก์)\n\n  Note over HEAD,SYS: เริ่มภาคเรียน F3-F4\n  HEAD->>SYS: คัดลอกจากภาคก่อน + อัปโหลดไฟล์หลักสูตร\n  SYS-->>HEAD: สิ่งที่เราพบ (หน้าที่มา) + แถวแดงที่ไม่มั่นใจ\n  HEAD->>SYS: ยืนยัน/แก้ จนไม่เหลือแถวแดง\n\n  Note over HEAD,TEA: รอบเวลาว่าง F5 / ปัญหา F6\n  HEAD->>TEA: เปิดรอบ + กำหนดส่ง\n  TEA->>SYS: เวลาไม่ว่าง จัดอันดับวิชา ชั่วโมงสูงสุด/วัน\n  SYS-->>HEAD: รายการ BLOCKER / WARNING (สร้างเอง)\n  HEAD->>TEA: ความเห็นในเธรด\n  TEA-->>HEAD: ตอบในเธรด\n  HEAD->>SYS: ตัดสินใจทุกรายการ (ใคร เมื่อไหร่ ทำไม)\n\n  Note over HEAD,SYS: กฎ สร้างตาราง F7-F8\n  HEAD->>SYS: ตั้งกฎ + Check\n  SYS-->>HEAD: รายงาน pre-check\n  HEAD->>SYS: Acknowledge → Generate\n  SYS-->>HEAD: ตารางครบ หรือบางส่วน + ถาด + วิธีแก้\n  HEAD->>SYS: ลาก ปักหมุด รันใหม่ ยืนยันห้อง/อาจารย์\n\n  Note over HEAD,TEA: ตรวจทาน F9\n  HEAD->>SYS: ส่งเข้า REVIEW\n  SYS-->>TEA: แจ้งเตือน (เห็นเฉพาะตารางตน)\n  alt ไม่พอใจ\n    TEA->>HEAD: คำขอเปลี่ยน (คาบ อะไร ทำไม)\n    HEAD->>SYS: อนุมัติ (เปลี่ยนน้อยที่สุด) หรือปฏิเสธ + หมายเหตุ\n  else คุยกันแล้ว\n    HEAD->>SYS: direct edit + \"ตกลงกับ ___\"\n    SYS-->>TEA: แก้โดย (หัวหน้า): หมายเหตุ พร้อมเก่า/ใหม่\n  end\n\n  Note over HEAD,TEA: เผยแพร่ F10\n  HEAD->>SYS: เผยแพร่ (เฉพาะ HEAD) → เวอร์ชัน 1 ล็อก\n  SYS-->>TEA: แจ้งเตือน + ดาวน์โหลด/พิมพ์\n  Note over TEA: นักศึกษาได้ตารางจากอาจารย์ (ไม่มีล็อกอิน)\n```\n\n---\n\n## 5. User flows F1-F12\n\nสัญลักษณ์: สี่เหลี่ยมมุมมน = เริ่ม/จบ · ข้าวหลามตาม = จุดแยกเส้นทาง · 🟥 = ข้อผิดพลาด\n\n### F1 ตั้งค่าสถาบัน (ADMIN)\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 528 897\" width=\"528\" height=\"897\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"\"><g data-tip=\"แอดมินเซิร์ฟเวอร์รัน docker compose up&#10;ไปที่:&#10;→ 0.0 ตั้งค่าครั้งแรก ชื่อสถาบัน ภาษา ผู้ดูแลคนแรก\"><rect x=\"14\" y=\"20\" width=\"230\" height=\"56\" rx=\"28\" fill=\"#f3f4f6\" stroke=\"#6b7280\" stroke-width=\"1.5\"/><text x=\"129\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">แอดมินเซิร์ฟเวอร์รัน<\/text><text x=\"129\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">docker compose up<\/text><\/g><g data-tip=\"0.0 ตั้งค่าครั้งแรก ชื่อสถาบัน ภาษา ผู้ดูแลคนแรก&#10;มาจาก:&#10;← แอดมินเซิร์ฟเวอร์รัน docker compose up&#10;ไปที่:&#10;→ 3.1 หน้าแรกผู้ดูแล\"><rect x=\"14\" y=\"120\" width=\"230\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"129\" y=\"144\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">0.0 ตั้งค่าครั้งแรก<\/text><text x=\"129\" y=\"162\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ชื่อสถาบัน ภาษา ผู้ดูแลคนแรก<\/text><\/g><g data-tip=\"3.1 หน้าแรกผู้ดูแล&#10;มาจาก:&#10;← 0.0 ตั้งค่าครั้งแรก ชื่อสถาบัน ภาษา ผู้ดูแลคนแรก&#10;ไปที่:&#10;→ 3.4 ปฏิทินการศึกษา ภาคเรียน วันหยุด\"><rect x=\"14\" y=\"220\" width=\"230\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"129\" y=\"245\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">3.1 หน้าแรกผู้ดูแล<\/text><\/g><g data-tip=\"3.4 ปฏิทินการศึกษา ภาคเรียน วันหยุด&#10;มาจาก:&#10;← 3.1 หน้าแรกผู้ดูแล&#10;ไปที่:&#10;→ 3.2 เพิ่มภาควิชา เชิญหัวหน้า\"><rect x=\"14\" y=\"304\" width=\"230\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"129\" y=\"328\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">3.4 ปฏิทินการศึกษา<\/text><text x=\"129\" y=\"346\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ภาคเรียน วันหยุด<\/text><\/g><g data-tip=\"3.2 เพิ่มภาควิชา เชิญหัวหน้า&#10;มาจาก:&#10;← 3.4 ปฏิทินการศึกษา ภาคเรียน วันหยุด&#10;ไปที่:&#10;→ ตั้ง SMTP ใน 3.6 แล้ว?&#10;→ หัวหน้าไม่ยอมรับ เชิญเมื่อ 7 วันก่อน + ส่งอีกครั้ง\"><rect x=\"14\" y=\"414\" width=\"230\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"129\" y=\"437\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">3.2 เพิ่มภาควิชา<\/text><text x=\"129\" y=\"456\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">เชิญหัวหน้า<\/text><\/g><g data-tip=\"หัวหน้าไม่ยอมรับ เชิญเมื่อ 7 วันก่อน + ส่งอีกครั้ง&#10;มาจาก:&#10;← 3.2 เพิ่มภาควิชา เชิญหัวหน้า\"><rect x=\"284\" y=\"404\" width=\"230\" height=\"75\" rx=\"5\" fill=\"#fdecea\" stroke=\"#b42318\" stroke-width=\"1.5\"/><text x=\"399\" y=\"428\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">หัวหน้าไม่ยอมรับ<\/text><text x=\"399\" y=\"446\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">เชิญเมื่อ 7 วันก่อน<\/text><text x=\"399\" y=\"466\" font-size=\"13\" text-ancho "# Wireframe ที่ขาด: 0.2, 1.2, 2.4.1\n\n> **ร่างโครงหน้าของเรา** เทียบหน้าที่ใกล้กัน (0.1 ล็อกอิน, ตั้งค่าบัญชี, ขั้น 1) ยังไม่ได้ทดสอบกับผู้ใช้ ใช้ design system เดิม ([design-system.md](../th/7-design-system/design-system.md)) สถานะ = สี + ไอคอน/ข้อความเสมอ\n> ที่มาของการตัดสินใจ: [decisions D12](decisions.md)\n\n## 0.2 ลืม / รีเซ็ตรหัสผ่าน (`/reset`, `/reset/:token`)\n\nเทียบหน้า 0.1 ล็อกอิน: การ์ดกลางจอเดียว ไม่มี Nav ไม่มีแถบบน\n\n**A. ขอรีเซ็ต (`/reset`)**\n\n```\n┌────────────────────────────────────┐\n│ ระบบตารางเรียน                     │\n│ ลืมรหัสผ่าน                         │\n│                                    │\n│ อีเมล  [____________________]      │\n│ [ ส่งลิงก์รีเซ็ต ]  ← primary      │\n│                                    │\n│ ⓘ ถ้าอีเมลนี้มีในระบบและสถาบันตั้ง │\n│   ค่าอีเมลไว้ เราจะส่งลิงก์ให้     │\n│ ⓘ ถ้าไม่ได้รับอีเมล ให้ขอลิงก์     │\n│   จากหัวหน้าภาควิชาหรือผู้ดูแล     │\n│   ระบบสถาบัน                       │\n│ ← กลับไปล็อกอิน                    │\n└────────────────────────────────────┘\n```\n- กดแล้วแสดงข้อความเดิมเสมอ ไม่บอกว่ามีอีเมลนี้หรือไม่ (ไม่เปิดเผยว่าใครมีบัญชี)\n- ถ้าสถาบันไม่ได้ตั้ง SMTP แสดงเฉพาะข้อความ \"ขอลิงก์จากหัวหน้า/ผู้ดูแล\" และซ่อนปุ่มส่ง\n\n**B. ตั้งรหัสใหม่ (`/reset/:token`)**\n\n```\n│ ตั้งรหัสผ่านใหม่                   │\n│ รหัสผ่านใหม่   [________]          │\n│ ยืนยันรหัสผ่าน [________]          │\n│ [ บันทึกรหัสผ่าน ]                 │\n```\n- ลิงก์หมดอายุ / ใช้แล้ว (410): InlineAlert error \"ลิงก์นี้หมดอายุหรือถูกใช้แล้ว\" + ปุ่ม \"ขอลิงก์ใหม่\"\n- สำเร็จ: ไปหน้าล็อกอิน พร้อม Toast \"เปลี่ยนรหัสผ่านแล้ว\"\n\n**C. ฝั่งผู้สร้างลิงก์ (ADMIN ที่ 3.2 / HEAD ที่ 2.3)** เทียบปุ่ม \"เชิญ\" ใน 2.3\n\n```\nอาจารย์ ▸ นายสมชาย ใจดี        [ ⋯ ]\n                               ├ สร้างลิงก์รีเซ็ตรหัสผ่าน\n                               └ ลบออกจากภาควิชา\nDialog ► ลิงก์รีเซ็ตรหัสผ่านของ นายสมชาย\n        [ https://…/reset/ab12…   ] [คัดลอก]\n        หมดอายุใน 24 ชม. · ใช้ได้ครั้งเดียว\n        ⚠ ส่งลิงก์นี้ให้เจ้าของบัญชีเท่านั้น\n        ✓ ส่งอีเมลให้แล้ว (เฉพาะเมื่อมี SMTP)\n```\n- เมนูนี้ซ่อนสำหรับผู้ใช้ที่เป็น ADMIN หรือเป็น HEAD ภาควิชาอื่น (หัวหน้าสร้างให้ไม่ได้ ต้องเป็น ADMIN, ดู [api §2](api.md))\n\n## 1.2 บัญชีของฉัน (`/account`)\n\nเทียบหน้า \"ตั้งค่าบัญชี\" ทั่วไป: ฟอร์มกว้างสูงสุด 640px แบ่งเป็นส่วนด้วยหัวข้อ + เส้น 1px ไม่ซ้อนการ์ด\n\n```\nบัญชีของฉัน\n──────────────────────────────\nข้อมูลส่วนตัว\n  ชื่อ        [______________]\n  อีเมล       [______________]   (เปลี่ยนแล้วต้องยืนยันด้วยรหัสผ่าน)\n  ภาษา        (•) ไทย  ( ) English\n  [ บันทึก ]\n──────────────────────────────\nเปลี่ยนรหัสผ่าน\n  รหัสผ่านปัจจุบัน [________]\n  รหัสผ่านใหม่     [________]\n  ยืนยัน           [________]\n  [ เปลี่ยนรหัสผ่าน ]\n──────────────────────────────\nสังกัดของฉัน   (อ่านอย่างเดียว)\n  ภาควิชาคอมพิวเตอร์ศึกษา   หัวหน้า\n  ภาควิชาอื่น              อาจารย์\n  ผู้ดูแลสถาบัน            ✓       (แสดงเมื่อ is_admin)\n──────────────────────────────\n[ ออกจากระบบ ]  ← tertiary\n```\n- \"สังกัดของฉัน\" ให้ผู้ใช้เห็นว่าตัวสลับภาควิชามาจากไหน แก้ไม่ได้ (หัวหน้า/ผู้ดูแลเป็นคนจัดการ)\n- ช่วงการเปลี่ยนภาษา: มีผลทันที ไม่ต้องโหลดหน้าใหม่\n- ชั่วโมงสอนสูงสุดต่อวัน **ไม่อยู่ที่นี่** อยู่ที่ 4.2 เวลาว่างของฉัน เพราะเป็นค่าต่อภาคเรียน (D12)\n\n## 2.4.1 ตั้งค่ารูปแบบ (`…/setup/format`)\n\nเทียบขั้น 1 ตั้งค่า: Stepper อยู่บนสุด ขั้น 1 เป็นขั้นปัจจุบัน เข้ามาเมื่อระบบไม่รู้จักเลย์เอาต์ PDF เท่านั้น\n\n```\nStepper ① ตั้งค่า (ปัจจุบัน) ② ตรวจข้อมูล 🔒 …\nไม่รู้จักรูปแบบหลักสูตรนี้  ← InlineAlert warning\nช่วยบอกระบบว่าแต่ละคอลัมน์คืออะไร (ทำครั้งเดียวต่อรูปแบบ)\n┌ SplitPane ───────────────┬──────────────────────────┐\n│ หน้าตัวอย่าง PDF (หน้า 3)│ ชื่อรูปแบบ [__________]  │\n│ ┌──────────────────────┐ │ คอลัมน์ที่ชี้แล้ว        │\n│ │ ตารางในไฟล์          │ │  1 รหัสวิชา      ✓ ชี้แล้ว│\n│ │ ▒ ▒ ▒ ▒ ▒            │ │  2 ชื่อวิชา      ✓        │\n│ └──────────────────────┘ │  3 หน่วยกิต      ✓        │\n│ [คลิกคอลัมน์ในตัวอย่าง]  │  4 ทฤษฎี-ปฏิบัติ  ⚠ ยังไม่ชี้ │\n│                          │ รูปแบบหน่วยกิต  [ ท-ป-น ▾]│\n└──────────────────────────┴──────────────────────────┘\n[ กลับ ]                      [ ลองอ่านด้วยรูปแบบนี้ ] ← primary (disabled จนครบ)\n```\n- คลิกคอลัมน์ในภาพตัวอย่าง แล้วเลือกว่าคือฟิลด์ไหน ฝั่งขวาแสดงสถานะ ✓ / ⚠ ต่อฟิลด์ที่ต้องมี\n- \"ลองอ่านด้วยรูปแบบนี้\" แสดงแถวตัวอย่าง 5 แถวใน Dialog ให้ตรวจก่อนบันทึก\n- บันทึกแล้วสถานะรูปแบบ = `unverified` (ใช้ได้กับงานนี้ทันที) Toast: \"บันทึกรูปแบบแล้ว รอผู้ดูแลระบบสถาบันอนุมัติ\" ผู้ดูแลอนุมัติ/ปฏิเสธที่ 3.5 ถ้าปฏิเสธ หัวหน้าเห็นหมายเหตุที่ขั้น 1\n\n## ที่ยังไม่ได้ตัดสินใจ\n\n- รหัสผ่านต่ำสุดกี่ตัวอักษร และอายุลิงก์รีเซ็ต (ร่างนี้ใช้ 24 ชม.) ต้องตกลงกับอานนท์\n- 2.4.1 รองรับตารางที่ข้ามหลายหน้า PDF หรือไม่ ร่างนี้ชี้จากหน้าตัวอย่างหน้าเดียวก่อน\n"}, {"g": "เอกสารนักพัฒนา", "id": "dev-data", "t": "โมเดลข้อมูล", "p": "dev/data-model.md", "md": "# โมเดลข้อมูล (Data model)\n\n> **ร่างของเรา ไม่ใช่สเปกจากอานนท์** เอกสารต้นฉบับไม่กำหนดตารางข้อมูล ชื่อฟิลด์ และ cardinality ด้านล่างเป็นการตีความจากเอกสาร ต้องให้ทีม backend ยืนยันก่อนใช้จริง\n\nER เต็ม (35 entity พร้อมฟิลด์): [er-diagram.mmd](../th/6-er-diagram/er-diagram.mmd) · ดูภาพ: [er-diagram.html](../th/6-er-diagram/er-diagram.html)\nหน้านี้สรุปแนวคิด สถานะ และข้อกำหนดที่ห้ามผิด\n\n## 1. แกนความสัมพันธ์\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1338 498\" width=\"1338\" height=\"498\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"แกนความสัมพันธ์\"><g data-tip=\"INSTITUTION&#10;ไปที่:&#10;→ DEPARTMENT (มี)\"><rect x=\"238\" y=\"20\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"333\" y=\"45\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">INSTITUTION<\/text><\/g><g data-tip=\"ACADEMIC_TERM&#10;ไปที่:&#10;→ PROFILE ภาควิชา × ภาคเรียน (ภาคเรียน)\"><rect x=\"686\" y=\"20\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"781\" y=\"45\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ACADEMIC_TERM<\/text><\/g><g data-tip=\"USER&#10;ไปที่:&#10;→ MEMBERSHIP (บทบาทต่อภาควิชา) (สังกัด)\"><rect x=\"14\" y=\"122\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"109\" y=\"147\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">USER<\/text><\/g><g data-tip=\"MEMBERSHIP (บทบาทต่อภาควิชา)&#10;role: HEAD / ASSISTANT / TEACHER&#10;มาจาก:&#10;← USER (สังกัด)&#10;← DEPARTMENT (มีสมาชิก)\"><rect x=\"238\" y=\"114\" width=\"190\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"333\" y=\"138\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">MEMBERSHIP<\/text><text x=\"333\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">(บทบาทต่อภาควิชา)<\/text><\/g><g data-tip=\"DEPARTMENT&#10;มาจาก:&#10;← INSTITUTION (มี)&#10;ไปที่:&#10;→ MEMBERSHIP (บทบาทต่อภาควิชา) (มีสมาชิก)&#10;→ PROFILE ภาควิชา × ภาคเรียน (มีโปรไฟล์)\"><rect x=\"462\" y=\"122\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"557\" y=\"147\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">DEPARTMENT<\/text><\/g><g data-tip=\"PROFILE ภาควิชา × ภาคเรียน&#10;มาจาก:&#10;← DEPARTMENT (มีโปรไฟล์)&#10;← ACADEMIC_TERM (ภาคเรียน)&#10;ไปที่:&#10;→ YEAR_PLAN หลักสูตร × ชั้นปี (แบ่งตามชั้นปี)&#10;→ TIMETABLE_VERSION (เวอร์ชัน)\"><rect x=\"686\" y=\"114\" width=\"190\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"781\" y=\"138\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">PROFILE<\/text><text x=\"781\" y=\"156\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ภาควิชา × ภาคเรียน<\/text><\/g><g data-tip=\"TIMETABLE_VERSION&#10;มาจาก:&#10;← PROFILE ภาควิชา × ภาคเรียน (เวอร์ชัน)&#10;ไปที่:&#10;→ SCHEDULED_CLASS (คาบที่จัดแล้ว)\"><rect x=\"910\" y=\"122\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"1005\" y=\"147\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">TIMETABLE_VERSION<\/text><\/g><g data-tip=\"PROGRAM&#10;ไปที่:&#10;→ YEAR_PLAN หลักสูตร × ชั้นปี\"><rect x=\"462\" y=\"232\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"557\" y=\"257\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">PROGRAM<\/text><\/g><g data-tip=\"YEAR_PLAN หลักสูตร × ชั้นปี&#10;มาจาก:&#10;← PROFILE ภาควิชา × ภาคเรียน (แบ่งตามชั้นปี)&#10;← PROGRAM&#10;ไปที่:&#10;→ PLAN_ROW (แถววิชา)\"><rect x=\"686\" y=\"224\" width=\"190\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"781\" y=\"248\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">YEAR_PLAN<\/text><text x=\"781\" y=\"266\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">หลักสูตร × ชั้นปี<\/text><\/g><g data-tip=\"COURSE&#10;ไปที่:&#10;→ PLAN_ROW\"><rect x=\"462\" y=\"342\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"557\" y=\"367\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">COURSE<\/text><\/g><g data-tip=\"PLAN_ROW&#10;มาจาก:&#10;← YEAR_PLAN หลักสูตร × ชั้นปี (แถววิชา)&#10;← COURSE&#10;ไปที่:&#10;→ SCHEDULED_CLASS\"><rect x=\"686\" y=\"342\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"781\" y=\"367\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">PLAN_ROW<\/text><\/g><g data-tip=\"SCHEDULED_CLASS&#10;มาจาก:&#10;← TIMETABLE_VERSION (คาบที่จัดแล้ว)&#10;← PLAN_ROW&#10;← USER (อาจารย์ผู้สอน) (สอน)&#10;← ROOM (ใช้ห้อง)\"><rect x=\"910\" y=\"342\" width=\"190\" height=\"40\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"1005\" y=\"367\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">SCHEDULED_CLASS<\/text><\/g><g data-tip=\"USER (อาจารย์ผู้สอน)&#10;ไปที่:&#10;→ SCHEDULED_CLASS (สอน)\"><re
