-opacity=\".94\"/><text x=\"814\" y=\"315\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">แถววิชา<\/text><rect x=\"1011\" y=\"245\" width=\"93\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"1058\" y=\"256\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">คาบที่จัดแล้ว<\/text><rect x=\"1102\" y=\"344\" width=\"29\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"1117\" y=\"355\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">สอน<\/text><rect x=\"1011\" y=\"406\" width=\"55\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"1038\" y=\"417\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">ใช้ห้อง<\/text><polyline points=\"333,60 333,86 557,86 557,122\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"INSTITUTION → DEPARTMENT&#10;มี\"/><polyline points=\"204,142 238,142\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"USER → MEMBERSHIP (บทบาทต่อภาควิชา)&#10;สังกัด\"/><polyline points=\"428,142 462,142\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"DEPARTMENT → MEMBERSHIP (บทบาทต่อภาควิชา)&#10;มีสมาชิก\"/><polyline points=\"652,142 686,142\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"DEPARTMENT → PROFILE ภาควิชา × ภาคเรียน&#10;มีโปรไฟล์\"/><polyline points=\"781,60 781,114\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ACADEMIC_TERM → PROFILE ภาควิชา × ภาคเรียน&#10;ภาคเรียน\"/><polyline points=\"781,170 781,224\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PROFILE ภาควิชา × ภาคเรียน → YEAR_PLAN หลักสูตร × ชั้นปี&#10;แบ่งตามชั้นปี\"/><polyline points=\"652,252 686,252\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PROGRAM → YEAR_PLAN หลักสูตร × ชั้นปี\"/><polyline points=\"781,280 781,342\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"YEAR_PLAN หลักสูตร × ชั้นปี → PLAN_ROW&#10;แถววิชา\"/><polyline points=\"652,362 686,362\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"COURSE → PLAN_ROW\"/><polyline points=\"876,142 910,142\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PROFILE ภาควิชา × ภาคเรียน → TIMETABLE_VERSION&#10;เวอร์ชัน\"/><polyline points=\"1005,162 1005,342\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"TIMETABLE_VERSION → SCHEDULED_CLASS&#10;คาบที่จัดแล้ว\"/><polyline points=\"876,362 910,362\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PLAN_ROW → SCHEDULED_CLASS\"/><polyline points=\"1100,362 1134,362\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"USER (อาจารย์ผู้สอน) → SCHEDULED_CLASS&#10;สอน\"/><polyline points=\"1005,382 1005,444\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ROOM → SCHEDULED_CLASS&#10;ใช้ห้อง\"/><\/svg><\/div>\n\n## 2. กลุ่มของ entity\n\n| กลุ่ม | Entity | หมายเหตุ |\n|---|---|---|\n| สถาบัน | INSTITUTION, DEPARTMENT, ACADEMIC_TERM, HOLIDAY, ROOM | ROOM ที่ `department_id` ว่าง = **ห้องร่วม** |\n| ผู้ใช้ | USER, MEMBERSHIP (role: HEAD / ASSISTANT / TEACHER), INVITE, PASSWORD_RESET | บทบาทในภาควิชาอยู่ที่ MEMBERSHIP (คนเดียวหลายบทบาท) **ADMIN คือ `user.is_admin` ระดับสถาบัน ไม่อยู่ใน MEMBERSHIP** (decisions D12) |\n| หลักสูตร | PROGRAM, CURRICULUM_FORMAT, SOURCE_UPLOAD, COURSE | `og_file` ไม่แก้ `normalised_file` คือไฟล์แปลงแล้ว |\n| โปรไฟล์ | PROFILE, YEAR_PLAN, PLAN_ROW, STUDENT_GROUP, ELECTIVE_SLOT | PLAN_ROW มี `pdf_page` และ `is_red` |\n| เวลาว่าง | AVAILABILITY_SLOT, TEACHER_TERM_SETTING, SUBJECT_PREFERENCE, ROUND, ROUND_RESPONSE | AVAILABILITY_SLOT และ TEACHER_TERM_SETTING (`max_hours_per_day`) ผูก **USER × ภาคเรียน** ไม่ผูกภาควิชา |\n| ปัญหา | ISSUE, COMMENT, DECISION | ISSUE: BLOCKER / WARNING |\n| รัน solver | RULE_SETTING, PRECHECK_REPORT, GENERATION_RUN, CANDIDATE | รันต้องอ้าง PRECHECK_REPORT ที่ acknowledge แล้ว |\n| ตาราง | TIMETABLE_VERSION, SCHEDULED_CLASS, ROOM_BOOKING | จอง ROOM_BOOKING เมื่อเผยแพร่ |\n| เปลี่ยนแปลง | CHANGE_REQUEST, CHANGE_LOG, NOTIFICATION | CHANGE_LOG ไม่มี `request_id` = direct edit |\n\n## 3. สถานะ (enum กลาง)\n\nใช้ชื่อเดียวกันทั้ง backend, API และ Frontend ตาราง map enum → Badge อยู่ที่จุดเดียว\n\n| Enum | ค่า | เกิดที่ |\n|---|---|---|\n| `profile.status` | `draft` → `review` → `published` | PROFILE |\n| `year_plan.state` | `not_started` · `done` · `out_of_date` | YEAR_PLAN |\n| `issue.severity` | `BLOCKER` · `WARNING` | ISSUE |\n| `issue.state` | `open` · `closed` | ISSUE |\n| `membership.role` | `HEAD` · `ASSISTANT` · `TEACHER` | MEMBERSHIP |\n| `elective.mode` | `SCHEDULE` · `RESERVE` | ELECTIVE_SLOT |\n| `format.status` | `unverified` · `approved` | CURRICULUM_FORMAT |\n| `change_request.status` | `waiting` · `approved` · `rejected` | CHANGE_REQUEST |\n| `round_response.status` | `submitted` · `late` · `filled_by_head` · `any_time` | ROUND_RESPONSE |\n| `decision.outcome` | `assign` · `outside_teacher` · `split` · `accept` · `change` | DECISION |\n| ผลรัน | `ok` · `partial` · `failed` | ข้อเสนอ ยังไม่มีในเอกสาร ต้องตกลงกับอานนท์ |\n\n### วงจรสถานะของ profile\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 858 310\" width=\"858\" height=\"310\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"สถานะ profile\"><g data-tip=\"เริ่ม&#10;ไปที่:&#10;→ draft\"><rect x=\"44\" y=\"20\" width=\"90\" height=\"40\" rx=\"20\" fill=\"#f3f4f6\" stroke=\"#6b7280\" stroke-width=\"1.5\"/><text x=\"89\" y=\"45\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">เริ่ม<\/text><\/g><g data-tip=\"draft&#10;มาจาก:&#10;← เริ่ม&#10;← review (ถอยกลับไปแก้)&#10;← published (เริ่มการเปลี่ยนแปลง (เวอร์ชันใหม่))&#10;ไปที่:&#10;→ review (HEAD ส่งตรวจทาน)\"><rect x=\"14\" y=\"130\" width=\"150\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"89\" y=\"155\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">draft<\/text><\/g><g data-tip=\"review&#10;มาจาก:&#10;← draft (HEAD ส่งตรวจทาน)&#10;ไปที่:&#10;→ draft (ถอยกลับไปแก้)&#10;→ published (HEAD เผยแพร่)\"><rect x=\"314\" y=\"130\" width=\"150\" height=\"40\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"389\" y=\"155\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">review<\/text><\/g><g data-tip=\"published&#10;มาจาก:&#10;← review (HEAD เผยแพร่)&#10;ไปที่:&#10;→ draft (เริ่มการเปลี่ยนแปลง (เวอร์ชันใหม่))&#10;→ ล็อกแล้ว แก้ไม่ได้ direct edit หลังนี้ = เวอร์ชันใหม่เสมอ\"><rect x=\"654\" y=\"130\" width=\"150\" height=\"40\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"729\" y=\"155\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">published<\/text><\/g><g data-tip=\"ล็อกแล้ว แก้ไม่ได้ direct edit หลังนี้ = เวอร์ชันใหม่เสมอ&#10;มาจาก:&#10;← published\"><rect x=\"614\" y=\"240\" width=\"230\" height=\"56\" rx=\"5\" fill=\"#ffffff\" stroke=\"#4b5563\" stroke-width=\"1.5\"/><text x=\"729\" y=\"264\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ล็อกแล้ว แก้ไม่ได้<\/text><text x=\"729\" y=\"282\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">direct edit หลังนี้ = เวอร์ชันใหม่เสมอ<\/text><\/g><polyline points=\"89,60 89,130\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"164,142 314,142\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"164,158 314,158\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"464,150 654,150\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"89,170 89,196 721,196 721,170\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"737,170 737,205 729,205 729,240\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-dasharray=\"6 4\"/><polygon points=\"89.0,130.0 94.0,119.0 84.0,119.0\" fill=\"#4b5563\"/><polygon points=\"314.0,142.0 303.0,137.0 303.0,147.0\" fill=\"#4b5563\"/><polygon points=\"164.0,158.0 175.0,163.0 175.0,153.0\" fill=\"#4b5563\"/><polygon points=\"654.0,150.0 643.0,145.0 643.0,155.0\" fill=\"#4b5563\"/><polygon points=\"89.0,170.0 84.0,181.0 94.0,181.0\" fill=\"#4b5563\"/><polygon points=\"729.0,240.0 734.0,229.0 724.0,229.0\" fill=\"#4b5563\"/><rect x=\"186\" y=\"124\" width=\"106\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"239\" y=\"135\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">HEAD ส่งตรวจทาน<\/text><rect x=\"196\" y=\"162\" width=\"87\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"239\" y=\"173\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">ถอยกลับไปแก้<\/text><rect x=\"516\" y=\"132\" width=\"87\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"559\" y=\"143\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">HEAD เผยแพร่<\/text><rect x=\"291\" y=\"178\" width=\"228\" height=\"14\" rx=\"3\" fill=\"#fff\" fill-opacity=\".94\"/><text x=\"405\" y=\"189\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#374151\">เริ่มการเปลี่ยนแปลง (เวอร์ชันใหม่)<\/text><polyline points=\"89,60 89,130\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"เริ่ม → draft\"/><polyline points=\"164,142 314,142\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"draft → review&#10;HEAD ส่งตรวจทาน\"/><polyline points=\"164,158 314,158\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"review → draft&#10;ถอยกลับไปแก้\"/><polyline points=\"464,150 654,150\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"review → published&#10;HEAD เผยแพร่\"/><polyline points=\"89,170 89,196 721,196 721,170\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"published → draft&#10;เริ่มการเปลี่ยนแปลง (เวอร์ชันใหม่)\"/><polyline points=\"737,170 737,205 729,205 729,240\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"published → ล็อกแล้ว แก้ไม่ได้ direct edit หลังนี้ = เวอร์ชันใหม่เสมอ\"/><\/svg><\/div>\n\nเวอร์ชันที่เผยแพร่แล้ว **ล็อก** แก้ไม่ได้ การเปลี่ยนภายหลังสร้าง TIMETABLE_VERSION ใหม่เสมอ (รวมถึง direct edit)\n\n### กฎ cascade ของสถานะ year plan\n\nแก้ข้อมูลในหนึ่ง year plan → ทำให้ year plan นั้น (และขั้นหลังของมัน) เป็น `out_of_date` **เฉพาะตัวนั้น** ไม่กระทบ year plan อื่น การรันใหม่ก็ทำต่อ year plan โดยที่อื่น pin\n\n### วงจรชีวิตของข้อมูล: จากไฟล์หลักสูตรถึงตารางที่เผยแพร่\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1214 572\" width=\"1214\" height=\"572\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"วงจรชีวิตของข้อมูล\"><g data-tip=\"SOURCE_UPLOAD og_file (ไม่แก้)&#10;ไปที่:&#10;→ normalised_file\"><rect x=\"14\" y=\"20\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"119\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">SOURCE_UPLOAD<\/text><text x=\"119\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">og_file (ไม่แก้)<\/text><\/g><g data-tip=\"normalised_file&#10;มาจาก:&#10;← SOURCE_UPLOAD og_file (ไม่แก้)&#10;ไปที่:&#10;→ PLAN_ROW + pdf_page, is_red\"><rect x=\"258\" y=\"28\" width=\"210\" height=\"40\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"363\" y=\"53\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">normalised_file<\/text><\/g><g data-tip=\"PLAN_ROW + pdf_page, is_red&#10;มาจาก:&#10;← normalised_file&#10;ไปที่:&#10;→ YEAR_PLAN หลักสูตร × ชั้นปี\"><rect x=\"502\" y=\"20\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"607\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">PLAN_ROW<\/text><text x=\"607\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">+ pdf_page, is_red<\/text><\/g><g data-tip=\"YEAR_PLAN หลักสูตร × ชั้นปี&#10;มาจาก:&#10;← PLAN_ROW + pdf_page, is_red&#10;ไปที่:&#10;→ PROFILE ภาควิชา × ภาคเรียน\"><rect x=\"746\" y=\"20\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"851\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">YEAR_PLAN<\/text><text x=\"851\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">หลักสูตร × ชั้นปี<\/text><\/g><g data-tip=\"PROFILE ภาควิชา × ภาคเรียน&#10;มาจาก:&#10;← YEAR_PLAN หลักสูตร × ชั้นปี&#10;ไปที่:&#10;→ RULE_SETTING\"><rect x=\"990\" y=\"20\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"1095\" y=\"44\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">PROFILE<\/text><text x=\"1095\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ภาควิชา × ภาคเรียน<\/text><\/g><g data-tip=\"RULE_SETTING&#10;มาจาก:&#10;← PROFILE ภาควิชา × ภาคเรียน&#10;ไปที่:&#10;→ PRECHECK_REPORT acknowledge\"><rect x=\"990\" y=\"122\" width=\"210\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"1095\" y=\"147\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">RULE_SETTING<\/text><\/g><g data-tip=\"AVAILABILITY_SLOT (คน × ภาค)&#10;ไปที่:&#10;→ ISSUE BLOCKER / WARNING\"><rect x=\"14\" y=\"212\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"119\" y=\"236\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">AVAILABILITY_SLOT<\/text><text x=\"119\" y=\"254\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">(คน × ภาค)<\/text><\/g><g data-tip=\"ISSUE BLOCKER / WARNING&#10;มาจาก:&#10;← AVAILABILITY_SLOT (คน × ภาค)&#10;← SUBJECT_PREFERENCE&#10;ไปที่:&#10;→ DECISION\"><rect x=\"258\" y=\"212\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><tex \"ROOM_BOOKING (เมื่อเผยแพร่)&#10;มาจาก:&#10;← SCHEDULED_CLASS\"><rect x=\"502\" y=\"400\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"607\" y=\"424\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">ROOM_BOOKING<\/text><text x=\"607\" y=\"442\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">(เมื่อเผยแพร่)<\/text><\/g><g data-tip=\"SCHEDULED_CLASS&#10;มาจาก:&#10;← TIMETABLE_VERSION draft → review → published&#10;ไปที่:&#10;→ ROOM_BOOKING (เมื่อเผยแพร่)\"><rect x=\"746\" y=\"408\" width=\"210\" height=\"40\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"851\" y=\"433\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">SCHEDULED_CLASS<\/text><\/g><g data-tip=\"TIMETABLE_VERSION draft → review → published&#10;มาจาก:&#10;← CANDIDATE&#10;ไปที่:&#10;→ SCHEDULED_CLASS&#10;→ CHANGE_LOG + CHANGE_REQUEST\"><rect x=\"990\" y=\"400\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"1095\" y=\"424\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">TIMETABLE_VERSION<\/text><text x=\"1095\" y=\"442\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">draft → review → published<\/text><\/g><g data-tip=\"CHANGE_LOG + CHANGE_REQUEST&#10;มาจาก:&#10;← TIMETABLE_VERSION draft → review → published\"><rect x=\"990\" y=\"502\" width=\"210\" height=\"56\" rx=\"5\" fill=\"#e7f6ec\" stroke=\"#166534\" stroke-width=\"1.5\"/><text x=\"1095\" y=\"526\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">CHANGE_LOG<\/text><text x=\"1095\" y=\"544\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">+ CHANGE_REQUEST<\/text><\/g><polyline points=\"224,48 258,48\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"468,48 502,48\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"712,48 746,48\" fill=\"none\" \"851.0,212.0 856.0,201.0 846.0,201.0\" fill=\"#4b5563\"/><polygon points=\"258.0,240.0 247.0,235.0 247.0,245.0\" fill=\"#4b5563\"/><polygon points=\"363.0,268.0 358.0,279.0 368.0,279.0\" fill=\"#4b5563\"/><polygon points=\"502.0,240.0 491.0,235.0 491.0,245.0\" fill=\"#4b5563\"/><polygon points=\"746.0,240.0 735.0,235.0 735.0,245.0\" fill=\"#4b5563\"/><polygon points=\"851.0,314.0 856.0,303.0 846.0,303.0\" fill=\"#4b5563\"/><polygon points=\"990.0,334.0 979.0,329.0 979.0,339.0\" fill=\"#4b5563\"/><polygon points=\"1095.0,400.0 1100.0,389.0 1090.0,389.0\" fill=\"#4b5563\"/><polygon points=\"956.0,428.0 967.0,433.0 967.0,423.0\" fill=\"#4b5563\"/><polygon points=\"712.0,428.0 723.0,433.0 723.0,423.0\" fill=\"#4b5563\"/><polygon points=\"1095.0,502.0 1100.0,491.0 1090.0,491.0\" fill=\"#4b5563\"/><polyline points=\"224,48 258,48\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"SOURCE_UPLOAD og_file (ไม่แก้) → normalised_file\"/><polyline points=\"468,48 502,48\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"normalised_file → PLAN_ROW + pdf_page, is_red\"/><polyline points=\"712,48 746,48\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PLAN_ROW + pdf_page, is_red → YEAR_PLAN หลักสูตร × ชั้นปี\"/><polyline points=\"956,48 990,48\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"YEAR_PLAN หลักสูตร × ชั้นปี → PROFILE ภาควิชา × ภาคเรียน\"/><polyline points=\"1095,76 1095,122\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PROFILE ภาควิชา × ภาคเรียน → RULE_SETTING\"/><polyline points=\"1095,162 1095,188 851,188 851,212\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"RULE_SETTING → PRECHECK_REPORT acknowledge\"/><polyline points=\"224,240 258,240\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"AVAILABILITY_SLOT (คน × ภาค) → ISSUE BLOCKER / WARNING\"/><polyline points=\"363,268 363,314\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"SUBJECT_PREFERENCE → ISSUE BLOCKER / WARNING\"/><polyline points=\"468,240 502,240\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"ISSUE BLOCKER / WARNING → DECISION\"/><polyline points=\"712,240 746,240\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"DECISION → PRECHECK_REPORT acknowledge\"/><polyline points=\"851,268 851,314\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"PRECHECK_REPORT acknowledge → GENERATION_RUN\"/><polyline points=\"956,334 990,334\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"GENERATION_RUN → CANDIDATE\"/><polyline points=\"1095,354 1095,400\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"CANDIDATE → TIMETABLE_VERSION draft → review → published\"/><polyline points=\"956,428 990,428\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"TIMETABLE_VERSION draft → review → published → SCHEDULED_CLASS\"/><polyline points=\"712,428 746,428\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"SCHEDULED_CLASS → ROOM_BOOKING (เมื่อเผยแพร่)\"/><polyline points=\"1095,456 1095,502\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"TIMETABLE_VERSION draft → review → published → CHANGE_LOG + CHANGE_REQUEST\"/><\/svg><\/div>\n\n🟧 ข้อมูลนำเข้า · 🟦 ข้อมูลหลักของโปรไฟล์ · ⬜ การรันและตรวจ · 🟩 ผลลัพธ์และบันทึก\n\n## 4. ข้อกำหนดที่ห้ามผิด (invariants)\n\nใช้ตัดสินใจ constraint ใน DB และ validation ใน API:\n\n1. **หนึ่ง year plan อ่านจาก SOURCE_UPLOAD (หลักสูตรเวอร์ชัน) เดียว** วิชาจึงไม่ปนเวอร์ชันภายในชั้นปี แต่หนึ่ง profile อาจมีหลายเวอร์ชัน\n2. **หนึ่ง profile ต่อภาควิชาต่อภาคเรียน** ครอบคลุมทุกหลักสูตรของภาควิชา (ไม่แยกตามหลักสูตร) เพื่อให้ตรวจการชนอาจารย์/ห้องภายใน profile เดียว\n3. **เวลาว่างผูกกับคน × ภาคเรียน** (ครั้งเดียว) ใช้ร่วมทุกภาควิชา การจัดอันดับวิชาแยกภาควิชา\n4. **ตารางที่บันทึก/เผยแพร่ไม่มีการชนแบบ hard** (อาจารย์ / ห้อง / กลุ่มซ้อนเวลา)\n5. **GENERATION_RUN ต้องอ้าง PRECHECK_REPORT ที่ `acknowledged_by` ไม่ว่าง**\n6. **ปิด ISSUE ได้ด้วยการมี DECISION เท่านั้น** (`decided_by`, `decided_at`, `note`)\n7. **เผยแพร่ได้เฉพาะ HEAD** (`published_by` ต้องมี membership role = HEAD)\n8. **`og_file` ห้ามแก้** ทุกการแก้ค่าเป็นการแก้ PLAN_ROW ไม่ใช่ไฟล์\n9. **ทุกการเปลี่ยนตารางมี CHANGE_LOG** (ใคร ค่าเก่า ค่าใหม่ `agreed_with` ถ้ามี) ผ่าน project service ตัวเดียว (N1)\n10. **วันที่ภาคเรียนมาจาก ACADEMIC_TERM เท่านั้น** ไม่อ่านจากไฟล์หลักสูตร\n11. **ห้องร่วมจองซ้ำไม่ได้ข้ามภาควิชา** ROOM_BOOKING ตรวจตอนยืนยันห้อง (ขั้น 7) และเผยแพร่\n12. **ไม่มีข้อมูลนักศึกษา** ไม่มี entity ของนักศึกษา (STUDENT_GROUP คือกลุ่มเรียน ไม่ใช่คน)\n\n## 5. ข้อมูลที่ Frontend ต้องการจาก API (ขั้นต่ำสำหรับ MVP)\n\nยังไม่มี data contract จริง จึงระบุแค่เนื้อหา ไม่ระบุรูปแบบ:\n\n| หน้าจอ | ต้องการ |\n|---|---|\n| ตาราง | SCHEDULED_CLASS + PLAN_ROW + COURSE (รหัส ชื่อ ท-ป-น) + ห้อง + อาจารย์ + `pinned` + สถานะชน/WARNING พร้อมคาบคู่ชน |\n| ถาด \"ยังไม่ลง\" | คาบที่ไม่ได้ลง + `reason` + `suggested_fix` |\n| ผลรัน | `status` (ok/partial/failed), คะแนนคุณภาพ, ตัวเลือก N แบบ, ความคืบหน้า |\n| ตรวจสด | คำถาม \"วางคาบ X ที่ (วัน, คาบ) ได้ไหม\" → ok หรือเหตุผล (`POST /api/check`) |\n| ตรวจข้อมูล | PLAN_ROW + `is_red` + เหตุผล + `pdf_page` + ภาพครอบหน้า |\n| ผลกระทบของการแก้ | จำนวนและรายการคาบที่จะขยับ |\n"}, {"g": "เอกสารนักพัฒนา", "id": "dev-api", "t": "เส้น API", "p": "dev/api.md", "md": "# เส้น API (API routes)\n\n> **ข้อเสนอจากฝั่ง Frontend ให้อานนท์ (FastAPI) ตรวจและปรับ** ไม่ใช่สเปกที่ตกลงแล้ว เอกสารต้นฉบับกำหนดแค่ `POST /api/check` ที่เหลือถอดจาก [flows](flows.md), [หน้าและเส้นทาง](pages-and-routes.md) และ [โมเดลข้อมูล](data-model.md)\n> เมื่ออานนท์ทำ Pydantic model เสร็จ ให้ถือ `/openapi.json` เป็นหลัก และแก้ไฟล์นี้ให้ตรง\n\n## 1. ข้อตกลงทั่วไป\n\n| เรื่อง | ข้อเสนอ |\n|---|---|\n| Base path | `/api` (เวอร์ชันภายหลังเป็น `/api/v2`) |\n| รูปแบบ | JSON, UTF-8, ชื่อฟิลด์ `snake_case`, เวลาเป็น ISO 8601 |\n| ยืนยันตัวตน | คุกกี้เซสชัน `HttpOnly` (หรือ Bearer) ตามที่ทีมเลือก (decisions O1) |\n| สิทธิ์ | ตรวจที่ backend ทุก endpoint คอลัมน์ \"ใคร\" ด้านล่าง: **A** ADMIN (`user.is_admin` ระดับสถาบัน ไม่ใช่สมาชิกภาควิชา) · **H** HEAD · **S** ASSISTANT · **T** TEACHER · **\\*** ทุกคนที่ล็อกอิน |\n| ขอบเขตภาควิชา | ผู้ใช้เห็น/แก้ได้เฉพาะภาควิชาที่มี membership ตรวจที่ backend ห้ามเชื่อ Frontend |\n| งานนาน | คืน `202 Accepted` + `{ \"job_id\": … }` แล้วให้ poll `GET …/{id}` (ใช้กับ รัน solver, อ่านไฟล์หลักสูตร, ส่งออก PDF) |\n| แก้ข้อมูลที่ล็อก | เวอร์ชัน `published` แก้ไม่ได้ → `409 Conflict` ให้สร้างเวอร์ชันใหม่แทน |\n| อัปโหลด | `multipart/form-data` |\n\n### รูปแบบ error (ทุก endpoint)\n\n```json\n{\n  \"error\": {\n    \"code\": \"PRECHECK_NOT_ACKNOWLEDGED\",\n    \"message\": \"ต้องรับทราบรายงาน pre-check ก่อนสร้างตาราง\",\n    \"details\": { \"profile_id\": \"…\" }\n  }\n}\n```\n\n| HTTP | ใช้เมื่อ |\n|---|---|\n| 400 / 422 | ข้อมูลเข้าไม่ถูกต้อง (FastAPI คืน 422 ให้เอง) |\n| 401 | ยังไม่ล็อกอิน / เซสชันหมดอายุ |\n| 403 | บทบาทไม่พอ (เช่น ASSISTANT กดเผยแพร่) |\n| 404 | ไม่พบ หรือไม่อยู่ในภาควิชาที่เข้าถึงได้ |\n| 409 | สถานะไม่อนุญาต (เวอร์ชันล็อก, ขั้นล้าสมัย, ยังมีแถวแดง) |\n| 410 | ลิงก์เชิญหมดอายุ |\n| 5xx | ระบบผิดพลาด (FET ค้าง → ดู §8) |\n\n**รหัส error ที่ UI ต้องรู้** (ใช้แสดงข้อความตาม [flows → ตารางผิดพลาดรวม](flows.md)):\n`INVITE_EXPIRED` · `TERM_NOT_IN_CALENDAR` · `FILE_UNREADABLE` · `RED_ROWS_REMAIN` · `UNKNOWN_LAYOUT` · `ISSUES_UNDECIDED` · `PRECHECK_NOT_ACKNOWLEDGED` · `PRECHECK_IMPOSSIBLE` · `SOLVER_FAILED` · `ROOM_BOOKED` · `VERSION_LOCKED` · `HEAD_ONLY` · `STEP_LOCKED` · `STEP_OUT_OF_DATE`\n\n---\n\n## 2. เข้าสู่ระบบและบัญชี\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/setup/status` | — | 0.0 | `{ \"needs_setup\": true }` ใช้ตัดสินใจว่าจะแสดงหน้าตั้งค่าครั้งแรกไหม |\n| POST | `/api/setup` | — | 0.0 | ชื่อสถาบัน ภาษา ผู้ดูแลคนแรก ใช้ได้ **ครั้งเดียว** หลังนั้น 409 |\n| POST | `/api/auth/login` | — | 0.1 | |\n| POST | `/api/auth/logout` | * | | |\n| POST | `/api/auth/password-reset` | — | 0.2 | ผู้ใช้ขอเอง: ตอบ 202 เสมอ (ไม่บอกว่ามีอีเมลนี้ไหม) ส่งลิงก์ทางอีเมลเฉพาะเมื่อตั้ง SMTP ไม่มี SMTP = ไม่ทำอะไร ให้ติดต่อผู้ดูแล/หัวหน้า |\n| POST | `/api/auth/password-reset/confirm` | — | 0.2 | `{ token, new_password }` ลิงก์ใช้ได้ครั้งเดียว หมดอายุ → 410 |\n| POST | `/api/admin/users/{id}/reset-link` | A | 0.2 | สร้างลิงก์รีเซ็ต คืน `reset_url` ให้คัดลอกส่งเอง (ส่งอีเมลด้วยเมื่อมี SMTP) |\n| POST | `/api/departments/{dep}/people/{user}/reset-link` | H | 2.3 | เหมือนข้างบน **ข้อเสนอ:** หัวหน้าสร้างได้เฉพาะให้ผู้ใช้ที่ไม่ใช่ ADMIN และไม่เป็น HEAD ภาควิชาอื่น (ลิงก์รีเซ็ต = ยึดบัญชีได้ทั้งบัญชี ไม่ใช่แค่ภาควิชานี้) |\n| GET | `/api/invites/{token}` | — | 0.3 | บอกภาควิชา บทบาท และว่า `has_account` ไหม (404/410 ถ้าหมดอายุ) |\n| POST | `/api/invites/{token}/accept` | — | 0.3 | ผู้ใช้ใหม่ส่งชื่อ+รหัสผ่าน / ผู้ใช้เดิมล็อกอินแล้วเรียกเฉย ๆ |\n| GET | `/api/me` | * | แถบบน | ผู้ใช้ + `is_admin` + **memberships** (ภาควิชา + บทบาท) สำหรับตัวสลับ (ถ้า `is_admin` แสดง \"ผู้ดูแลสถาบัน\" แยก) |\n| PATCH | `/api/me` | * | 1.2 | ชื่อ รหัสผ่าน ภาษา (`th`/`en`) ตั้งค่าอีเมล |\n| GET | `/api/notifications` | * | 1.1 | `?unread=true` แจ้งในแอปเสมอ ส่งอีเมลเพิ่มเมื่อมี SMTP |\n| POST | `/api/notifications/{id}/read` | * | 1.1 | |\n\n## 3. ผู้ดูแลสถาบัน (ADMIN)\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/admin/overview` | A | 3.1 | ภาควิชา: เชิญแล้ว / เข้าร่วม / มีโปรไฟล์ / เผยแพร่ + ว่ามีอัปเดต |\n| GET, POST | `/api/admin/departments` | A | 3.2 | |\n| PATCH, DELETE | `/api/admin/departments/{id}` | A | 3.2 | |\n| POST | `/api/admin/departments/{id}/head-invite` | A | 3.2 | ถ้าไม่ได้ตั้ง SMTP คืน `invite_url` ให้คัดลอก (ไม่ใช่ส่งอีเมล) |\n| DELETE | `/api/admin/departments/{id}/head` | A | 3.2 | |\n| GET, POST | `/api/admin/shared-rooms` | A | 3.3 | ห้องที่ `department_id` ว่าง |\n| PATCH, DELETE | `/api/admin/shared-rooms/{id}` | A | 3.3 | |\n| GET, POST | `/api/admin/terms` | A | 3.4 | ภาคเรียน (+ วันหยุด) |\n| PATCH, DELETE | `/api/admin/terms/{id}` | A | 3.4 | |\n| PUT | `/api/admin/terms/{id}/holidays` | A | 3.4 | ส่งทั้งรายการ |\n| GET | `/api/admin/formats` | A | 3.5 | `?status=unverified` |\n| GET | `/api/admin/formats/{id}` | A | 3.5 | หน้าตัวอย่าง คอลัมน์ที่หัวหน้าชี้ และสิ่งที่อ่านได้จาก 3 หน้าอื่น |\n| POST | `/api/admin/formats/{id}/approve` | A | 3.5 | |\n| POST | `/api/admin/formats/{id}/reject` | A | 3.5 | `{ \"note\": \"…\" }` หัวหน้าเห็นในขั้น 1 |\n| GET | `/api/admin/formats/{id}/export` | A | 3.5 | ไฟล์ definition ส่งให้โครงการ |\n| GET | `/api/admin/system` | A | 3.6 | เวอร์ชัน สถานะบริการ บันทึกการรัน solver |\n| PUT | `/api/admin/system/smtp` | A | 3.6 | ไม่บังคับ |\n| GET, POST | `/api/admin/system/backups` | A | 3.6 | |\n| POST | `/api/admin/system/backups/{id}/restore` | A | 3.6 | ย้อนยาก ต้อง confirm ฝั่ง UI |\n\n## 4. ภาควิชา: บุคลากรและห้อง (HEAD / ASSISTANT)\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/departments/{dep}/people` | H S | 2.3 | อาจารย์ + ผู้ช่วย พร้อมสถานะ เชิญแล้ว/เข้าร่วมแล้ว |\n| POST | `/api/departments/{dep}/invites` | H S | 2.3 | `role`: `TEACHER` / `ASSISTANT` ผู้ช่วยเชิญ **อาจารย์** ได้ เชิญ **ผู้ช่วย** ได้เฉพาะ H → S เชิญ ASSISTANT = `403` (D12) |\n| POST | `/api/departments/{dep}/invites/{id}/resend` | H S | 2.3 | |\n| DELETE | `/api/departments/{dep}/people/{user}` | H | 2.3 | ลบหัวหน้าไม่ได้ |\n| GET, POST | `/api/departments/{dep}/rooms` | H S | 2.3 | ห้องของภาควิชา (ชื่อ ประเภท ที่นั่ง) |\n| PATCH, DELETE | `/api/departments/{dep}/rooms/{id}` | H S | 2.3 | |\n| GET | `/api/departments/{dep}/rooms/available` | H S | ขั้น 5 | ห้องของภาควิชา + ห้องร่วม ใช้เลือกตอนตั้งค่า |\n| GET | `/api/departments/{dep}/home` | H S | 2.1 | สิ่งที่ต้องทำ: อาจารย์ล่าช้า, blocker, คำขอใหม่, โปรไฟล์ที่ทำค้าง |\n\n## 5. โปรไฟล์และการนำเข้าหลักสูตร (ขั้น 1-2)\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/departments/{dep}/profiles` | H S | 2.2 | ชื่อ ภาคเรียน ชั้นปี สถานะ |\n| POST | `/api/departments/{dep}/profiles` | H S | 2.2 | `{ name, term_id, programs[] }` ถ้า `term_id` ไม่อยู่ในปฏิทิน → `TERM_NOT_IN_CALENDAR` |\n| POST | `/api/profiles/{id}/copy` | H S | F3 | **คัดลอกจากภาคก่อน** `{ term_id }` เลื่อนชั้นปี เพิ่มกลุ่มปี 1 ใหม่ |\n| GET | `/api/profiles/{id}` | H S | 2.4 | รวมสถานะ **ทุกขั้น** (`done` / `current` / `out_of_date` / `locked` + เหตุผลที่ล็อก) และแท็บ หลักสูตร × ชั้นปี ใช้วาด Stepper |\n| PATCH | `/api/profiles/{id}` | H S | 2.4 | ชื่อ ภาคเรียน เลือกหลักสูตร (แก้แล้วขั้นหลัง `out_of_date`) |\n| DELETE | `/api/profiles/{id}` | H | 2.2 | |\n| POST | `/api/profiles/{id}/uploads` | H S | ขั้น 1 | **multipart**: `file`, `program_id` → `202 { job_id }` |\n| GET | `/api/uploads/{id}` | H S | ขั้น 1 | สถานะอ่านไฟล์ + การ์ด **\"สิ่งที่เราพบ\"** (รูปแบบ เวอร์ชันหลักสูตร ชั้นปี ภาคเรียน หน่วยกิต พร้อม `page` ต่อค่า) |\n| POST | `/api/uploads/{id}/confirm` | H S | ขั้น 1 | ยืนยันค่าที่ตรวจจับ (ส่งค่าที่แก้ด้วย) |\n| POST | `/api/uploads/{id}/format` | H S | 2.4.1 | บันทึกเลย์เอาต์ที่ไม่รู้จัก: คอลัมน์ที่ชี้ → format `unverified` |\n| GET | `/api/uploads/{id}/pages/{n}` | H S | ขั้น 2 | ภาพหน้า PDF `?highlight=x,y,w,h` ไฮไลต์ตำแหน่ง |\n| GET | `/api/year-plans/{yp}/rows` | H S | ขั้น 2 | แถวแผน + `is_red`, `reason`, `pdf_page`, `bbox` · `?red=true` |\n| PATCH | `/api/year-plan-rows/{id}` | H S | ขั้น 2 | แก้ค่า หรือ `{ \"accept\": true }` (ถูกแล้ว) |\n| GET | `/api/year-plans/{yp}/flow` | H S | ขั้น 2 | ข้อมูลผังกระบวนวิชา |\n| POST | `/api/year-plans/{yp}/complete-review` | H S | ขั้น 2 | ยังมีแถวแดง → `409 RED_ROWS_REMAIN` พร้อมจำนวน |\n\n`uploads` สถานะ: `queued` → `reading` → `needs_format` | `ready` | `failed` (`FILE_UNREADABLE` + เหตุผล ไม่บันทึกอะไร)\n\n## 6. เวลาว่างและปัญหาข้อมูลอาจารย์ (ขั้น 3-4)\n\n### อาจารย์ (T)\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/me/availability?term_id=` | T | 4.2 | ตารางไม่ว่าง **ครั้งเดียวต่อคน** + ช่อง \"ไม่ว่างที่ภาควิชาอื่น\" |\n| PUT | `/api/me/availability?term_id=` | T | 4.2 | ส่งทั้งตาราง + ชั่วโมงสูงสุด/วัน (เก็บที่ `TEACHER_TERM_SETTING` หนึ่งค่าต่อคนต่อภาค ใช้ร่วมทุกภาควิชา) แก้ได้จนถึงกำหนดส่ง หลังนั้น 409 |\n| GET | `/api/me/subject-preferences?dept=&term_id=` | T | 4.2 | วิชาที่ภาควิชาเปิด + อันดับ |\n| PUT | `/api/me/subject-preferences?dept=&term_id=` | T | 4.2 | |\n| POST | `/api/rounds/{id}/submit` | T | 4.2 | ส่ง → คืนใบรับ (`receipt`: สิ่งที่หัวหน้าจะเห็น) |\n| GET | `/api/me/issues` | T | 4.3 | blocker/warning ที่เกี่ยวกับฉัน |\n\n### หัวหน้า / ผู้ช่วย (H S)\n\n| Method | Path | ใช้ที่ | หมายเหตุ |\n|---|---|---|---|\n| POST | `/api/profiles/{id}/rounds` | ขั้น 3 | เปิดรอบ `{ teacher_ids[], deadline }` → แจ้งอาจารย์ |\n| GET | `/api/rounds/{id}` | ขั้น 3 | กระดานสถานะ: `submitted` / `not_yet` / `late` ต่ออาจารย์ |\n| POST | `/api/rounds/{id}/remind` | ขั้น 3 | `{ user_ids[]? }` |\n| PUT | `/api/rounds/{id}/responses/{user}` | ขั้น 3 | หัวหน้ากรอกแทน หรือ `{ \"any_time\": true }` บันทึกว่าใครแก้ |\n| GET | `/api/profiles/{id}/issues` | ขั้น 4 | ระบบสร้างเอง `?severity=BLOCKER&state=open` |\n| GET | `/api/issues/{id}` | ขั้น 4 / 4.3 | พร้อมเธรดความเห็น (ใช้ร่วมกับอาจารย์) |\n| POST | `/api/issues/{id}/comments` | H S T | เธรดเดียวกัน อาจารย์ตอบจาก 4.3 |\n| POST | `/api/issues/{id}/decision` | H S | `{ outcome, note }` outcome: `assign` · `outside_teacher` · `split` · `accept` · `change` บันทึก ใคร/เมื่อไหร่/ทำไม |\n| POST | `/api/profiles/{id}/issues/complete` | H S | มีรายการยังไม่ตัดสินใจ → `409 ISSUES_UNDECIDED` |\n\n## 7. กฎ, pre-check, สร้างตาราง (ขั้น 5-6)\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/profiles/{id}/rules` | H S | ขั้น 5 | กฎ hard (อ่านอย่างเดียว) + soft (เปิด/ปิด + น้ำหนัก) + ตารางเวลา กลุ่ม จำนวนห้อง |\n| PUT | `/api/profiles/{id}/rules` | H S | ขั้น 5 | แก้แล้วขั้น 6-9 ของชั้นปีที่เกี่ยวข้อง `out_of_date` |\n| PUT | `/api/year-plans/{yp}/electives/{row}` | H S | ขั้น 5 | `{ mode: \"SCHEDULE\", course_id }` หรือ `{ mode: \"RESERVE\" }` |\n| POST | `/api/profiles/{id}/prechecks` | H S | ขั้น 5 | Check → รายงาน `{ result: ok\\|problems\\|risky, items[] }` ถ้าเป็นไปไม่ได้ จะมี `reason` + `fix` (\"ปี 2 ต้องการ 38 ชม. สัปดาห์มี 30\") |\n| POST | `/api/prechecks/{id}/acknowledge` | H S | ขั้น 5 | ปลด Generate บันทึกกับการรัน |\n| POST | `/api/profiles/{id}/runs` | H S | ขั้น 6 | **Generate** `{ precheck_id, year_plan_id?, pinned_class_ids?[], candidates?: 3 }` → `202 { run_id }` ไม่ acknowledge → `409 PRECHECK_NOT_ACKNOWLEDGED` |\n| GET | `/api/runs/{id}` | H S | ขั้น 6 | poll: สถานะ + ผล (ดู §7.1) |\n| POST | `/api/runs/{id}/cancel` | H S | ขั้น 6 | ปุ่มยกเลิกระหว่างรัน |\n| POST | `/api/runs/{id}/candidates/{c}/select` | H S | ขั้น 6 | เลือกตัวเลือก → สร้างเวอร์ชัน `draft` |\n\n### 7.1 ผลการรัน (`GET /api/runs/{id}`)\n\n```json\n{\n  \"id\": \"run_1\",\n  \"status\": \"partial\",\n  \"progress\": { \"stage\": \"solving\", \"percent\": 100 },\n  \"candidates\": [\n    {\n      \"id\": \"c1\",\n      \"score\": 82,\n      \"placed\": [\n        { \"class_id\": \"k1\", \"plan_row_id\": \"r12\", \"group_id\": \"g3\",\n          \"teacher_ids\": [\"u7\"], \"room_id\": \"rm4\",\n          \"day\": 0, \"start_period\": 7, \"span\": 2, \"pinned\": false }\n      ],\n      \"unplaced\": [\n        { \"class_id\": \"k9\", \"plan_row_id\": \"r30\",\n          \"reason\": \"อ.ปฐพนพัทธ์ ไม่ว่างทุกคาบที่ห้อง COM603 ว่าง\",\n          \"fix\": \"ปลดเวลาไม่ว่างวันพฤหัส คาบ 3–4 ของอาจารย์\" }\n      ]\n    }\n  ],\n  \"error\": null\n}\n```\n\n- `status`: `queued` · `running` · `ok` (ครบ) · `partial` (มี `unplaced` **ไม่ใช่ความล้มเหลว**) · `failed` · `cancelled`\n- `failed` → `error: { code: \"SOLVER_FAILED\", message: \"ตัวจัดตารางหยุด: <เหตุผล>\" }` และ **เก็บผลดีล่าสุดไว้**\n- รูปเดียวกับ mock ใน [`frontend/src/api/generate.js`](../../frontend/src/api/generate.js) (ปรับ `placed[]`/`unplaced[]` ให้ตรงเมื่อมีสเปกจริง)\n\n## 8. ตาราง จัดมือ ห้อง ตรวจทาน เผยแพร่ (ขั้น 6-9)\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/versions/{v}` | H S | ขั้น 6-9 | สถานะ (`draft` / `review` / `published`) หมายเลขเวอร์ชัน คะแนน |\n| GET | `/api/versions/{v}/classes` | H S | ขั้น 6-7 | `?view=group\\|teacher\\|room&id=` พร้อมสถานะชน/warning ต่อคาบ |\n| **POST** | **`/api/check`** | H S | ขั้น 6 | **ตรวจสดตอนวาง** (มีในสเปกเดิม) ดู §8.1 |\n| PATCH | `/api/versions/{v}/classes/{c}` | H S | ขั้น 6-8 | ย้ายคาบ / เปลี่ยนอาจารย์ห้อง / `pinned` ส่ง `?dry_run=true` เพื่อดูผลกระทบโดยไม่บันทึก |\n| POST | `/api/versions/{v}/rerun` | H S | ขั้น 6 | รันใหม่รอบ pin `{ year_plan_id }` ที่อื่นถูก pin |\n| GET | `/api/versions/{v}/unplaced` | H S | ขั้น 6 | ถาด |\n| POST | `/api/versions/{v}/rooms/auto` | H S | ขั้น 7 | วางห้องอัตโนมัติหลังล็อกเวลา |\n| POST | `/api/versions/{v}/send-review` | H S | ขั้น 8 | → `review` แจ้งอาจารย์ |\n| GET | `/api/versions/{v}/change-requests` | H S | ขั้น 8 | ใคร อะไร เหตุผล **ผลกระทบ** |\n| POST | `/api/change-requests/{id}/approve` | H S | ขั้น 8 | รันใหม่แบบน้อยที่สุด (ที่เหลือ pin) แจ้งอาจารย์ + เก่า/ใหม่ |\n| POST | `/api/change-requests/{id}/reject` | H S | ขั้น 8 | `{ note }` |\n| POST | `/api/versions/{v}/publish` | **H** | ขั้น 9 | ASSISTANT → `403 HEAD_ONLY` เวอร์ชันล็อก แจ้งอาจารย์ทุกคน จอง ROOM_BOOKING |\n| POST | `/api/versions/{v}/publish-request` | S | ขั้น 9 | \"ขอให้หัวหน้า\" → แจ้ง HEAD |\n| GET | `/api/profiles/{id}/versions` | H S | 2.4.2 | ทุกเวอร์ชัน + change log |\n| POST | `/api/profiles/{id}/versions` | H | 2.4.2 | **เริ่มการเปลี่ยนแปลง** → ร่างเวอร์ชันใหม่จากที่เผยแพร่ |\n| GET | `/api/versions/{v}/changelog` | H S T | 2.4.2 | ใคร ค่าเก่า ค่าใหม่ `agreed_with` |\n| POST | `/api/versions/{v}/export` | H S | ขั้น 9 | `{ format: \"pdf\", view: \"group\\|teacher\\|room\", id }` → `202 { job_id }` แล้ว `GET /api/exports/{id}` ได้ลิงก์ไฟล์ |\n| GET | `/api/versions/{v}/print/{view}/{id}` | H S T | พรีวิว A4 | ข้อมูลสำหรับพรีวิว (หน้าเว็บพิมพ์เอง) |\n\n**Direct edit** ใช้ `PATCH …/classes/{c}` ใน `review` พร้อม `{ \"agreed_with\": \"ชื่อ\" }` ถ้าไม่ย้ายคาบอื่นมีผลทันที ถ้าย้ายคาบอื่นคืน `409`-like `{ \"needs_confirm\": true, \"impact\": [...] }` ให้ UI ถาม แล้วส่งซ้ำพร้อม `confirm=true` หลังเผยแพร่จะสร้างเวอร์ชันใหม่เสมอ\n\n### 8.1 `POST /api/check` (ตรวจสดตอนวาง)\n\nคำขอ:\n\n```json\n{ \"version_id\": \"v3\", \"class_id\": \"k1\", \"day\": 1, \"start_period\": 3, \"room_id\": \"rm4\", \"teacher_ids\": [\"u7\"] }\n```\n\nคำตอบ:\n\n```json\n{\n  \"ok\": false,\n  \"conflicts\": [\n    { \"kind\": \"TEACHER\", \"with_class_id\": \"k5\",\n      \"message\": \"ชนกับ ป.31901-2001 · อ.ปฐพนพัทธ์ · จันทร์ คาบ 7\" }\n  ],\n  \"warnings\": [],\n  \"impact\": []\n}\n```\n\n- `kind`: `TEACHER` · `ROOM` · `GROUP` · `ROOM_BOOKED` (`message` ระบุ \"จองโดย <ภาควิชา>\") · `HARD_RULE`\n- ต้องเร็ว (เรียกทุกครั้งที่ลากผ่านช่องบนตาราง) ไม่บันทึกอะไร\n\n## 9. อาจารย์: ตารางและคำขอ\n\n| Method | Path | ใคร | ใช้ที่ | หมายเหตุ |\n|---|---|:-:|---|---|\n| GET | `/api/me/timetable?term_id=` | T | 4.4 | **เฉพาะคาบของฉัน** (`draft` ใน REVIEW หรือ `published`) |\n| POST | `/api/me/change-requests` | T | 4.4 | `{ version_id, class_id, what, reason }` |\n| GET | `/api/me/change-requests` | T | 4.5 | รอ / อนุมัติ / ปฏิเสธ + หมายเหตุ และการเปลี่ยนที่หัวหน้าทำให้ฉัน (เก่า/ใหม่) |\n| GET | `/api/me/timetable/export?format=pdf` | T | 4.4 | ตารางของตัวเอง |\n\n---\n\n## 10. ลำดับเรียกที่ Frontend ใช้บ่อย\n\n**สร้างตาราง (ขั้น 5 → 6):**\n\n```\nPOST /profiles/{id}/prechecks           → รายงาน\nPOST /prechecks/{pc}/acknowledge\nPOST /profiles/{id}/runs                → 202 { run_id }\nGET  /runs/{run_id}   (poll ทุก 1 วิ จน status ≠ queued/running)\nPOST /runs/{run_id}/candidates/{c}/select → version\nGET  /versions/{v}/classes?view=group&id=g3\n```\n\n**ลากคาบ:**\n\n```\n(ขณะลาก)  POST /check   → แสดง ✓ / ✕ + เหตุผลทันที\n(ปล่อย)   PATCH /versions/{v}/classes/{c}?dry_run=true  → impact\n          PATCH /versions/{v}/classes/{c}               → บันทึก (+ CHANGE_LOG)\n```\n\n### ลำดับการเรียกเป็นภาพ\n\n**อัปโหลดและอ่านไฟล์หลักสูตร**\n\n```mermaid\nsequenceDiagram\n  participant UI as Frontend\n  participant API as FastAPI\n  participant IMP as import service\n  UI->>API: POST /profiles/{id}/uploads (multipart)\n  API-->>UI: 202 { job_id }\n  API->>IMP: อ่าน + แปลง + OCR\n  loop poll ทุก 1-2 วินาที\n    UI->>API: GET /uploads/{id}\n    API-->>UI: status: queued → reading\n  end\n  alt อ่านได้ รู้จักรูปแบบ\n    API-->>UI: status: ready + การ์ด \"สิ่งที่เราพบ\"\n    UI->>API: POST /uploads/{id}/confirm\n  else เลย์เอาต์ไม่รู้จัก\n    API-->>UI: status: needs_format\n    UI->>API: POST /uploads/{id}/format (คอลัมน์ที่ชี้)\n  else อ่านไม่ได้\n    API-->>UI: failed + FILE_UNREADABLE\n  end\n  UI->>API: GET /year-plans/{yp}/rows?red=true\n  API-->>UI: แถวแดง + เหตุผล + pdf_page\n```\n\n**Pre-check → Generate → เลือกตัวเลือก**\n\n```mermaid\nsequenceDiagram\n  participant UI as Frontend\n  participant API as FastAPI\n  participant FET as FET solver\n  UI->>API: POST /profiles/{id}/prechecks\n  API-->>UI: รายงาน (ok / problems / risky)\n  UI->>API: POST /prechecks/{pc}/acknowledge\n  UI->>API: POST /profiles/{id}/runs\n  API-->>UI: 202 { run_id }\n  API->>FET: รัน\n  loop poll\n    UI->>API: GET /runs/{run_id}\n    API-->>UI: queued / running + progress\n  end\n  FET-->>API: ผล\n  API-->>UI: ok | partial (+ unplaced) | failed (SOLVER_FAILED)\n  UI->>API: POST /runs/{run_id}/candidates/{c}/select\n  API-->>UI: version (draft)\n```\n\n**ลากคาบบนตาราง (ตรวจสด → บันทึก)**\n\n```mermaid\nsequenceDiagram\n  participant UI as Frontend\n  participant API as FastAPI\n  loop ขณะลากผ่านช่อง\n    UI->>API: POST /check\n    API-->>UI: ok / conflicts[kind, message]\n  end\n  Note over UI: ปล่อยที่ช่องที่ ok\n  UI->>API: PATCH /versions/{v}/classes/{c}?dry_run=true\n  API-->>UI: impact (คาบที่จะขยับ)\n  alt ไม่กระทบอื่น\n    UI->>API: PATCH …/classes/{c}\n    API-->>UI: บันทึก + CHANGE_LOG\n  else ย้ายคาบอื่น\n    UI->>UI: ถามยืนยัน\n    UI->>API: PATCH …/classes/{c}?confirm=true\n    API-->>UI: บันทึก + CHANGE_LOG\n  end\n```\n\n**ตรวจทานและเผยแพร่**\n\n```mermaid\nsequenceDiagram\n  participant H as HEAD / ASSISTANT\n  participant API as FastAPI\n  participant T as TEACHER\n  H->>API: POST /versions/{v}/send-review\n  API-->>T: notification\n  T->>API: GET /me/timetable (เฉพาะของตน)\n  T->>API: POST /me/change-requests\n  H->>API: GET /versions/{v}/change-requests (พร้อม impact)\n  H->>API: POST /change-requests/{id}/approve\n  API-->>T: แจ้ง เก่า/ใหม่\n  alt ASSISTANT กดเผยแพร่\n    H->>API: POST /versions/{v}/publish\n    API-->>H: 403 HEAD_ONLY\n    H->>API: POST /versions/{v}/publish-request\n    API-->>API: แจ้ง HEAD\n  else HEAD เผยแพร่\n    H->>API: POST /versions/{v}/publish\n    API-->>T: notification + จอง ROOM_BOOKING\n  end\n```\n\n## 11. ที่ยังไม่รู้ (ถามอานนท์)\n\n| เรื่อง | ทำไมสำคัญ |\n|---|---|\n| FET ถูกเรียกอย่างไร และใช้เวลาจริงเท่าไร | ตัดสินว่า `runs` ต้อง async จริงไหม และความถี่ poll |\n| `/api/check` ทำงานเร็วพอสำหรับตอนลากหรือไม่ | ถ้าช้า UI ต้อง debounce / ตรวจเฉพาะตอนปล่อย |\n| ชนิดของ `class_id` | ต้อง stable ข้ามการรันใหม่ เพื่อให้ pin ใช้ได้ |\n| ตัวเลือกยืนยันตัวตน (คุกกี้ หรือ token) | กระทบ CORS และการเก็บเซสชันฝั่ง Frontend |\n| `user.is_admin`, `TEACHER_TERM_SETTING`, `PASSWORD_RESET` เพิ่มได้ไหม และย้าย `max_hours_per_day` ออกจาก MEMBERSHIP | ตกลงแล้วฝั่งเรา (decisions D12) ต้องให้ backend รับ |\n| การส่งออก PDF ทำที่ backend หรือเบราว์เซอร์พิมพ์ | กระทบ endpoint `export` |\n\n## 12. หมายเหตุสำหรับ FastAPI\n\n- จัดกลุ่มด้วย `APIRouter(prefix=…, tags=[…])` ตามหัวข้อ §2-9 จะได้เอกสาร `/docs` แยกหมวดอ่านง่าย\n- ใช้ Pydantic model ทุก request/response (รวม enum สถานะตาม [data-model §3](data-model.md)) ให้ `/openapi.json` เป็นสัญญาจริง\n- ตรวจสิทธิ์ด้วย `Depends(require_role(...))` ที่เดียว ไม่เขียนกระจายใน handler\n- ตั้ง `CORSMiddleware` (ระหว่างพัฒนา: `http://localhost:5173`) หรือให้ Vite proxy `/api`\n- งานนาน (`uploads`, `runs`, `exports`) ใช้ `BackgroundTasks` หรือคิวงาน แล้วเก็บสถานะในตาราง job\n"}, {"g": "เอกสารนักพัฒนา", "id": "dev-decisions", "t": "บันทึกการตัดสินใจ", "p": "dev/decisions.md", "md": "# บันทึกการตัดสินใจ (Decision log)\n\nรวมการตัดสินใจที่กระจายอยู่ในต้นฉบับ แต่ละข้อมี **บริบท → ตัดสินใจ → เหตุผล** เรียงตามหัวข้อ\nวันที่ตามต้นฉบับ (2026-10-24 เป็นวันตัดสินใจส่วนใหญ่)\n\n## ที่ตัดสินใจแล้ว\n\n### D1 Self-hosted และโอเพนซอร์ส\n- **ตัดสินใจ** แต่ละสถาบันติดตั้งและรันสำเนาของตนเอง ไม่มีผู้ดูแลแพลตฟอร์มกลาง\n- **เหตุผล** ข้อมูลอาจารย์ไม่ออกนอกสถาบัน (N2/PDPA) โครงการโอเพนซอร์สส่งโค้ดกับรูปแบบหลักสูตรที่ใช้ร่วม แต่ไม่เห็นข้อมูล\n- **ผลต่อโค้ด** ต้องมีหน้าตั้งค่าครั้งแรก (0.0), หน้าระบบ (3.6: สำรองข้อมูล SMTP), ติดตั้งด้วย `docker compose up`\n\n### D2 หนึ่ง profile ต่อภาควิชาต่อภาค มีหลาย year plan\n- **บริบท** PDF หลักสูตร 5 ปี ควรเป็น 1 profile หรือ 5 profile\n- **ตัดสินใจ** 1 profile ต่อภาควิชาต่อภาค ภายในมี year plan ต่อ หลักสูตร × ชั้นปี\n- **เหตุผล** อาจารย์และห้องชุดเดียวกันรองรับทุกชั้นปีพร้อมกัน แยก profile จะตรวจการชนข้าม profile ซึ่งเปราะที่สุด และเสียหนึ่งการตรวจทาน/เผยแพร่/เวอร์ชันให้เหลือ 5 อันที่อาจเพี้ยนกัน\n- **ผลต่อโค้ด** แท็บ หลักสูตร × ชั้นปี สถานะแยกต่อ year plan รันใหม่ต่อ year plan (ที่อื่น pin) คัดลอกจากภาคก่อนให้ year plan เลื่อนขึ้นตามนักศึกษา\n- **แก้การตัดสินใจเดิม** เดิมใน `tech-stack-list.txt` คือ \"1 profile = 1 เวอร์ชันหลักสูตร\" ตอนนี้ 1 year plan = 1 เวอร์ชันหลักสูตร\n\n### D3 ทุกหลักสูตรของภาควิชาใน profile เดียว\n- **ตัดสินใจ** ค.บ., เทียบโอน, ศษ.ม., ปร.ด. อยู่ใน profile เดียว (แท็บ = หลักสูตร × ชั้นปี)\n- **เหตุผล** อาจารย์และห้องใช้ร่วมกันข้ามหลักสูตร\n\n### D4 ตรวจจับก่อน ยืนยันทีหลัง (ไม่ให้เลือกรูปแบบเอง)\n- **ตัดสินใจ** ระบบอ่านไฟล์แล้วเติมค่า ผู้ใช้ยืนยัน/แก้ พร้อมหลักฐานต่อค่า เลย์เอาต์ไม่รู้จัก → ผู้ใช้ชี้คอลัมน์ → บันทึกเป็น format definition\n- **เหตุผล** เลือกรูปแบบผิด = ตั้งค่าผิดทั้งหมดต่อจากนั้น และต้องรองรับหลักสูตรชนิดใหม่โดยไม่ต้องมีโปรแกรมเมอร์\n- **ผลต่อโค้ด** format definition เป็น **ข้อมูล** ไม่ใช่โค้ด (เปลี่ยนเลย์เอาต์ไม่ต้องอัปเดตระบบ มีแต่ระบบหน่วยกิตใหม่จริงที่ต้องเขียนโค้ด) เริ่มเป็น `unverified` จน ADMIN อนุมัติ\n\n### D5 เวลาว่างครั้งเดียวต่อคน\n- **ตัดสินใจ** ใช้ร่วมทุกภาควิชา HEAD เห็น \"ไม่ว่างที่ภาควิชาอื่น\" การจัดอันดับวิชาแยกภาควิชา\n- **เหตุผล** อาจารย์สอนข้ามภาควิชาได้ ถามซ้ำเสียเวลาและเสี่ยงข้อมูลขัดกัน\n\n### D6 บทบาท ASSISTANT\n- **ตัดสินใจ** หน้าเดียวกับ HEAD ทำขั้น 1-8 ได้ แต่เผยแพร่ ลบ HEAD เชิญผู้ช่วยคนอื่นไม่ได้\n- **ผลต่อโค้ด** ปุ่มเผยแพร่ของ ASSISTANT disabled + เหตุผล + ปุ่มขอ HEAD ทุกการเปลี่ยนบันทึกว่าใครทำ\n\n### D7 ไม่มีลิงก์สาธารณะสำหรับนักศึกษา\n- **ตัดสินใจ** อาจารย์แจกตารางที่พิมพ์/PDF เอง ไม่มีบทบาทนักศึกษา (N3)\n\n### D8 Direct edit ควบคู่ change request\n- **บริบท** หัวหน้ากับอาจารย์มักตกลงเรื่องเล็กต่อหน้า การให้ยื่นคำขอเป็นภาระ\n- **ตัดสินใจ** ใน REVIEW HEAD แก้ตรง ๆ ได้ พร้อม \"ตกลงกับ ___\" แจ้งอาจารย์ที่ได้รับผลกระทบ แก้ที่ย้ายคาบอื่นถามก่อน คำขอแบบเป็นทางการคงไว้สำหรับอาจารย์ที่ไม่ได้คุยกับหัวหน้าหรือการเปลี่ยนใหญ่\n- **ผลต่อโค้ด** หลังเผยแพร่ direct edit สร้างเวอร์ชันใหม่เสมอ\n\n### D9 Pre-check ต้อง acknowledge\n- **ตัดสินใจ** ก่อน Generate ต้องกดรับทราบรายงาน pre-check การรับทราบถูกบันทึกกับการรัน\n\n### D10 Design system: เครื่องมือแบบ Office ไม่ใช่ Dashboard\n- **ตัดสินใจ** ตารางเป็นพระเอก UI อื่นเป็นแถบเครื่องมือรอบตาราง เดสก์ท็อปก่อน (≥1280px เต็ม; <1024px อ่านอย่างเดียว)\n- **ผลต่อโค้ด** สถานะ = สี + ไอคอน/ข้อความเสมอ ไม่พึ่งสีอย่างเดียว ดู [design-system.md](../th/7-design-system/design-system.md)\n\n### D11 Backend ใช้ Python + FastAPI\n- **ตัดสินใจ** อานนท์ใช้ Python ทำ API (FastAPI) และจัดการเอกสาร (นำเข้า/แปลงไฟล์หลักสูตร)\n- **เหตุผล** FastAPI สร้างสเปก OpenAPI อัตโนมัติ ใช้เป็น data contract ระหว่าง backend กับ Frontend ได้ และ Python มีเครื่องมือ PDF/OCR พร้อม\n- **ผลต่อโค้ด** Frontend อ่านสเปกจาก `/openapi.json` เพื่อสร้าง type/client; ตั้ง CORS หรือ proxy ใน `vite.config.js`; อัปโหลดไฟล์เป็น `multipart/form-data`; งานนานใช้ background task + poll สถานะ; mock ที่ `frontend/src/api/generate.js` ต้องมีรูปเดียวกับสเปกจริงเมื่ออานนท์ส่งมา\n\n### D12 บทบาทและบัญชี (ตกลง 2026-10-27)\n- **ตัดสินใจ**\n  1. **ADMIN** เป็นสิทธิ์ระดับสถาบันติดกับบัญชี (`user.is_admin`) ไม่ใช่สมาชิกแผนก (`MEMBERSHIP` มี `department_id` เป็นส่วนของ PK ใส่ ADMIN ไม่ได้) บัญชีเดียวเป็น ADMIN และ HEAD/TEACHER พร้อมกันได้ ตัวสลับแสดง \"ผู้ดูแลสถาบัน\" แยกจากภาควิชา\n  2. **ชั่วโมงสอนสูงสุดต่อวัน** เป็นหนึ่งค่าต่อคนต่อภาคเรียน (เหมือนเวลาว่าง) เก็บที่ `TEACHER_TERM_SETTING` ไม่ใช่ต่อภาควิชา\n  3. **ชื่อบทบาท** ใช้ `ASSISTANT` ทั้งโค้ดและ API หน้าจอเรียก \"ผู้ช่วย\"\n  4. **รีเซ็ตรหัสผ่าน (0.2)** ผู้ดูแลสถาบันหรือหัวหน้าสร้างลิงก์รีเซ็ตให้คัดลอกส่งเอง (แบบเดียวกับลิงก์เชิญ) และส่งอีเมลด้วยเมื่อมี SMTP\n  5. **แจ้งเตือน (เดิม O2)** ในแอปเสมอ ส่งอีเมลเมื่อมี SMTP **การเชิญ (เดิม O3)** ผู้ช่วยเชิญอาจารย์ได้ ส่วนการเชิญผู้ช่วยยังเฉพาะหัวหน้า\n  6. **wireframe ที่ขาด** (0.2, 1.2, 2.4.1) ร่างใน [wireframes-missing.md](wireframes-missing.md)\n- **ผลต่อโค้ด** ตัวสลับต้องรู้ทั้ง `memberships` และ `is_admin`; `GET /api/me` คืนทั้งสองอย่าง; ตาราง/ฟิลด์ใหม่ที่ต้องให้อานนท์เพิ่ม: `user.is_admin`, `TEACHER_TERM_SETTING`, `PASSWORD_RESET`; ย้าย `max_hours_per_day` ออกจาก `MEMBERSHIP`\n- **ที่ยังเปิด** O1 วิธีล็อกอิน (บัญชีในตัวเป็นข้อเสนอที่ไม่มีใครคัดค้าน แต่ยังไม่ถูกตัดสินเป็นทางการ)\n\n### แผนภาพ: การตัดสินใจกับสิ่งที่ได้รับผลกระทบ\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 868 1544\" width=\"868\" height=\"1544\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"การตัดสินใจ\"><g data-tip=\"D1 Self-hosted + โอเพนซอร์ส&#10;ไปที่:&#10;→ หน้าตั้งค่าครั้งแรก 0.0 หน้าระบบ 3.6 · docker compose&#10;→ ข้อมูลอยู่ในสถาบัน N2 / PDPA\"><rect x=\"20\" y=\"14\" width=\"250\" height=\"56\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"145\" y=\"38\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">D1 Self-hosted<\/text><text x=\"145\" y=\"56\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">+ โอเพนซอร์ส<\/text><\/g><g data-tip=\"หน้าตั้งค่าครั้งแรก 0.0 หน้าระบบ 3.6 · docker compose&#10;มาจาก:&#10;← D1 Self-hosted + xt-anchor=\"middle\" fill=\"#1f2937\">สถานะ = สี + ไอคอน<\/text><\/g><g data-tip=\"D11 Python + FastAPI&#10;ไปที่:&#10;→ OpenAPI เป็นสัญญา CORS/proxy · poll งานนาน&#10;→ O6 data contract Generate&#10;→ O5 เรียกรัน FET จาก Python\"><rect x=\"20\" y=\"1282\" width=\"250\" height=\"40\" rx=\"5\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.5\"/><text x=\"145\" y=\"1307\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">D11 Python + FastAPI<\/text><\/g><g data-tip=\"OpenAPI เป็นสัญญา CORS/proxy · poll งานนาน&#10;มาจาก:&#10;← D11 Python + FastAPI\"><rect x=\"332\" y=\"1274\" width=\"250\" height=\"56\" rx=\"5\" fill=\"#ffffff\" stroke=\"#4b5563\" stroke-width=\"1.5\"/><text x=\"457\" y=\"1298\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">OpenAPI เป็นสัญญา<\/text><text x=\"457\" y=\"1316\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">CORS/proxy · poll งานนาน<\/text><\/g><g data-tip=\"O6 data contract Generate&#10;มาจาก:&#10;← D11 Python + FastAPI&#10;← O5 เรียกรัน FET จาก Python\"><rect x=\"604\" y=\"1390\" width=\"250\" height=\"40\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"729\" y=\"1415\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">O6 data contract Generate<\/text><\/g><g data-tip=\"O5 เรียกรัน FET จาก Python&#10;มาจาก:&#10;← D11 Python + FastAPI&#10;ไปที่:&#10;→ O6 data contract Generate\"><rect x=\"604\" y=\"1490\" width=\"250\" height=\"40\" rx=\"5\" fill=\"#fff4e0\" stroke=\"#f0b45a\" stroke-width=\"1.5\"/><text x=\"729\" y=\"1515\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1f2937\">O5 เรียกรัน FET จาก Python<\/text><\/g><polyline points=\"270,34 301,34 301,42 332,42\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"270,50 296,50 296,158 332,158\" fill=\"none\" stroke=\"#4b5563\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><polyline points=\"270,274 301,274 301,266 332,266\" fill=\"none\" stroke=\"#4b5563\" stroke-w led + ขอ HEAD\"/><polyline points=\"270,846 332,846\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D7 ไม่มีลิงก์สาธารณะ → ไม่มีบทบาทนักศึกษา N3\"/><polyline points=\"270,954 332,954\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D8 direct edit + change request → CHANGE_LOG: agreed_with หลังเผยแพร่ = เวอร์ชันใหม่\"/><polyline points=\"270,1070 332,1070\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D9 pre-check ต้อง acknowledge → GENERATION_RUN อ้าง PRECHECK_REPORT\"/><polyline points=\"270,1186 332,1186\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D10 Design: เครื่องมือแบบ Office → เดสก์ท็อปก่อน สถานะ = สี + ไอคอน\"/><polyline points=\"270,1292 301,1292 301,1302 332,1302\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D11 Python + FastAPI → OpenAPI เป็นสัญญา CORS/proxy · poll งานนาน\"/><polyline points=\"270,1302 296,1302 296,1410 604,1410\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D11 Python + FastAPI → O6 data contract Generate\"/><polyline points=\"270,1312 308,1312 308,1510 604,1510\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"D11 Python + FastAPI → O5 เรียกรัน FET จาก Python\"/><polyline points=\"729,1430 729,1490\" fill=\"none\" stroke=\"transparent\" stroke-width=\"14\" data-tip=\"O5 เรียกรัน FET จาก Python → O6 data contract Generate\"/><\/svg><\/div>\n\nฟ้า = ตัดสินใจแล้ว · ส้ม = ยังเปิด (ขึ้นกับอานนท์)\n\n## ที่ยังเปิดอยู่\n\n| # | เรื่อง | ข้อเสนอในเอกสาร / ทางเลือก | ใครตัดสิน |\n|---|---|---|---|\n| O1 | วิธีล็อกอิน | บัญชีในตัว (ไม่พึ่งบริการภายนอก); SSO สถาบัน = ภายหลัง | ทีม |\n| O4 | **หน้า \"ตรวจทานตารางที่สกัดได้\" (OCR จากรูปตาราง) อยู่ใน MVP ไหม** | design system ใส่ไว้ใน MVP แต่ user-flows ไม่มี flow นี้ (มีแต่ตรวจไฟล์หลักสูตร) ต้องยืนยัน | อานนท์ + เรา |\n| O5 | วิธีเรียกรัน FET จาก Python และเวลาที่ใช้จริง | (ภาษา/framework ตัดสินใจแล้ว ดู D11) | อานนท์ |\n| O6 | data contract ของ Generate (input / output / error) | ให้อานนท์กำหนด Pydantic model แล้วเราอ่านจาก `/openapi.json` (D11) ข้อกำหนดเชิงพฤติกรรมอยู่ใน [requirements §7](requirements.md) | อานนท์ + เรา |\n| O7 | JavaScript หรือ TypeScript | TypeScript ช่วยกำหนด type ของ contract | เรา |\n| O8 | วิธีป้อนข้อมูลใน MVP | ฟอร์ม / อัปโหลด CSV-Excel / ข้อมูลตัวอย่างคงที่ | เรา |\n| O9 | ขอบเขตหลายภาควิชาและห้องร่วมใน MVP | ภาควิชาเดียวก่อน ตามที่เดโมใช้ข้อมูล มจพ. | ทีม |\n| O10 | สีหลัก `#1f5fae` และการเปลี่ยนสี \"ต้องแก้\" จากฟ้าเป็นส้ม | ขอการยืนยัน (ดู design-system §8) | เรา |\n\n## ค้างอยู่ (งานที่ต้องทำ)\n\n| เรื่อง | รายละเอียด |\n|---|---|\n| โครง `frontend/src` | ตอนนี้ย้ายไปอยู่ใต้ `frontend/public/src/` และ `App.jsx` อยู่นอก `src` Vite ไม่ bundle `public/` ต้องย้ายเป็น `frontend/src/` แล้วสร้าง `src/main.jsx` จึงจะ `npm run build` ผ่าน |\n| `eslint.config.js` | ว่างอยู่ ต้องใส่กฎก่อนใช้ `npm run lint` |\n| `tech-stack-list.txt` | สเปกเทคนิคฉบับเต็มที่ต้นฉบับอ้างถึง ไม่อยู่ในชุดนี้ ขอจากอานนท์เพื่อเติมส่วน backend ใน [tech stack](../th/8-tech-stack.md) |\n\n## การเปลี่ยนสเปกที่ sitemap บ่งชี้ (ต้นฉบับยังไม่ได้ปรับ)\n\n- แถบขั้น 9 ขั้น แทน 7 ขั้นใน \"TOP BAR\" ของ `tech-stack-list.txt`: Detect รวมเข้า Setup; Availability, Teacher input, Teacher review เป็นขั้นใหม่\n- อาจารย์และห้องย้ายออกจาก \"สร้างโปรไฟล์\" ไปหน้าภาควิชา (2.3) โปรไฟล์เพียงเลือกจากที่นั่น\n- ADMIN ได้หน้าปฏิทิน (3.4), รูปแบบ (3.5), ระบบ (3.6) และไม่มีผู้ดูแลแพลตฟอร์ม\n"}, {"g": "เทคนิคและออกแบบ", "id": "tech", "t": "Tech Stack", "p": "th/8-tech-stack.md", "md": "# Tech Stack: ระบบตารางเรียน\n\nร่างสำหรับ MVP ฝั่ง Frontend · 2026-10-27\n\n**สถานะของแต่ละรายการ**\n\n| ป้าย | ความหมาย |\n|---|---|\n| ✅ ติดตั้งแล้ว | มีใน `frontend/package.json` |\n| 📄 ตามเอกสาร | ระบุไว้ในเอกสารขั้น 1-7 แต่ยังไม่ได้ทำ |\n| 💡 เสนอ | ข้อเสนอ รอตัดสินใจ |\n| ❓ ว่าง | ยังไม่มีข้อมูล ต้องถามอานนท์ |\n\n> `tech-stack-list.txt` (สเปกเทคนิคฉบับเต็ม) ไม่อยู่ในชุดที่ได้รับ ฝั่ง Backend จึงมีเท่าที่เอกสารกล่าวถึง\n\n---\n\n## 1. ภาพรวม\n\n```\nเบราว์เซอร์ (React)  ──►  project service  ──►  FET solver\n      ▲                        │\n      │                        ▼\n   ส่วนของเรา              PostgreSQL\n                         (ฝั่งอานนท์ / Backend)\n```\n\n- Frontend ไม่คุยกับ solver ตรง ๆ ทุกอย่างผ่าน project service\n- project service เป็นตัวเดียวที่เขียนข้อมูล ทุกการเปลี่ยนแปลงถูกบันทึกและเก็บเวอร์ชัน\n\n---\n\n## 2. Frontend (ส่วนที่เรารับผิดชอบ)\n\n### 2.1 หลัก\n\n| ส่วน | เทคโนโลยี | สถานะ |\n|---|---|---|\n| UI framework | React 19 | ✅ |\n| Build / dev server | Vite 8 + `@vitejs/plugin-react` | ✅ |\n| Lint | ESLint 10 (`eslint.config.js` ยังว่าง) | ✅ |\n| ภาษา | JavaScript (JSX) | ✅ |\n\n### 2.2 ที่เสนอเพิ่ม\n\n| ส่วน | เทคโนโลยี | เหตุผล |\n|---|---|---|\n| Routing | React Router | แยกหน้าตามบทบาทใน sitemap |\n| Server state | TanStack Query | ดึงผลการรันและ polling สถานะโดยไม่ต้องเขียน state เอง |\n| Global state | React Context | พอสำหรับผู้ใช้ ภาควิชา ภาษา ข้าม Redux ใน MVP |\n| i18n | react-i18next | ไทย / อังกฤษ ห้าม hardcode ข้อความ |\n| ทดสอบ | Vitest + Testing Library + axe | ทุก `ui/` ต้องมี test และตรวจ a11y |\n| TypeScript | ยังไม่ตัดสินใจ | ช่วยกำหนด type ของ data contract แต่ต้องเลือกก่อนเขียนโค้ดจริง |\n\n### 2.3 ตามเอกสาร (ยังไม่ติดตั้ง)\n\n| ส่วน | เทคโนโลยี | ใช้เมื่อไร |\n|---|---|---|\n| ลากวางตาราง | dnd-kit | ภายหลัง (MVP แค่เลือกเซลล์ + แผงแก้ + ลากพื้นฐาน) |\n| สไตล์ | CSS Modules + `tokens.css` | ตั้งแต่เริ่ม ใช้ `var(--…)` เท่านั้น ไม่ใช้ UI kit สำเร็จรูป |\n| ฟอนต์ | Sarabun (สำรอง Noto Sans Thai) | ทั้งหน้าเว็บและพิมพ์ A4 |\n\nโครงโฟลเดอร์และกติกา: [design-system.md §7](7-design-system/design-system.md)\nทิศทางการ import ทางเดียว: `features → timetable/shell → ui → styles`\n\n---\n\n## 3. Backend และ Algorithm (ฝั่งอานนท์)\n\n### 3.1 ที่เอกสารระบุ\n\n| ส่วน | เทคโนโลยี | หมายเหตุ |\n|---|---|---|\n| Solver | FET | ผลลัพธ์ < 1 วินาที รองรับ locks (pin) |\n| ตัวตรวจกฎ | core lib ของโครงการ | ใช้ตรวจสดตอนวางคาบ |\n| ตัวกลาง | project service | ผู้เขียนข้อมูลเพียงตัวเดียว |\n| **ภาษา + API framework** | **Python + FastAPI** | อานนท์ใช้สร้าง API และจัดการเอกสาร (นำเข้า/แปลงไฟล์หลักสูตร) ยืนยันแล้ว |\n| API ที่รู้ | `POST /api/check` | ตรวจสดตอนวาง |\n| ฐานข้อมูล | PostgreSQL ใน Docker | โครงสร้างตาม [ER diagram](6-er-diagram/er-diagram.mmd) |\n| นำเข้าหลักสูตร | `pdftotext` + ตัวอ่านรูปแบบ, OCR + glyph tool (ไฟล์สแกน) | ยังไม่ยืนยันว่าอยู่ใน MVP ฝั่ง Frontend |\n\n### 3.2 ที่เอกสารเสนอไว้ ยังไม่ตัดสินใจ\n\n| ส่วน | ข้อเสนอ |\n|---|---|\n| ล็อกอิน | บัญชีในตัว (SSO ของสถาบัน = ภายหลัง) |\n| แจ้งเตือน | ในแอปเสมอ + อีเมลเมื่อตั้ง SMTP |\n\n### 3.3 FastAPI: ผลต่อฝั่ง Frontend\n\n- FastAPI สร้างสเปก **OpenAPI** ให้อัตโนมัติที่ `/openapi.json` (และหน้าลองเรียกที่ `/docs`) ใช้เป็น data contract ได้เลย ไม่ต้องเขียนเอกสารแยก\n- Frontend สร้าง type หรือ client จากสเปกนี้ได้ (เช่น `openapi-typescript`) ดังนั้น **ควรขอให้อานนท์กำหนด Pydantic model ของ request / response ของ Generate และ `/api/check` ก่อน** แล้วเราอ่านสเปกจากนั้น\n- ถ้า Frontend (Vite, พอร์ต 5173) เรียก API คนละพอร์ต ต้องตั้ง CORS ที่ FastAPI หรือใช้ proxy ใน `vite.config.js`\n- การอัปโหลดไฟล์หลักสูตรใช้ `multipart/form-data` (FastAPI รับด้วย `UploadFile`)\n- งานนาน (OCR, solver) ควรเป็น background task + ให้ Frontend poll สถานะ\n\n### 3.4 ยังว่าง (ต้องถามอานนท์)\n\n- วิธีเรียกรัน FET จาก Python (subprocess หรือไลบรารี) และเวลาที่ใช้จริง\n- รายการ endpoint และรูปแบบ input / output / error ของ Generate\n- วิธียืนยันตัวตน (ดู 3.2)\n\n---\n\n## 4. การติดตั้งและใช้งาน\n\n- Self-hosted + โอเพนซอร์ส: แต่ละสถาบันติดตั้งเองด้วย `docker compose up` แล้วเข้าหน้าตั้งค่าครั้งแรก\n- ข้อมูลไม่ออกจากเซิร์ฟเวอร์ของสถาบัน (PDPA)\n- ไม่มีบทบาทนักศึกษา ไม่มีลิงก์สาธารณะ\n\n**คำสั่งฝั่ง Frontend**\n\n```\ncd frontend\nnpm install\nnpm run dev      # เปิด dev server\nnpm run build    # build production\nnpm run lint\n```\n\n> ⚠ ตอนนี้โครง `src` อยู่ใต้ `frontend/public/` ซึ่ง Vite ไม่ bundle ต้องย้ายออกมาเป็น `frontend/src/` ก่อนจึงจะ build ผ่าน\n\n---\n\n## 5. ที่ยังต้องตัดสินใจ\n\n| # | เรื่อง | ถามใคร |\n|---|---|---|\n| 1 | JavaScript หรือ TypeScript | เรา |\n| 2 | ~~ภาษา / framework ของ backend~~ **ตัดสินใจแล้ว: Python + FastAPI**; ยังค้างวิธีเรียกรัน FET จาก Python | อานนท์ |\n| 3 | data contract ของ Generate | อานนท์ + เรา |\n| 4 | วิธีล็อกอิน | ทีม |\n| 5 | ยืนยันไลบรารี routing และ i18n | เรา |\n"}, {"g": "เทคนิคและออกแบบ", "id": "design", "t": "Design System", "p": "th/7-design-system/design-system.md", "md": "# Design System: ระบบตารางเรียน (ขั้นตอนที่ 7)\n\nแนวทาง: เครื่องมือทำงานแบบ Office (Word/Excel) ไม่ใช่ Dashboard. ตารางเป็นพระเอก, UI ที่เหลือเป็นแถบเครื่องมือรอบตาราง.\nอ้างอิง: sitemap (3), flows (4), wireframe (5), ER (6) และภาพ \"ตรวจทานตารางที่สกัดได้\" (split view + แผงแก้ช่อง).\nค่าจริงทั้งหมดอยู่ใน [tokens.css](tokens.css) ไฟล์นี้อธิบายเหตุผลและกติกา.\n\n---\n\n## 1. หลักการ + ทิศทางภาพ\n\n| หลักการ | แปลงเป็นกติกา | เหตุผล |\n|---|---|---|\n| Familiarity | โครง 5 ส่วน (Top bar / Nav / Toolbar / Workspace / Status bar), ปุ่ม Save/Undo/Export ตำแหน่งเดิมทุกหน้า | หัวหน้าภาคใช้ Word/Excel ทุกวัน ไม่ต้องเรียนรู้ใหม่ |\n| Simplicity | ไม่มีเงาหนัก ไม่ซ้อนการ์ด ไม่ใช้ gradient; แยกพื้นที่ด้วยเส้น 1px | ลดสิ่งรบกวน ให้สายตาอยู่ที่ตาราง |\n| Information density | แถวตาราง 32px (compact 28px), ฟอนต์ตาราง 13px | ตาราง 5 วัน × 10 คาบ × หลายกลุ่ม ต้องเห็นพร้อมกัน |\n| Consistency | งานแบบเดียวกัน (ตรวจข้อมูล, รอบเวลาว่าง, รายการปัญหา) ใช้ DataTable + Toolbar ชุดเดียว | ลดโค้ดและลดความสับสนข้ามบทบาท |\n| Function first | ทุกองค์ประกอบต้องตอบได้ว่า \"ผู้ใช้ทำงานอะไรด้วยสิ่งนี้\" ไม่ตอบได้ = ตัดทิ้ง | ตามข้อกำหนดโครงการ |\n| Accessibility | สถานะ = สี + ไอคอน/ข้อความเสมอ; คีย์บอร์ดครบ; คอนทราสต์ ≥ 4.5:1 | ภาพต้นแบบใช้ \"สี\" อย่างเดียวบอกความมั่นใจ OCR (ดู §5) |\n\nไม่ทำ: เลียนแบบ Ribbon ของ Office เต็มรูป, กราฟตกแต่ง, การ์ดสถิติ, animation ยาว.\n\n---\n\n## 2. Tokens\n\nไฟล์: [tokens.css](tokens.css) (ธีมสว่างเป็นค่าเริ่มต้น + ธีมมืดตาม `prefers-color-scheme` และ `data-theme`, ตามรูปแบบเดียวกับ prototype.html).\n\n### 2.1 สี\n\n| Token | สว่าง | ใช้กับ |\n|---|---|---|\n| `--bg` | #f3f4f6 | พื้นพื้นที่ทำงาน |\n| `--surface` / `--surface-2` | #fff / #f9fafb | แผง ตาราง เมนู / หัวตาราง แถบเครื่องมือ |\n| `--border` / `--border-strong` | #d1d5db / #9ca3af | เส้นแบ่ง / ขอบช่องกรอก |\n| `--text` / `--text-2` | #1f2937 / #4b5563 | ข้อความหลัก / รอง |\n| `--primary` (+hover/active/bg) | #1f5fae | ปุ่มหลัก ลิงก์ รายการที่เลือก |\n| `--success/warning/error/info` (+bg/bd) | เขียว/ส้ม/แดง/ฟ้า | **เฉพาะสถานะ** ห้ามใช้ตกแต่ง |\n\nกฎ: ใช้ `var(--…)` เท่านั้น. ใน 1 หน้าจอ สีสถานะต้องมีความหมายตรงตาม §2.5 เท่านั้น.\nคู่สี fg บน bg ของสถานะผ่าน 4.5:1 ทั้งธีมสว่างและมืด (ตรวจเมื่อเปลี่ยนค่า).\n\n### 2.2 ตัวอักษร (Sarabun, สำรอง Noto Sans Thai)\n\n| บทบาท | ขนาด | น้ำหนัก |\n|---|---|---|\n| Page title | 26px | 600 |\n| Section title | 18px | 600 |\n| Body / Button / Input | 14px | 400 / 600 (ปุ่ม) |\n| Table | 13px | 400 (หัวคอลัมน์ 600) |\n| Secondary / Caption | 12px | 400 |\n\nline-height 1.5 เสมอ (สระบน-วรรณยุกต์ไทยไม่ถูกตัด). ตัวหนาเฉพาะ: หัวข้อ, หัวตาราง, รหัสวิชาในเซลล์, ข้อความ error. ตัวเลข/รหัสวิชา/เวลาใช้ `font-variant-numeric: tabular-nums`.\n\n### 2.3 ระยะ\n4 · 8 · 12 · 16 · 24 · 32 (`--s1…--s8`). ใน Toolbar/ตาราง ใช้ 4–8; ระหว่างส่วนของหน้า 16–24; ขอบ Workspace 16.\n\n### 2.4 ขอบ มุม เงา\nเส้น 1px; มุม 4px (ควบคุม/เซลล์), 6px (dialog/เมนู). เงาใช้เฉพาะของที่ลอย (dialog, dropdown, toast, tooltip). แผง/ตารางไม่มีเงา.\n\n### 2.5 ความหมายของสีสถานะ (ตายตัว)\n\n| สถานะ | สี | ไอคอน/ข้อความ | ใช้ที่ |\n|---|---|---|---|\n| สำเร็จ / เผยแพร่แล้ว / ยืนยันแล้ว | success | ✓ | Badge, Toast, ขั้นเสร็จ |\n| ต้องระวัง / WARNING / ล้าสมัย | warning | ⚠ | รายการปัญหา, ขั้นล้าสมัย |\n| ผิดพลาด / BLOCKER / ชน / แถวแดง | error | ✕ หรือ ⛔ | ตรวจข้อมูล, ชนห้อง/อาจารย์ |\n| ข้อมูล / ร่าง / กำลังตรวจทาน | info | ⓘ | Badge ร่าง/ตรวจทาน, คำแนะนำ |\n| ปัจจุบัน / เลือกอยู่ | primary | เส้นใต้/แถบซ้าย | ขั้นปัจจุบัน, แท็บ, แถวที่เลือก |\n\n---\n\n## 3. Layout\n\n```\n┌ Top bar 44px: ชื่อระบบ | ตัวสลับภาควิชา | ค้นหา | 🔔 | บัญชี ─────────────┐\n├ Nav 220px ┬ Command toolbar 40px (คำสั่งของหน้านี้) ──────────────────────┤\n│ (พับได้)  │ Stepper (เฉพาะพื้นที่ทำงานโปรไฟล์) + แท็บชั้นปี               │\n│           │ Workspace (ตาราง/ฟอร์ม; เลื่อนในตัวเอง)                       │\n├───────────┴ Status bar 24px: จำนวนรายการ · ผลประมวลผล · \"บันทึกแล้ว 14:02\"┤\n```\n\n- Top bar, Toolbar, Status bar ตรึงตำแหน่ง; Workspace เป็นที่เดียวที่เลื่อน (ไม่ให้ทั้งหน้าเลื่อนซ้อน).\n- Nav ตามบทบาท (หัวหน้า / อาจารย์ / ผู้ดูแล) ตาม sitemap §2–4. กลุ่มไม่เกิน 7 รายการ.\n- Stepper 9 ขั้น (sitemap 2.4) อยู่ใต้ Toolbar: สถานะ เสร็จ ✓ / ปัจจุบัน / ล้าสมัย ⚠ / ล็อก 🔒; ขั้นล็อกกดไม่ได้และมี Tooltip บอกว่าติดอะไร.\n- แผงแบ่งแนวนอน (เช่น PDF | ตาราง ในหน้าตรวจข้อมูล) ลากปรับขนาดได้, ค่าเริ่มต้น 40/60, ต่ำสุด 280px.\n- Breakpoint: ≥1280 เต็ม; 1024–1279 พับ Nav เป็นไอคอน; <1024 ไม่รองรับการแก้ตาราง (อ่าน/ดูตารางของฉัน/ตอบรอบเวลาว่างได้บนมือถือ). ระบบนี้ออกแบบเดสก์ท็อปก่อน.\n- เนื้อหาฟอร์มกว้างสุด 640px (ยกเว้นตาราง).\n\n---\n\n## 4. Component inventory\n\nสถานะที่ทุกคอมโพเนนต์ต้องมีเมื่อเกี่ยวข้อง: Default · Hover · Focus (outline 2px `--focus`) · Active · Disabled · Error. Disabled ต้องมีเหตุผลใน Tooltip ถ้าเกิดจากเงื่อนไขของระบบ (เช่น \"ยังมีแถวแดง 3 แถว\").\n\n| Component | Variants | หมายเหตุ |\n|---|---|---|\n| Button | primary · secondary · tertiary(ข้อความ) · destructive · icon | สูง 32px. **1 หน้า/1 Toolbar มี primary ได้ 1 ปุ่ม**. destructive ต้องผ่าน ConfirmDialog |\n| Input | text · search · select · number · date · time | label อยู่บนช่อง, helper 12px ใต้ช่อง, error = ขอบ error + ข้อความ + ไอคอน (ไม่ใช้สีอย่างเดียว). ใช้ `<input type=date/time>` ของเบราว์เซอร์ก่อน |\n| DataTable | sort · filter · select · inline-edit · sticky header/col · row status | ดู §5. แถวสูง 32/28px |\n| Tabs | หลักสูตร×ชั้นปี · ตาราง/ผังกระบวนวิชา | เส้นใต้ primary หนา 2px; ใช้ลูกศรซ้าย/ขวาเลื่อนแท็บ |\n| Stepper | 9 ขั้น + 4 สถานะ | เฉพาะพื้นที่ทำงานโปรไฟล์ |\n| Dialog | form · confirm | โฟกัสติดใน dialog, Esc ปิด, โฟกัสกลับปุ่มที่เปิด |\n| ConfirmDialog | ปกติ · destructive | บอกผลกระทบเป็นข้อความ (\"จะทำให้ขั้น 5–9 ของชั้นปี 2 ล้าสมัย\") ปุ่มยืนยันใช้คำกริยาเฉพาะ ไม่ใช่ \"ตกลง\" |\n| DropdownMenu | คำสั่งเพิ่มเติม · เมนูคลิกขวา | คีย์บอร์ด ↑↓ Enter Esc; ตัวคั่นกลุ่ม |\n| Tooltip | ไอคอน/ปุ่ม disabled | หน่วง 400ms; ไม่ใส่ข้อมูลที่จำเป็นต่อการตัดสินใจ |\n| Badge | success · warning · error · info · neutral | ไอคอน+ข้อความสั้น เช่น \"✓ เผยแพร่แล้ว\" \"⚠ ล้าสมัย\" \"ร่าง\" |\n| Toast | success · info · error | มุมล่างขวา 4 วิ, error ค้างจนปิด; มี Undo เมื่อย้อนได้; `role=status` (error = `alert`) |\n| EmptyState | — | 1 ประโยคอธิบายเหตุ + 1 ปุ่มคำสั่งถัดไป (\"ยังไม่มีโปรไฟล์ — คัดลอกจากภาคก่อน\") |\n| LoadingState | skeleton แถวตาราง · progress บาร์ (ระบุ %/ขั้น) · spinner ในปุ่ม | งาน solver/OCR นาน: แสดงขั้นปัจจุบัน + ปุ่มยกเลิก |\n| InlineAlert | info · warning · error | แถบในหน้า (ไม่ใช่ Toast) สำหรับ blocker ที่ต้องแก้ เช่น \"ยังมีแถวแดง\" |\n| CommandToolbar | กลุ่มคำสั่ง + ตัวคั่น | ซ้าย: สร้าง/นำเข้า/ส่งออก; ขวา: primary ของหน้า |\n| StatusBar | ข้อความ + ตัวนับ | `aria-live=polite` |\n| SplitPane | แนวนอน | ลากด้วยเมาส์ + ปุ่มลูกศร |\n| PageHeader | title + breadcrumb | ไม่ซ้ำกับ Toolbar |\n\nทำภายหลัง: DatePicker แบบปฏิทินเต็ม, Command palette, Ribbon, ตั้งค่าธีมสีเอง, ย้ายแถวด้วยลากในทุกตาราง.\n\n---\n\n## 5. ตารางสอน + ข้อมูลเชิงโครงสร้าง\n\n### 5.1 TimetableGrid (หัวใจของระบบ)\n- แถว = วัน (จันทร์–ศุกร์/เสาร์), คอลัมน์ = คาบ; หัวคอลัมน์แสดง **เลขคาบ + เวลา** (เช่น \"7 · 14:00\"). ตรึงหัวแถว (วัน) และหัวคอลัมน์ขณะเลื่อน.\n- เส้นตารางบาง 1px `--border` ทุกเซลล์; ความกว้างคาบเท่ากัน; คาบต่อเนื่อง (2 คาบ) = เซลล์รวมกว้างเท่า 2 คาบ.\n- เนื้อหาเซลล์ เรียงตามลำดับสแกน (บรรทัดเดียวต่อรายการ, ตัดด้วย `…` + Tooltip/แผงรายละเอียดเมื่อเลือก):\n  1. **รหัสวิชา** (ตัวหนา)  2. ชื่อวิชา  3. ห้อง · ท-ป-น  4. ครู\n- ความสูงเซลล์คงที่ ≥ 56px; ข้อความเกินตัดไม่ขึ้นบรรทัดใหม่เกิน 2 บรรทัด.\n\n### 5.2 สถานะเซลล์ (สี + สัญลักษณ์ + ข้อความ)\n\n| สถานะ | พื้นหลัง | ขอบ | สัญลักษณ์ที่มุมเซลล์ |\n|---|---|---|---|\n| ปกติ | `--surface` | solid | — |\n| ว่าง | ลายเส้นทแยงจาง / พื้น `--surface-2` | solid | — |\n| ยังไม่ได้จัด (อยู่ในถาด) | `--surface` | dashed | \"ยังไม่ลง\" |\n| มีปัญหา: WARNING | `--warning-bg` | `--warning-bd` | ⚠ |\n| ชน / BLOCKER | `--error-bg` | `--error-bd` 2px | ✕ + เซลล์คู่ชนไฮไลต์ |\n| ปักหมุด | ปกติ | ปกติ | 📌 |\n| เลือกอยู่ | `--primary-bg` | `--primary` 2px | — |\n\nชนต้องมีข้อความอธิบายใน Tooltip/แผงข้าง (\"ชนกับ ป.31901-2001 · อ.ปฐพนพัทธ์ · จันทร์ คาบ 7\").\n\n### 5.3 หน้า \"ตรวจทานตารางที่สกัดได้\" (จากภาพต้นแบบ)\nภาพต้นแบบใช้ระดับความมั่นใจ OCR เป็น 4 สีฟ้า/ขาว + เส้นประ. ปรับดังนี้ เพื่อไม่พึ่งสีอย่างเดียวและไม่ใช้ฟ้าซ้ำกับสี \"เลือก/ปัจจุบัน\":\n\n| ภาพต้นแบบ | ปรับเป็น |\n|---|---|\n| < 70% ต้องแก้ (ฟ้า) | `--warning-bg` + ⚠ + \"58%\" ในเซลล์ → นับใน \"ต้องตรวจ\" |\n| 70–85% ควรดู (ขาวขอบเทา) | `--surface` + \"ควรดู\" ตัวเล็ก |\n| > 85% ผ่าน | `--surface` ไม่มีเครื่องหมาย |\n| ยืนยันแล้ว (น้ำเงินเข้ม) | `--success-bg` + ✓ |\n| ถูกย้าย/ปรับด้วยมือ (เส้นประ) | เส้นประ + ไอคอน ✎ |\n| เลือกอยู่ | `--primary-bg` + ขอบ primary 2px (เช่นเดิม) |\n\n- คำอธิบายสี (legend) ต้องแสดงสัญลักษณ์เดียวกับในเซลล์ และเป็น Filter ได้ (กดเพื่อโชว์เฉพาะสถานะนั้น).\n- ตัวนับ \"ต้องตรวจ 17/17 ช่อง\" อยู่ใน Toolbar; ปุ่ม \"ช่องถัดไปที่ต้องตรวจ\" = secondary, \"ยืนยันและบันทึกเข้าฐานข้อมูล\" = primary และ disabled (พร้อมเหตุผล) จนกว่าช่องที่ต้องตรวจจะเหลือ 0.\n- แผงซ้าย (ภาพต้นฉบับ) ไฮไลต์กรอบตรงกับเซลล์ที่เลือกในตารางขวา และเลื่อน/ซูมตามอัตโนมัติ; ต้นฉบับไม่ถูกแก้ (ตาม ER: `og_file`).\n- แผง \"แก้ช่อง\" (ภาพที่ 2): ฟอร์มใต้ตาราง/ลอยข้าง, ปุ่มเรียง **ยืนยันช่องนี้** (primary) · ข้ามไปช่องถัดไป (secondary) · คืนค่าเดิมจาก OCR (tertiary). ป้าย \"· 96%\" ข้าง label ให้คงไว้ทุกช่องที่มาจาก OCR; ช่องที่ความมั่นใจต่ำมีขอบ warning + ⚠. คีย์ลัด: Enter = ยืนยัน, Alt+→ = ถัดไป.\n- ช่องตัวเลข ท/ป/น/ช: label ตัวย่อต้องมี Tooltip (เดิมมีบรรทัดอธิบายอยู่ ให้คงไว้).\n\n### 5.4 DataTable ทั่วไป (ตรวจข้อมูลหลักสูตร, บุคลากร, รอบเวลาว่าง, รายการปัญหา, คำขอเปลี่ยน)\n- หัวตรึง, คอลัมน์แรกตรึงเมื่อกว้างเกินจอ; เรียงด้วยคลิกหัวคอลัมน์ (ลูกศร ▲▼ + `aria-sort`).\n- คอลัมน์สถานะอยู่ซ้ายสุดหรือขวาสุดเสมอ ใช้ Badge. ตัวเลขชิดขวา ข้อความชิดซ้าย.\n- แถวแดง (ตรวจข้อมูล): ขอบซ้าย error 3px + ไอคอน ✕ + คำอธิบายในคอลัมน์ \"ปัญหา\"; ปุ่ม \"แถวแดงถัดไป\".\n- inline edit: เฉพาะ ค่าที่ไม่กระทบแถวอื่นและย้อนกลับได้ (ชื่อ จำนวนที่นั่ง หมายเหตุ). ค่าที่กระทบกฎ/ตาราง (วิชา ครู คาบ) → เปิดแผงแก้ไข/Dialog.\n- การเลือกหลายแถว: checkbox ซ้ายสุด + Shift-click ช่วง.\n\n### 5.5 ตารางความพร้อมของอาจารย์ (เวลาว่างของฉัน)\nกริด วัน×คาบ แบบเดียวกับ 5.1; เซลล์ \"ไม่ว่าง\" = `--error-bg` + ✕ (ไม่ใช่สีเดียว); ลากเลือกช่วงได้, คีย์บอร์ด Space สลับ. ไม่ว่างในภาควิชาอื่น = เส้นทแยง + ป้าย \"ภาควิชาอื่น\" (หัวหน้าเห็น, ตาม sitemap 3).\n\n---\n\n## 6. Interaction + Accessibility\n\n### 6.1 Interaction\n- คำสั่งอยู่ใกล้ข้อมูล: คำสั่งทั้งตาราง → Toolbar; คำสั่งของแถว/เซลล์ → คลิกขวาหรือปุ่ม ⋯ (เมนูเดียวกัน).\n- ย้อนกลับได้ (เปลี่ยนสถานะ, ย้ายคาบ, ลบแถว) → ทำทันที + Toast \"ย้อนกลับ\" 8 วิ; Ctrl+Z ใช้ได้ในพื้นที่ทำงานตาราง.\n- ย้อนกลับยาก (เผยแพร่, ลบภาควิชา, รัน Generate ทับผลเดิม, Direct edit หลังส่งตรวจทาน) → ConfirmDialog ที่บอกผลกระทบ. เผยแพร่: เฉพาะหัวหน้า; ผู้ช่วยเห็นปุ่ม disabled + เหตุผล.\n- ลากย้ายคาบ: แสดงเซลล์ปลายทางที่วางได้/ชน ทันทีขณะลาก (✓/✕ + ข้อความ); วางที่ชน → ไม่ทำ + Toast อธิบาย. ต้องมีทางเลือกที่ไม่ใช้ลาก (แผงแก้ช่อง: เลือกวัน/คาบจาก select).\n- Feedback เสมอหลัง บันทึก/นำเข้า/ส่งออก/ประมวลผล: StatusBar (ถาวร) + Toast (ชั่วคราว). การบันทึกอัตโนมัติแสดง \"บันทึกแล้ว HH:mm\".\n- เคารพ \"ขั้นล็อก/ล้าสมัย\": แสดงเหตุผลและทางไปแก้ ไม่ซ่อนปุ่ม.\n- Animation ≤ 100ms เฉพาะ hover/focus; ปิดทั้งหมดเมื่อ `prefers-reduced-motion`.\n- ข้อความ UI: กริยานำ ภาษาไทยสั้น, ภาษาอังกฤษสลับได้ตามบัญชี (`user.language`); ห้าม hardcode ข้อความในคอมโพเนนต์ ใช้คีย์ i18n.\n\n### 6.2 คีย์ลัดขั้นต่ำ\nCtrl+S บันทึก · Ctrl+Z/Y ย้อน/ทำซ้ำ · Ctrl+F ค้นหาในตาราง · ลูกศร เคลื่อนที่ในกริด · Enter แก้/ยืนยัน · Esc ยกเลิก/ปิด · F6 สลับพื้นที่ (Nav → Toolbar → Workspace → Status).\n\n### 6.3 Accessibility (ตรวจก่อนปิดงานทุกหน้า)\n- คอนทราสต์: ข้อความ ≥ 4.5:1, ขอบควบคุม/ไอคอน ≥ 3:1 (ทั้งสองธีม).\n- ไม่พึ่งสี: ทุกสถานะมีไอคอนหรือข้อความ (ตาราง §2.5, §5.2).\n- คีย์บอร์ด: Tab ครบทุกคำสั่ง, ลำดับ Tab = ลำดับสายตา, focus เห็นชัด, ไม่มี keyboard trap นอก dialog.\n- ตาราง/กริด: `role=grid` สำหรับตารางที่แก้ไขได้, `role=table` สำหรับอ่านอย่างเดียว; หัวแถว/คอลัมน์ใช้ `scope`; เซลล์รวมคาบใช้ `colspan` + `aria-label` (\"จันทร์ คาบ 7–8 …\").\n- ฟอร์ม: `label` ผูกทุกช่อง; error ผูกด้วย `aria-describedby`; สรุป error บนสุดเมื่อ submit ไม่ผ่าน.\n- ขนาดเป้าหมายคลิก ≥ 24×24px (WCAG 2.2), ปุ่มหลัก 32px.\n- ประกาศเปลี่ยนแปลง: Toast/StatusBar ใช้ live region.\n- พิมพ์: หน้าตารางที่พิมพ์ (A4) ใช้ธีมสว่างขาวดำ; สถานะต้องอ่านได้เมื่อพิมพ์ขาวดำ (ใช้ไอคอน/เส้นประ).\n\n---\n\n## 7. โครงสร้างโค้ด Frontend\n\nกติกา: **ข้อมูลแยกจากการแสดงผล** — คอมโพเนนต์ UI รับ props, ไม่เรียก API เอง; หน้า (feature) เป็นผู้ดึงข้อมูล.\n\n```\nsrc/\n  styles/\n    tokens.css            # ← th/7-design-system/tokens.css\n    base.css              # reset + typography + print\n  ui/                     # คอมโพเนนต์กลาง ไม่รู้จักโดเมน (Button, Input, DataTable, Tabs, Dialog, Menu, Tooltip, Badge, Toast, EmptyState, Loading, Alert)\n    Button/ Button.tsx Button.module.css Button.test.tsx\n  shell/                  # AppShell, TopBar, Nav, CommandToolbar, StatusBar, SplitPane, Stepper\n  timetable/              # โดเมนตาราง: TimetableGrid, TimetableCell, CellStatus, ConflictTooltip, UnplacedTray\n  features/               # หนึ่งโฟลเดอร์ต่อหน้า/ขั้นใน sitemap\n    review-extract/       # หน้า split view + แผงแก้ช่อง\n    availability/ issues/ rules/ generate/ publish/ ...\n  api/                    # client + types (ตาม ER) แยกจาก UI\n  i18n/ th.json en.json\n```\n\n- ไม่มี `ui/` → `features/` ย้อนกลับ (ทิศเดียว: features → timetable/shell → ui → styles).\n- ชื่อสถานะโดเมน (`BLOCKER`, `WARNING`, `draft|review|published`, `not_started|done|out_of_date`) เป็น enum กลาง ตรงกับ ER; ตาราง map enum → Badge/CellStatus อยู่จุดเดียว ไม่กระจายตามหน้า.\n- คอมโพเนนต์ใหม่เข้า `ui/` เมื่อใช้ ≥ 2 ที่ (rule of three ผ่อนเป็นสอง เพราะมีหลายบทบาทใช้หน้าซ้ำ).\n- ทดสอบ: ทุก `ui/` มี test สถานะหลัก + ตรวจ a11y อัตโนมัติ (axe); `TimetableGrid` มี test สถานะเซลล์ทั้ง 7.\n\n---\n\n## 8. MVP vs. ภายหลัง\n\n### MVP (ทำก่อน เรียงลำดับ)\n1. `tokens.css` + base (ธีมสว่าง, ธีมมืดมีแล้วเพราะเป็นแค่ค่าตัวแปร)\n2. AppShell: TopBar, Nav, CommandToolbar, StatusBar, Stepper\n3. Button, Input(text/select/number/date/time), Badge, Tooltip, Toast, Dialog + ConfirmDialog, InlineAlert, EmptyState, LoadingState\n4. DataTable (sort, เลือก, sticky header, สถานะแถว, inline edit แบบจำกัด) + Tabs\n5. TimetableGrid (อ่าน + เลือกเซลล์ + 7 สถานะ + ตรึงหัว) + แผงแก้ช่อง\n6. หน้าตรวจทานที่สกัดได้ (SplitPane + legend filter + ปุ่มช่องถัดไป)\n7. Accessibility ผ่านรายการ §6.3 + i18n th/en + print A4 ของตาราง\n\n### ภายหลัง\n- ลากวางเต็มรูปแบบในตารางสอน (MVP: เลือกเซลล์ + แผงแก้ + ลากย้ายคาบแบบพื้นฐาน)\n- DatePicker ปฏิทิน, Command palette, คีย์ลัดปรับแต่งได้\n- Tabular density toggle (32/28px) ให้ผู้ใช้เลือก (MVP: ตายตัวต่อหน้า)\n- ธีมสีสถาบัน / โลโก้ในตั้งค่า\n- มุมมองมือถือสำหรับการแก้ตาราง\n- Storybook / เอกสารคอมโพเนนต์แบบโต้ตอบ (MVP: ไฟล์นี้ + test)\n- Realtime presence/ตัวชี้ผู้แก้พร้อมกัน\n\n### ตัดสินใจที่ต้องการจากคุณ\n- ยืนยันสีหลัก (#1f5fae น้ำเงิน) — เปลี่ยนที่ `--primary` จุดเดียว.\n- ภาพต้นแบบใช้ฟ้าเป็นสี \"ต้องแก้\" (ความมั่นใจต่ำ) — ผมเปลี่ยนเป็นส้ม warning เพราะฟ้า = \"เลือก/ปัจจุบัน\" (§5.3). ถ้าต้องการคงสีเดิม บอกได้.\n"}, {"g": "เทคนิคและออกแบบ", "id": "er", "t": "ER Diagram", "p": "th/6-er-diagram/er-diagram.mmd", "md": "# ER Diagram\n\nแยกเป็น **5 แผนภาพตามกลุ่ม** เพื่อให้อ่านง่าย (เอนทิตีที่ซ้ำคือจุดเชื่อมระหว่างกลุ่ม) ภาพรวมทุกเอนทิตีในภาพเดียวอ่านไม่ได้ (เส้นพันกัน) จึงไม่แสดง (ดูโค้ดเต็มที่ `er-diagram.mmd`) **เอาเมาส์ชี้** ที่การ์ด ฟิลด์ หรือเส้น เพื่อดูข้อมูลเต็ม ใช้ปุ่ม **+ / −** หรือ **Ctrl + ลูกกลิ้งเมาส์** เพื่อซูม และลากเพื่อเลื่อน\n\n**สัญลักษณ์ปลายเส้น:** ขีดคู่ = หนึ่งเดียว · วงกลม+ขีด = ศูนย์หรือหนึ่ง · ตีนกา+ขีด = หนึ่งหรือหลาย · ตีนกา+วงกลม = ศูนย์หรือหลาย\n\n## สถาบันและผู้ใช้\n\n<div class=\"er-svg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1232 655\" width=\"1232\" height=\"655\" font-family=\"Sarabun,'Noto Sans Thai',sans-serif\" role=\"img\" aria-label=\"สถาบันและผู้ใช้\"><g data-tip=\"USER&#10;6 ฟิลด์&#10;ความสัมพันธ์:&#10;• MEMBERSHIP — สังกัด (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• AVAILABILITY_SLOT — ไม่ว่าง (ครั้งเดียวต่อคนต่อภาค) (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• TEACHER_TERM_SETTING — ชั่วโมงสอนสูงสุด (ครั้งเดียวต่อคนต่อภาค) (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• PASSWORD_RESET — ลิงก์รีเซ็ตรหัสผ่าน (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• ROUND_RESPONSE — ส่งโดย (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• SUBJECT_PREFERENCE — จัดอันดับวิชา (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• COMMENT — เขียน (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• DECISION — ตัดสินโดย (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• PRECHECK_REPORT — รับทราบโดย (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• SCHEDULED_CLASS — สอนโดย (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• CHANGE_REQUEST — ยื่นโดยอาจารย์ (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• CHANGE_LOG — ทำโดย (หัวหน้า/ผู้ช่วย) (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)&#10;• NOTIFICATION — ได้รับแจ้ง (ฝั่งนี้ หนึ่งเดียว : ฝั่งนั้น 0 หรือหลาย)\"><rect x=\"14\" y=\"22\" width=\"268\" height=\"162\" rx=\"4\" fill=\"#fff\" stroke=\"#1f5fae\" stroke-width=\"1.4\"/><rect x=\"14\" y=\"22\" width=\"268\" height=\"28\" rx=\"4\" fill=\"#e8f0fb\" stroke=\"#1f5fae\" stroke-width=\"1.4\"/><text x=\"24\" y=\"41\" font-size=\"13.5\" font-weight=\"700\" fill=\"#1f2937\">USER<\/text><g data-tip=\"id&#10;ชนิด: uuid&#10;คีย์: PK\"><rect x=\"14\" y=\"50\" width=\"268\" height=\"21\" fill=\"transparent\"/><rect x=\"20\" y=\"54\" width=\"20\" height=\"14\" rx=\"3\" fill=\"#fef3c7\"/><text x=\"30.0\" y=\"64.5\" font-size=\"9.5\" font-weight=\"70
