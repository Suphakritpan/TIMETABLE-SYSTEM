          primaryColor: '#e8f0fb', primaryBorderColor: '#1f5fae', lineColor: '#4b5563', primaryTextColor: '#1f2937' },
        flowchart: { useMaxWidth: false, htmlLabels: true },
        er: { useMaxWidth: false, entityPadding: 10, minEntityWidth: 90, diagramPadding: 8 },
        nodeSpacing: 30, rankSpacing: 30, // ลดระยะห่างระหว่างกล่อง
        state: { useMaxWidth: false },
      });
      res(mermaid);
    };
    s.onerror = () => rej(new Error('โหลด mermaid ไม่สำเร็จ'));
    document.head.appendChild(s);
  });
  return mermaidP;
}

const cur = () => (location.hash.replace(/^#/, '').split('~')[0] || 'dev-readme');
const mark = () => document.querySelectorAll('#toc a').forEach(a => a.toggleAttribute('aria-current', a.dataset.id === cur()));

function buildToc(filter) {
  const f = (filter || '').toLowerCase();
  let g = '', h = '';
  PAGES.forEach(p => {
    if (f && !(p.t + p.md).toLowerCase().includes(f)) return;
    if (p.g !== g) { g = p.g; h += `<h2>${g}</h2>`; }
    h += `<a href="#${p.id}" data-id="${p.id}">${p.t}</a>`;
  });
  const toc = document.getElementById('toc');
  toc.innerHTML = h || '<p style="padding:8px">ไม่พบ</p>';
  toc.removeAttribute('aria-busy'); toc.removeAttribute('role');
  mark();
}

// ตารางเลื่อนแนวนอนได้บนจอแคบ
const wrapTables = out => out.querySelectorAll('table').forEach(t => {
  const d = document.createElement('div'); d.className = 'tbl'; t.replaceWith(d); d.appendChild(t);
});

function outline(out, id) {
  const hs = [...out.querySelectorAll('h2,h3')];
  hs.forEach((h, i) => { h.id = `${id}~${i}`; });
  document.getElementById('outline').innerHTML = hs.length > 2
    ? '<b>ในหน้านี้</b>' + hs.map(h => `<a class="${h.tagName === 'H3' ? 'l3' : ''}" href="#${h.id}">${h.textContent}</a>`).join('')
    : '';
}

// ไดอะแกรม: ขนาดจริง + ปุ่มซูม + ลากเลื่อน
function enhance(div) {
  const svg = div.querySelector('svg'); if (!svg) return;
  const vb = svg.viewBox.baseVal;
  const W = vb.width || svg.getBoundingClientRect().width, H = vb.height || svg.getBoundingClientRect().height;
  svg.removeAttribute('style'); svg.removeAttribute('height');
  const box = document.createElement('div'); box.className = 'dg';
  box.innerHTML = '<div class="dg-bar"><button data-z="-" aria-label="ย่อ">−</button><span class="z"></span><button data-z="+" aria-label="ขยาย">+</button><button data-z="fit">พอดีกรอบ</button><button data-z="1">100%</button><button data-z="full">เต็มหน้าจอ</button><span class="hint">ลากเมาส์เพื่อเลื่อน · Ctrl+ลูกกลิ้ง = ซูม · Shift+ลูกกลิ้ง = เลื่อนซ้าย-ขวา</span></div><div class="dg-view"></div>';
  const view = box.querySelector('.dg-view'), label = box.querySelector('.z');
  view.appendChild(svg); div.replaceWith(box);
  let s = 1;
  const set = v => { s = Math.min(3, Math.max(.08, v)); svg.setAttribute('width', Math.round(W * s)); svg.setAttribute('height', Math.round(H * s)); label.textContent = Math.round(s * 100) + '%'; };
  const fit = () => { set(Math.min(1, (view.clientWidth - 16) / W, (view.clientHeight - 16) / H)); view.scrollLeft = view.scrollTop = 0; };
  // เริ่มที่ขนาดจริง ถ้ากว้างเกินจอให้พอดีกว้างแต่ไม่เล็กกว่า 80% (ยังอ่านได้)
  fit(); // เริ่มที่พอดีกรอบ เห็นทั้งแผนภาพ แล้วซูมเข้าเอง
  if (!div.classList.contains('er-svg')) { // flow/state/sequence: เริ่มพอดีความกว้าง (ไม่เล็กกว่า 55%) สูงตามภาพแต่ไม่เกิน 80% ของจอ
    set(Math.max(.55, Math.min(1, (view.clientWidth - 16) / W)));
    view.style.height = Math.round(Math.min(H * s + 20, innerHeight * .8)) + 'px';
  }
  if (div.classList.contains('er-svg')) { set(Math.min(1.15, (view.clientWidth - 16) / W)); view.style.height = Math.round(H * s + 20) + 'px'; }
  box.querySelector('.dg-bar').onclick = e => {
    const z = e.target.dataset.z; if (!z) return;
    if (z === '+') set(s * 1.25); else if (z === '-') set(s / 1.25); else if (z === 'fit') fit();
    else if (z === '1') set(1);
    else if (z === 'full') box.requestFullscreen?.();
  };
  let d = null;
  view.onpointerdown = e => { d = [e.clientX, e.clientY, view.scrollLeft, view.scrollTop]; view.classList.add('drag'); view.setPointerCapture(e.pointerId); };
  view.onpointermove = e => { if (d) { view.scrollLeft = d[2] - (e.clientX - d[0]); view.scrollTop = d[3] - (e.clientY - d[1]); } };
  view.onpointerup = () => { d = null; view.classList.remove('drag'); };
  view.addEventListener('wheel', e => {
    if (e.ctrlKey) { e.preventDefault(); set(s * (e.deltaY < 0 ? 1.1 : .9)); }
    else if (e.shiftKey) { e.preventDefault(); view.scrollLeft += e.deltaY; }
    // ลูกกลิ้งปกติ: ปล่อยให้เลื่อนหน้าเอกสารตามเดิม (ไม่ติดอยู่ในกรอบ)
  }, { passive: false });
}

async function show(scrollTarget) {
  const id = byId[cur()] ? cur() : 'dev-readme';
  const p = byId[id];
  const out = document.getElementById('out');
  out.innerHTML = marked.parse(p.md);
  out.removeAttribute('aria-busy');
  out.querySelectorAll('a[href]').forEach(a => {
    const h = a.getAttribute('href');
    if (/^(https?:|#|mailto:)/.test(h)) return;
    const base = h.split('#')[0].split('/').pop();
    if (byBase[base]) a.setAttribute('href', '#' + byBase[base]);
  });
  wrapTables(out);
  outline(out, id);
  out.querySelectorAll('.er-svg').forEach(enhance); // ER ที่วางผังเอง: ใช้ซูม/ลากเหมือน mermaid
  const blocks = [...out.querySelectorAll('pre code.language-mermaid')];
  blocks.forEach(c => {
    const d = document.createElement('div'); d.className = 'mermaid'; d.textContent = c.textContent;
    c.closest('pre').replaceWith(d);
  });
  if (blocks.length) {
    try { const m = await loadMermaid(); await m.run({ nodes: out.querySelectorAll('.mermaid') }); }
    catch (e) { console.error(e); out.querySelectorAll('.mermaid:not([data-processed])').forEach(n => n.classList.add('sk-fail')); }
    out.querySelectorAll('.mermaid').forEach(enhance);
  }
  const i = PAGES.findIndex(x => x.id === id), a = PAGES[i - 1], b = PAGES[i + 1];
  out.insertAdjacentHTML('beforeend',
    `<div class="pager"><span>${a ? `<a href="#${a.id}">← ${a.t}</a>` : ''}</span><span>${b ? `<a href="#${b.id}">${b.t} →</a>` : ''}</span></div>`);
  document.title = p.t + ' · เอกสารระบบตารางเรียน';
  mark();
  const t = scrollTarget && document.getElementById(scrollTarget);
  t ? t.scrollIntoView() : scrollTo(0, 0);
}

// tooltip ข้อมูลเต็มของแผนภาพ ER (ดึงจาก data-tip)
const tipEl = document.createElement('div');
tipEl.className = 'tip';
document.body.appendChild(tipEl);
let tipOf = null;
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tipEl.style.display = 'none'; tipOf = null; return; }
  if (el !== tipOf) {
    tipOf = el;
    const [head, ...rest] = el.dataset.tip.split(String.fromCharCode(10));
    tipEl.replaceChildren();
    const b = document.createElement('b'); b.textContent = head; tipEl.appendChild(b);
    rest.forEach(l => { const d = document.createElement('div'); d.textContent = l; tipEl.appendChild(d); });
  }
  tipEl.style.display = 'block';
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(e.clientX + 16, innerWidth - w - 8) + 'px';
  tipEl.style.top = (e.clientY + 18 + h > innerHeight ? e.clientY - h - 12 : e.clientY + 18) + 'px';
});
document.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
document.getElementById('q').addEventListener('input', e => buildToc(e.target.value));
let last = cur();
addEventListener('hashchange', () => {
  const raw = location.hash.slice(1);
  // ลิงก์หัวข้อในหน้าเดียวกัน (id~n) ไม่ต้องโหลดหน้าใหม่
  if (cur() === last && raw.includes('~')) { document.getElementById(raw)?.scrollIntoView(); return; }
  last = cur(); show(raw.includes('~') ? raw : null);
});
buildToc();
show(location.hash.includes('~') ? location.hash.slice(1) : null);
</script>
