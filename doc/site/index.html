ows/flows/F8.png)\n\n### Flow F9\n\n![Flow F9](../4-user-flows/flows/F9.png)\n\n### Flow F10\n\n![Flow F10](../4-user-flows/flows/F10.png)\n\n### Flow F11\n\n![Flow F11](../4-user-flows/flows/F11.png)\n\n### Flow F12\n\n![Flow F12](../4-user-flows/flows/F12.png)"}, {"g": "ฉบับแปลไทย (ขั้น 1-4)", "id": "th-start", "t": "START-HERE", "p": "th/START-HERE.md", "md": "# ระบบตารางเรียน: เอกสารการออกแบบ ขั้นตอนที่ 1-5\n\nระบบจัดตารางเรียนอัตโนมัติสำหรับมหาวิทยาลัยไทย อ่านหลักสูตรจากไฟล์ PDF (มคอ.2) ให้หัวหน้าภาควิชากับอาจารย์วางแผนภาคเรียนร่วมกัน แล้วสร้างตารางเรียนที่ไม่ชนกันให้พิมพ์ได้\n\nเป็นโอเพนซอร์ส แต่ละสถาบันติดตั้งบนเซิร์ฟเวอร์ของตนเอง เอกสารชุดนี้คือ **ขั้นตอนการออกแบบก่อนเริ่มเขียนโค้ด**\n\n## เริ่มอ่านตรงไหน\n\n| ถ้าคุณ… | เริ่มที่ |\n|---|---|\n| อยากรู้ว่าระบบนี้ทำอะไรและเพื่อใคร | [1 ผู้ใช้และเป้าหมาย](#th-1) |\n| อยากเห็นว่าผู้ใช้แต่ละคนต้องทำอะไรใน 1 ภาคเรียน | [2 เส้นทางผู้ใช้](#th-2) |\n| อยากรู้ว่ามีหน้าอะไรบ้าง | [3 Sitemap](#th-3) |\n| อยากรู้ขั้นตอนคลิกของแต่ละงาน | [4 User flows](#th-4) |\n| ต้องการลองใช้ต้นแบบ | เปิด `5-wireframes/prototype.html` (ใช้ออฟไลน์ได้) |\n\n## ลำดับการอ่าน\n\n| ขั้น | โฟลเดอร์ | ตอบคำถามว่า | ภาพประกอบ |\n|:-:|---|---|---|\n| 1 | `1-users-and-goals/` | ใครใช้ระบบ และต้องการอะไร | `users-goals-map.png` |\n| 2 | `2-user-journeys/` | ผู้ใช้แต่ละคนผ่านอะไรบ้างใน 1 ภาคเรียน | — |\n| 3 | `3-sitemap/` | มีหน้าอะไรบ้าง ใครเห็นหน้าไหน | `sitemap-tree.png` (แบบง่าย), `sitemap.png` (แบบละเอียด) |\n| 4 | `4-user-flows/` | แต่ละงานคลิกอย่างไรทีละขั้น | `flows/F1.png` ถึง `F12.png` |\n| 5 | `5-wireframes/` | หน้าจอ 28 หน้า คลิกได้ | `prototype.html` (เมนู \"view as\" สลับผู้ใช้) |\n| 6 | `6-er-diagram/` | เก็บข้อมูลอะไร ความสัมพันธ์อย่างไร | ER diagram |\n\n## วิธีดู (ไม่ต้องติดตั้งอะไร)\n\n- **รูปภาพ:** ดับเบิลคลิกไฟล์ `.png`\n- **ต้นแบบ:** ดับเบิลคลิก `prototype.html` เปิดในเบราว์เซอร์\n- **ไฟล์ข้อความ:** เปิดด้วยโปรแกรมแก้ไขข้อความใดก็ได้\n- **เว็บเอกสารนี้:** เปิด `doc/site/index.html`\n\n## ควรรู้\n\n> - **wireframe เป็นสีเทาโดยตั้งใจ** แสดงโครงหน้าและการไหลของงาน ไม่ใช่หน้าตาจริง\n> - **ข้อมูลตัวอย่างเป็นหลักสูตรจริง** (ครุศาสตร์อุตสาหกรรม สาขาคอมพิวเตอร์ศึกษา มจพ.) ส่วนชื่อบุคคลเป็นชื่อสมมติ\n> - บางไฟล์อ้างถึง `tech-stack-list.txt` ซึ่งเป็นสเปกเทคนิคฉบับเต็ม **ไม่ได้รวมมาในชุดนี้**\n> - ไฟล์ `.py` ใช้วาดรูปใหม่เท่านั้น ไม่จำเป็นต้องใช้\n\n## สิ่งที่ช่วยได้มากที่สุด\n\nลองใช้ต้นแบบในบทบาท **หัวหน้าภาควิชา** และ **อาจารย์** แล้วจดสิ่งที่สับสน:\n\n1. ขั้นตอนที่หาไม่เจอ\n2. คำที่ไม่เข้าใจ\n3. สิ่งที่คาดว่าจะทำงานต่างออกไป\n"}, {"g": "ฉบับแปลไทย (ขั้น 1-4)", "id": "th-1", "t": "1 ผู้ใช้และเป้าหมาย", "p": "th/1-users-and-goals.md", "md": "# 1 ผู้ใช้และเป้าหมาย\n\nระบบจัดตารางเรียนอัตโนมัติ · ขั้นที่ 1 ของกระบวนการออกแบบเว็บ · เวอร์ชัน 2026-10-24\n\n> **ไฟล์ที่เกี่ยวข้อง:** `tech-stack-list.txt` (สเปกฉบับเต็ม หัวข้อ USERS AND GOALS เป็นต้นทางของหน้านี้) · `users-goals-map.png` (แผนภาพ ผู้ใช้ → เป้าหมาย → เทคโนโลยี)\n\n## สรุปใน 30 วินาที\n\n- ระบบเดียวสำหรับทุกภาควิชา ติดตั้งเองบนเซิร์ฟเวอร์ของสถาบัน (self-hosted + โอเพนซอร์ส)\n- ผู้ใช้คือ **บุคลากรของสถาบันเท่านั้น** นักศึกษา **ไม่ต้องล็อกอินเด็ดขาด** ได้รับแค่ตารางที่เผยแพร่แล้ว (พิมพ์ / ไฟล์)\n- ผู้ใช้หลักคือ **หัวหน้าภาควิชา** เป้าหมายคือลดเวลาทำตารางจาก 3 วัน-1 สัปดาห์ ให้เหลือไม่เกิน 30 นาที\n\n## วิสัยทัศน์\n\nระบบเดียวสำหรับทุกภาควิชา ยืดหยุ่นพอสำหรับสถาบันทั่วประเทศ (ผลิตภัณฑ์สุดท้าย) สร้างเดโมในเครื่องก่อน\n\n**ติดตั้งเองบนเซิร์ฟเวอร์ (2026-10-24):** แต่ละสถาบันติดตั้งสำเนาของตนเองบนเซิร์ฟเวอร์ของตนเอง\n\n## ปัญหาในปัจจุบัน\n\n| ปัญหา | รายละเอียด |\n|---|---|\n| ทำด้วยมือ | ตารางเรียนทำใน Excel และบนกระดาษ ไม่มีอะไรอัตโนมัติ |\n| ใช้เวลานาน | 3 วันถึง 1 สัปดาห์ต่อภาคเรียน |\n| เวลาหมดไปกับการคุยกัน | ใครสอนได้เมื่อไหร่ ใครสอนวิชาไหน |\n| เปลี่ยนไม่รู้จบ | การเปลี่ยนแปลงยังเข้ามาแม้ทำตาราง \"สุดท้าย\" เสร็จแล้ว |\n\n## ผู้ใช้\n\n| ผู้ใช้ | ทำอะไร | ใช้หน้าไหน | บัญชี |\n|---|---|---|---|\n| **หัวหน้าภาควิชา** (ผู้ใช้หลัก) | สร้างตารางของชั้นปีที่เลือกภาคเรียนละครั้ง · เปิดรอบสอบถามเวลาว่าง · อนุมัติการเปลี่ยนแปลง · เผยแพร่และพิมพ์ | ทุกหน้าของเว็บแอป | ได้รับเชิญจากผู้ดูแลระบบของสถาบัน |\n| **อาจารย์** | ระบุเวลาไม่ว่าง วิชาที่สอนได้/อยากสอน ชั่วโมงสูงสุดต่อวัน · ตรวจตารางตนเอง · ส่งคำขอเปลี่ยนแปลง | เวลาว่างของฉัน · ตารางของฉัน · คำขอของฉัน (**เห็นเฉพาะตารางของตนเอง**) | ได้รับเชิญจากหัวหน้าภาควิชา หนึ่งบัญชีสังกัดได้หลายภาควิชา |\n| **ผู้ดูแลระบบสถาบัน** | สร้างภาควิชา · เชิญหัวหน้า · ป้อนห้องที่ใช้ร่วมกัน · ดูแลการติดตั้งของสถาบัน (อัปเดต สำรองข้อมูล ตั้งค่าอีเมล อนุมัติรูปแบบหลักสูตรใหม่) | หน้าผู้ดูแล (ภาควิชา, หัวหน้า, ห้องร่วม, รูปแบบ, ระบบ) | สร้างตอนติดตั้ง (หน้าตั้งค่าครั้งแรก) |\n| **ภาควิชาอื่น** | ทำเหมือนหัวหน้าภาควิชา ในโปรไฟล์ของตนเอง | — | — |\n| **นักศึกษา** (ไม่ใช่ผู้ใช้) | ได้ตารางที่เผยแพร่แล้วของกลุ่มตนเอง (พิมพ์ A4 / ไฟล์) | — | **ไม่มี ตลอดไป** |\n\n> **ไม่มีผู้ดูแลแพลตฟอร์มกลาง** แต่ละสถาบันรันสำเนาของตนเอง ผู้ดูแลโอเพนซอร์สส่งมอบโค้ดและรูปแบบหลักสูตรที่ใช้ร่วมกัน แต่ **ไม่เคยเห็นข้อมูลของสถาบันใดเลย**\n\n**ทำไมภาควิชาอื่นสำคัญ:** ใช้ห้อง (และอาจารย์บางคน) ร่วมกัน ตารางที่เผยแพร่แล้วของภาควิชาเหล่านั้นจะจองห้อง\n\n## เป้าหมาย\n\n### ของหัวหน้าภาควิชา\n\n| รหัส | เป้าหมาย | รองรับโดย (เทคโนโลยี) |\n|:-:|---|---|\n| **G1** | ตารางไม่ชนกันทุกกลุ่ม | FET solver · pre-check · ตัวตรวจกฎของเราเอง (core lib) |\n| **G2** | เร็วกว่า 3 วัน-1 สัปดาห์มาก | รอบสอบถามเวลาว่าง (web + project service) · FET < 1 วินาที · \"คัดลอกจากภาคก่อน\" · ตารางตัวเลือก N แบบ |\n| **G3** | คุมได้เอง (ย้ายคาบ ปักหมุดคาบที่ตกลงแล้ว วิชาเลือก) | หน้าจัดตาราง (React + dnd-kit) · ตรวจสดตอนวาง (`POST /api/check`) · ปักหมุด + รันใหม่รอบหมุด (FET locks) · Schedule / Reserve วิชาเลือก |\n| **G4** | เชื่อข้อมูลที่อ่านจาก PDF ได้ | import service (pdftotext + ตัวอ่านรูปแบบหลักสูตร) · หน้าตรวจสอบ (ตาราง + ผังกระบวนวิชา) · ทุกค่าลิงก์ไปหน้า PDF ต้นทาง |\n| **G5** | พิมพ์ A4 ดูเป็นทางการ | พรีวิวพิมพ์ (web) · ฟอนต์ไทย (Noto Sans Thai / Sarabun) · ส่งออก PDF |\n| **G6** | ใช้งานต่อในภาคถัดไป | storage (PostgreSQL) · profile manager · คัดลอกจากภาคก่อน |\n\n### ของอาจารย์\n\n| รหัส | เป้าหมาย | รองรับโดย |\n|:-:|---|---|\n| **T1** | เวลาไม่ว่างและความต้องการได้รับการเคารพ | ตารางเวลาว่าง · กฎอาจารย์ใน FET (ตอนนี้เป็น **CORE** ไม่ใช่ทำทีหลัง) |\n| **T2** | รู้เมื่อมีการเปลี่ยนแปลงที่กระทบตน | สถานะตรวจทาน · คำขอเปลี่ยนแปลง · การแจ้งเตือน · ประวัติเวอร์ชัน |\n\n### ของผู้ดูแลระบบสถาบัน\n\n| รหัส | เป้าหมาย | รองรับโดย |\n|:-:|---|---|\n| **I1** | ภาควิชาไม่จองห้องร่วมซ้ำกัน | ห้องส่วนกลาง + การจองห้องจากตารางที่เผยแพร่แล้ว |\n\n## ตัวชี้วัดความสำเร็จ\n\n- ทั้งภาคเรียนจาก PDF ถึงพิมพ์ ใช้แรงงาน **ไม่เกิน 30 นาที** (เป้าแรก ตั้งใจให้เร็วที่สุดเท่าที่ทำได้)\n- ตารางที่บันทึกไม่มีการชนแบบ hard เลย\n- ทุกคาบถูกจัดลง หรือแสดงเป็นคาบที่ยังไม่ลง พร้อมเหตุผลและวิธีแก้ที่ใกล้ที่สุด\n- ไม่ต้องแก้ไฟล์ด้วยมือ\n- วัดภายในแอป: เวลาต่อขั้น · จำนวนครั้งที่ย้ายด้วยมือ · จำนวนครั้งที่รัน FET · คะแนนคุณภาพ (กฎ soft ที่รักษาได้ + คะแนน 1-5 จากหัวหน้า) ใช้เทียบภายหลังเพื่อหาจุดสมดุลระหว่างความเร็วกับคุณภาพ\n\n## ระบบต้องไม่ทำสิ่งเหล่านี้เด็ดขาด\n\n| รหัส | ห้าม | เทคโนโลยีรับประกันอย่างไร |\n|:-:|---|---|\n| **N1** | เปลี่ยนตารางโดยผู้ใช้ไม่ได้สั่ง | มีแต่ project service เท่านั้นที่เขียน · ทุกการเปลี่ยนแปลงถูกบันทึก · เก็บเวอร์ชันไว้ |\n| **N2** | แสดงข้อมูลอาจารย์นอกสถาบัน | ล็อกอิน + บทบาท · แต่ละสถาบันรันระบบของตนเอง ข้อมูลไม่ออกจากเซิร์ฟเวอร์ (PostgreSQL ใน Docker) · เป็นไปตาม PDPA ของไทย |\n| **N3** | ให้นักศึกษาเข้าระบบ | ไม่มีบทบาทนักศึกษา |\n\n## อยู่นอกขอบเขต (ตอนนี้)\n\n- นักศึกษาเลือกวิชาเลือกในระบบ (Reserve เก็บเวลาว่างไว้ให้)\n- ตารางสอบ\n\n## ส่วนที่เป็นของทั้งสองฝั่ง\n\nฟีเจอร์ที่ผู้ใช้ต้องการและต้องใช้ส่วนเทคโนโลยีเฉพาะ:\n\n| ฟีเจอร์ | ผู้ใช้ | เทคโนโลยี |\n|---|---|---|\n| ล็อกอิน + บทบาท | บุคลากรทุกคน | บัญชีในตัว (เสนอ) · project service ตรวจบทบาท |\n| รอบสอบถามเวลาว่าง | หัวหน้า + อาจารย์ | หน้าเว็บ + project service + กฎอาจารย์ใน FET |\n| ตรวจสดตอนวาง | หัวหน้า | dnd-kit + `POST /api/check` + core lib checker |\n| พรีวิวพิมพ์ (A4) | หัวหน้า → นักศึกษา | เลย์เอาต์พิมพ์บนเว็บ + ฟอนต์ไทย |\n| เวอร์ชัน + บันทึกการเปลี่ยนแปลง | หัวหน้า + อาจารย์ | project service (ผู้เขียนเพียงหนึ่งเดียว) + storage |\n| คัดลอกจากภาคก่อน | หัวหน้า | profile manager + storage |\n\n## ช่องว่างที่พบระหว่างเขียนเอกสารนี้\n\n> - เทคโนโลยียังไม่มีส่วน **AUTH (ล็อกอิน)** จำเป็นสำหรับ G2/T1/N2 ต้องเลือก\n> - **การแจ้งเตือน** (อีเมล / ในแอป) ยังไม่อยู่ในเทคโนโลยี จำเป็นสำหรับ T2\n"}, {"g": "ฉบับแปลไทย (ขั้น 1-4)", "id": "th-2", "t": "2 เส้นทางผู้ใช้", "p": "th/2-user-journeys.md", "md": "# 2 เส้นทางผู้ใช้\n\nร่าง 2026-10-23 · แก้ไขครั้งที่ 1 วันที่ 2026-10-24 หลังรับความเห็นผู้ใช้\n\nแต่ละขั้นอธิบายด้วย 5 เรื่อง: **ทำ** (ผู้ใช้ทำอะไร) · **เห็น** (หน้าไหน) · **รู้สึก** · **เสี่ยง** · **เราทำ** (ระบบรับมืออย่างไร)\n\n## สารบัญ\n\n| เส้นทาง | ผู้ใช้ | ขั้น |\n|---|---|---|\n| **A** | หัวหน้าภาควิชา (หนึ่งภาคเรียน) | A1-A12 |\n| **B** | อาจารย์ | B1-B5 |\n| **C** | ผู้ดูแลระบบสถาบัน | C1-C3 |\n| **โครงสร้างโปรไฟล์** | PDF เดียวหลายชั้นปี | ตัดสินใจแล้ว |\n\n---\n\n## เส้นทาง A: หัวหน้าภาควิชา (หนึ่งภาคเรียน)\n\n### A1 เข้าใช้งาน · ✅ OK\n\n| | |\n|---|---|\n| **ทำ** | เปิดอีเมลเชิญจากผู้ดูแลระบบสถาบัน ตั้งรหัสผ่าน ล็อกอิน |\n| **เห็น** | หน้าล็อกอิน → หน้าแรก |\n| **รู้สึก** | \"ยากไหมนะกว่าจะใช้เป็น?\" |\n| **เสี่ยง** | ยอมแพ้ถ้าหน้าแรกสับสน |\n| **เราทำ** | หน้าแรกมีปุ่มใหญ่ปุ่มเดียว: \"เริ่มตารางเรียนภาคนี้\" · แนะนำ 3 ขั้นในครั้งแรก |\n\n### A2 ตัวจัดการโปรไฟล์ · ✅ พอใช้ในตอนนี้\n\n| | |\n|---|---|\n| **ทำ** | เปิดโปรไฟล์ภาคก่อน หรือสร้างใหม่ |\n| **เห็น** | รายการโปรไฟล์ล่าสุด (ชื่อ รูปแบบหลักสูตร ภาคเรียน สถานะ: ร่าง / ตรวจทาน / เผยแพร่) |\n| **รู้สึก** | \"ไม่อยากพิมพ์ทุกอย่างใหม่\" |\n| **เสี่ยง** | ต้องป้อนอาจารย์และห้องใหม่ทุกภาค |\n| **เราทำ** | \"คัดลอกจากภาคก่อน\" เก็บอาจารย์ ห้อง กฎไว้ มีแต่ PDF/ภาคเรียนที่เปลี่ยน |\n\n### A3 สร้างโปรไฟล์ + ตั้งค่าพื้นฐาน\n\n> **แก้ 2026-10-24:** ผู้ใช้ไม่ต้องเลือกรูปแบบจากรายการสำเร็จรูปอีกต่อไป\n\n| | |\n|---|---|\n| **ทำ** | ตั้งชื่อ เลือกภาคเรียน · อัปโหลด PDF หลักสูตรทันที · เพิ่มอาจารย์และห้องตอนนี้หรือทีหลัง (ต้องมี **จำนวน** ห้องก่อนจัดตาราง) |\n| **เห็น** | ฟอร์มสั้น (ชื่อ ภาคเรียน) → อัปโหลด → การ์ด **\"สิ่งที่เราพบ\"**: รูปแบบ · เวอร์ชันหลักสูตร · ชั้นปี + ภาคเรียนที่พบ · รูปแบบหน่วยกิต · จำนวนสัปดาห์ต่อภาค แต่ละค่ามีหน้า PDF ที่มา |\n| **รู้สึก** | \"รูปแบบไหนคือของฉัน?\" → ตอนนี้: **\"สิ่งที่มันพบถูกไหม?\"** |\n| **เสี่ยง** | เลือกรูปแบบผิด = ตั้งค่าผิดทั้งหมดต่อจากนั้น · หลักสูตรชนิดใหม่ที่ระบบยังไม่รู้จัก |\n\n**เราทำ: ตรวจจับก่อน ยืนยันทีหลัง**\n\n1. ระบบอ่าน PDF แล้วเติมค่าตั้งให้ ผู้ใช้แค่ยืนยันหรือแก้\n2. แต่ละค่าแสดงหลักฐาน (หน้า + ข้อความที่จับคู่) จึงเห็นค่าผิดได้ง่าย\n3. เลย์เอาต์ที่ไม่รู้จัก → **ไม่เดาเงียบ ๆ** → ตั้งค่าแบบนำทาง: ผู้ใช้ชี้ที่หน้าตัวอย่างว่าคอลัมน์ไหนคือรหัส / ชื่อ / หน่วยกิต / ชั่วโมง แล้วบันทึกเป็น **FORMAT DEFINITION** ใหม่\n4. **Format definition = ข้อมูล (ไฟล์ตั้งค่า) ไม่ใช่โค้ด** หลักสูตรที่เปลี่ยนแค่เลย์เอาต์ไม่ต้องใช้โปรแกรมเมอร์และไม่ต้องอัปเดตระบบ มีแต่ระบบหน่วยกิตใหม่จริง ๆ ที่ต้องเขียนโค้ดใหม่\n5. รูปแบบใหม่เริ่มเป็น \"ยังไม่ตรวจสอบ\" (unverified) จนกว่าผู้ดูแลจะตรวจ จากนั้นสถาบันอื่นจึงใช้ได้\n\n### A4 อัปโหลด PDF + ตรวจข้อมูล\n\n| | |\n|---|---|\n| **ทำ** | อัปโหลด PDF หลักสูตร ตรวจวิชาในตารางและผังกระบวนวิชา แก้แถวสีแดง |\n| **เห็น** | หน้าตรวจสอบ (ตาราง \\| ผังกระบวนวิชา) แถวที่ผิดเป็นสีแดงพร้อมเหตุผล |\n| **รู้สึก** | \"มันอ่าน PDF ของฉันถูกไหม?\" |\n| **เสี่ยง** | เชื่อชั่วโมงหรือหน่วยกิตที่ผิด · ไม่ตรงกับรูปแบบที่เลือก |\n| **เราทำ** | ทุกค่าลิงก์ไปหน้า PDF · เตือนเมื่อไม่ตรง · **ไปต่อไม่ได้ตราบที่ยังมีแถวสีแดง** |\n\n> **ตรวจเร็ว (ผู้ใช้, 2026-10-24):** คลิกค่าใดก็ได้ → PDF เปิดข้างตารางที่หน้านั้น พร้อมไฮไลต์ตำแหน่งที่แน่นอน · ปุ่ม **\"แถวแดงถัดไป\"** กระโดดไปทีละจุดที่ผิด\n\n### A5 รอบสอบถามเวลาว่าง · ✅ OK\n\n| | |\n|---|---|\n| **ทำ** | เชิญอาจารย์ที่ยังไม่เข้าระบบ เปิดรอบพร้อมกำหนดส่ง ดูว่าใครส่งแล้ว |\n| **เห็น** | กระดานสถานะ (ส่งแล้ว / ยังไม่ส่ง / ล่าช้า) ปุ่มเตือน |\n| **รู้สึก** | \"การตามคนคือส่วนที่ช้าที่สุด\" |\n| **เสี่ยง** | อาจารย์พลาดกำหนดส่ง |\n| **เราทำ** | เตือนอัตโนมัติ · หลังกำหนด หัวหน้ากรอกแทนคนที่ขาด หรือทำเครื่องหมาย \"ว่างได้ทุกเวลา\" |\n\n### A6 แก้ปัญหาจากข้อมูลอาจารย์\n\n| | |\n|---|---|\n| **ทำ** | แก้รายการที่ถูกติดธง: วิชาที่ไม่มีใครสอนได้ · อาจารย์สองคนอยากสอนวิชาเดียว · อาจารย์ภาระเกิน |\n| **เห็น** | เช็กลิสต์ปัญหา แต่ละข้อมีเธรดความเห็น |\n| **รู้สึก** | \"เมื่อก่อนต้องคุยกันเป็นวัน\" |\n| **เสี่ยง** | อภิปรายไม่จบ |\n\n**เราทำ:** ระบบสร้างรายการปัญหา **เอง** จากสิ่งที่อาจารย์ส่ง (ไม่ต้องมีใครคอยสังเกต) มีสองชนิด:\n\n| ชนิด | ความหมาย | ตัวอย่าง → ทางแก้ |\n|---|---|---|\n| 🔴 **BLOCKER** | จัดตารางไม่ได้จนกว่าจะแก้ | วิชาที่ไม่มีอาจารย์สอนได้ → หัวหน้ามอบหมายอาจารย์ (หรือทำเครื่องหมาย \"อาจารย์ภายนอก / ต้องจ้าง\") <br> อาจารย์สองคนอยากสอนวิชาเดียว → หัวหน้าเลือกคนเดียว หรือแบ่งกลุ่มให้ทั้งสอง |\n| 🟠 **WARNING** | รันได้ แต่บางคนอาจไม่พอใจ | วิชาของอาจารย์ใช้ชั่วโมงมากกว่าเวลาว่าง → หัวหน้าแก้ หรือ **ยอมรับ** พร้อมบันทึกหมายเหตุ |\n\n- แต่ละรายการมีเธรดความเห็น ปิดได้เมื่อมีการตัดสินใจเท่านั้น และบันทึกไว้ (**ใคร เมื่อไหร่ ทำไม**)\n- **จะไปต่อได้เมื่อ:** ไม่มี blocker ค้าง และทุก warning ถูกแก้หรือยอมรับ (\"รายการต้องว่าง\" = ไม่มีอะไรที่ยังไม่ตัดสินใจ)\n\n### A7 กฎ + วิชาเลือก\n\n| | |\n|---|---|\n| **ทำ** | ตรวจตารางเวลา กลุ่ม จำนวนห้อง วิชาเลือก (Schedule / Reserve) น้ำหนักกฎ |\n| **เห็น** | หน้ากฎ · กฎ hard เป็นสีเทา (มาจากหลักสูตร) · กฎ soft มีระดับน้ำหนัก |\n| **รู้สึก** | \"กฎพวกนี้หมายความว่าอะไร?\" |\n| **เสี่ยง** | ทำทุกอย่างเป็น hard → จัดไม่ลง |\n| **เราทำ** | ชื่อกฎเป็นภาษาง่าย ๆ · ค่าเริ่มต้นของโปรไฟล์ · pre-check อธิบายกรณีที่เป็นไปไม่ได้ก่อนรัน |\n\n> **รายงาน PRE-CHECK (ผู้ใช้, 2026-10-24):** หลังตรวจ จะมีรายงานสั้น (OK / ปัญหา / กฎเสี่ยง) ที่หัวหน้าต้อง **ACKNOWLEDGE (รับทราบ)** ก่อนปุ่ม Generate จะปลดล็อก การรับทราบถูกบันทึกไว้กับการรัน\n\n### A8 สร้าง + จัดตาราง · ✅ OK\n\n| | |\n|---|---|\n| **ทำ** | กด Generate เทียบตัวเลือกที่ดีที่สุด ลากคาบ ปักหมุดคาบที่ตกลงแล้ว |\n| **เห็น** | ตารางเรียน · ถาดคาบที่ยังไม่ลง · ช่องสีแดงพร้อมเหตุผล · คะแนนคุณภาพ |\n| **รู้สึก** | \"เชื่อได้ไหม? แก้เองได้ไหม?\" |\n| **เสี่ยง** | ผลที่ไม่ครบรู้สึกเหมือนล้มเหลว |\n| **เราทำ** | ผลบางส่วน + ถาด + เหตุผล + วิธีแก้ที่ใกล้ที่สุด · ตรวจสดทุกครั้งที่วาง · รันใหม่รอบหมุด |\n\n### A9 ห้อง + อาจารย์ + พรีวิว · ✅ OK\n\n| | |\n|---|---|\n| **ทำ** | ยืนยันห้อง (FET เลือก) ยืนยันอาจารย์ของแต่ละคาบ ตรวจพรีวิว A4 |\n| **เห็น** | หน้ามอบหมายพร้อมพรีวิว A4 สดด้านล่าง |\n| **รู้สึก** | \"หน้าตาเหมือนกระดาษจริงไหม?\" |\n| **เสี่ยง** | พบการชนช้าเกินไป |\n| **เราทำ** | แสดงการชนที่คาบนั้นตรง ๆ · พรีวิวเหมือนงานพิมพ์ทุกประการ |\n\n### A10 ให้อาจารย์ตรวจทาน\n\n| | |\n|---|---|\n| **ทำ** | ส่งร่างเข้าสถานะ REVIEW อ่านคำขอเปลี่ยนแปลง |\n| **เห็น** | รายการคำขอเปลี่ยน: ใคร · อะไร · เหตุผล · **ผลกระทบ** (อะไรจะต้องย้าย) |\n| **รู้สึก** | \"แก้อย่างหนึ่งพังอีกอย่างเสมอ\" |\n| **เสี่ยง** | เปลี่ยนอย่างเดียวทำให้ทั้งตารางสับใหม่ |\n| **เราทำ** | รันใหม่แบบเปลี่ยนน้อยที่สุด (อย่างอื่นปักหมุด) · อนุมัติ / ปฏิเสธพร้อมหมายเหตุ |\n\n> **คุยกันตัวต่อตัว (ผู้ใช้, 2026-10-24):** หัวหน้ากับอาจารย์มักตกลงเรื่องเล็ก ๆ กันต่อหน้า หัวหน้าไม่ควรต้องยื่นคำขอหรือไล่ดูทั้งรายการ\n>\n> **DIRECT EDIT:** ใน REVIEW หัวหน้าย้ายคาบ / สลับอาจารย์ได้ตรง ๆ บนตาราง\n> - ตรวจสดและดูตัวอย่างผลกระทบเหมือนเดิม (\"นี่จะย้ายอีก 2 คาบ\")\n> - มีช่องเดียว: **\"ตกลงกับ ___\"** (ไม่บังคับ)\n> - บันทึกเป็นการเปลี่ยนแปลงเหมือนอื่น และแจ้งอาจารย์ที่ได้รับผลกระทบพร้อมหมายเหตุ\n> - แก้เล็ก ๆ ที่ไม่กระทบอย่างอื่นมีผลทันที · แก้ที่ย้ายคาบอื่นจะถามก่อนว่า \"ใช้เลยไหม?\"\n> - คำขอแบบเป็นทางการ: สำหรับอาจารย์ที่ไม่ได้คุยกับหัวหน้า หรือการเปลี่ยนใหญ่\n\n### A11 เผยแพร่ + พิมพ์ · ✅ OK\n\n| | |\n|---|---|\n| **ทำ** | เผยแพร่ พิมพ์ / ดาวน์โหลดแยกตามกลุ่ม (และตามอาจารย์ ตามห้อง) |\n| **เห็น** | หน้าสรุป: ผลทั้งหมด หมายเลขเวอร์ชัน + วันที่ |\n| **รู้สึก** | \"เสร็จแล้ว และพิสูจน์ได้ว่าไม่ชน\" |\n| **เราทำ** | ล็อกเวอร์ชัน · บันทึกการเปลี่ยนแปลง · นักศึกษาได้รับสำเนาพิมพ์ (ไม่ต้องล็อกอิน) |\n\n### A12 หลังเผยแพร่ (เมื่อไหร่ก็ได้ในภาคเรียน) · ✅ OK\n\n| | |\n|---|---|\n| **ทำ** | จัดการคำขอเปลี่ยนที่มาทีหลัง → เวอร์ชันใหม่ |\n| **เราทำ** | ตรวจผลกระทบเหมือนเดิม + เปลี่ยนน้อยที่สุด · แจ้งอาจารย์ที่ได้รับผลกระทบ · เก็บเวอร์ชันเก่าไว้ · direct edit (ดู A10) ใช้ได้เช่นกัน แต่ **สร้างเวอร์ชันใหม่เสมอ** |\n\n---\n\n## เส้นทาง B: อาจารย์\n\n> ✅ ทุกขั้นของ B ผ่านแล้ว (ผู้ใช้, 2026-10-24)\n\n| ขั้น | ทำ | หมายเหตุ |\n|:-:|---|---|\n| **B1** ได้รับเชิญ | เปิดลิงก์เชิญ ตั้งรหัสผ่าน (หรือเข้าด้วยบัญชีเดิมถ้าอยู่ภาควิชาอื่นแล้ว) | |\n| **B2** ส่งข้อมูล | กรอกตารางไม่ว่างรายสัปดาห์ · จัดอันดับวิชาที่สอนได้ · ชั่วโมงสูงสุดต่อวัน · แก้ได้จนถึงกำหนดส่ง | รู้สึก \"ความต้องการของฉันจะถูกเคารพไหม?\" → เราแสดงใบรับ \"ส่งแล้ว\" + สิ่งที่หัวหน้าจะเห็น · ยังแสดงรายการ blocker/warning ที่เกี่ยวกับตน (จาก A6) |\n| **B3** หารือ | ได้รับความเห็นในรายการที่ติดธง (เช่น สองคนอยากสอนวิชาเดียว) ตอบในระบบ | |\n| **B4** ตรวจทาน | เห็น **เฉพาะตารางของตนเอง** ในสถานะ REVIEW · ส่งคำขอเปลี่ยนพร้อมเหตุผลถ้าจำเป็น | รู้สึก \"ขอไปจะคุ้มไหม?\" → เราแสดงสถานะคำขอ (รอ / อนุมัติ / ปฏิเสธ + หมายเหตุ) · ถ้าตกลงกันต่อหน้าแล้วไม่ต้องยื่นอะไร จะได้รับแจ้ง \"แก้โดย <หัวหน้า>: <หมายเหตุ>\" พร้อมช่องเวลาเก่า/ใหม่เทียบกัน |\n| **B5** สุดท้าย | ได้รับแจ้งเมื่อเผยแพร่และเมื่อมีการเปลี่ยนแปลงภายหลัง · ดาวน์โหลด / พิมพ์ตารางของตนเอง | |\n\n---\n\n## เส้นทาง C: ผู้ดูแลระบบสถาบัน (ครั้งเดียว แล้วนาน ๆ ครั้ง)\n\n> ✅ ทุกขั้นของ C ผ่านแล้ว\n\n| ขั้น | ทำ |\n|:-:|---|\n| **C1** | ได้รับบัญชีสถาบันจากผู้ดูแลแพลตฟอร์ม |\n| **C2** | สร้างภาควิชา · เชิญหัวหน้าภาควิชา · ป้อนห้องที่ใช้ร่วม (ใช้โดยหลายภาควิชา) |\n| **C3** | ภายหลัง: เพิ่ม/ลบหัวหน้า · ดูว่าภาควิชาไหนเผยแพร่แล้ว |\n\n## หน้าที่เส้นทางเหล่านี้บ่งชี้\n\nข้อมูลนำเข้าสำหรับ sitemap ขั้นถัดไป:\n\n| กลุ่ม | หน้า |\n|---|---|\n| ทั่วไป | ล็อกอิน · หน้าแรก |\n| หัวหน้า | ตัวจัดการโปรไฟล์ · สร้างโปรไฟล์ · อัปโหลด + ตรวจจับ/ยืนยัน · ตรวจสอบ (ตาราง \\| ผังกระบวนวิชา \\| แผง PDF ข้าง) · ตั้งค่ารูปแบบ (เลย์เอาต์ที่ไม่รู้จัก) · รอบสอบถามเวลาว่าง · เช็กลิสต์ข้อมูลอาจารย์ · กฎ · สร้าง + จัดตาราง · ห้อง + อาจารย์ + พรีวิว · คำขอเปลี่ยนแปลง · สรุป / เผยแพร่ |\n| อาจารย์ | เวลาว่างของฉัน · ตารางของฉัน · คำขอของฉัน |\n| ผู้ดูแล | ภาควิชา · หัวหน้า · ห้องร่วม |\n\n---\n\n## โครงสร้างโปรไฟล์: PDF เดียวหลายชั้นปี\n\n> **ตัดสินใจแล้ว 2026-10-24 (ผู้ใช้ OK)**\n\n**คำถาม:** PDF 5 ปี → หนึ่งโปรไฟล์ที่มี 5 ส่วนชั้นปี หรือแยกเป็น 5 โปรไฟล์?\n\n**ข้อเสนอ:** **หนึ่งโปรไฟล์ต่อหนึ่งภาควิชาต่อหนึ่งภาคเรียน** ภายในมี **YEAR PLAN** หนึ่งอันต่อชั้นปีที่สอน\n\n```text\nPROFILE \"CED คอมพิวเตอร์ศึกษา - ภาค 1/2027\"   ← สิ่งที่ถูกตรวจทาน เผยแพร่ และเก็บเวอร์ชัน\n ├─ แหล่งข้อมูล: PDF 2564 (ปี 1-3) | PDF 2559 (ปี 4)   ← PDF 1..n ไฟล์ บางชั้นปีมาจากหลักสูตรเก่าได้\n ├─ ใช้ร่วม:    อาจารย์ ห้อง ตารางเวลา กฎ\n ├─ YEAR PLAN 1 (จาก 2564 วิชาภาค 1)   สถานะ: done\n ├─ YEAR PLAN 2 (จาก 2564 วิชาภาค 1)   สถานะ: out of date\n ├─ YEAR PLAN 3 ...\n ├─ YEAR PLAN 4 (จาก 2559)\n └─ (ปี 5 = ฝึกประสบการณ์นอกสถานที่ → แสดงรายการ ไม่มีอะไรให้จัดตาราง)\n```\n\n### ทำไมไม่แยกเป็น 5 โปรไฟล์\n\n- **อาจารย์และห้องชุดเดียวกันรองรับทุกชั้นปีในเวลาเดียวกัน** โปรไฟล์ที่แยกจะคิดว่าอาจารย์ X ว่าง จึงพบการชนได้แค่ด้วยการตรวจข้ามโปรไฟล์ ซึ่งเป็นส่วนที่เปราะบางที่สุด\n- ตรวจทานครั้งเดียว เผยแพร่ครั้งเดียว เวอร์ชันเดียวทั้งภาควิชา แทนที่จะเป็น 5 อันที่อาจเพี้ยนจากกัน\n\n### วิธีให้การเปลี่ยนแปลงเล็กและปลอดภัย\n\n| กติกา | ผล |\n|---|---|\n| แต่ละ year plan มีแท็บและสถานะของตัวเอง (done / out of date) | แก้ข้อมูลปี 2 ทำให้เฉพาะปี 2 เป็น out of date |\n| รันใหม่ทำต่อชั้นปี | ปีอื่นถูกปักหมุด คาบของปีอื่นจึงย้ายไม่ได้ |\n| หนึ่ง year plan อ่านจากหลักสูตร **หนึ่งเวอร์ชัน** เท่านั้น | วิชาไม่ปนกันภายในชั้นปี |\n| เลือกจัดแค่บางชั้นปีก่อน (Scope) | เพิ่มที่เหลือทีหลังได้ |\n| \"คัดลอกจากภาคก่อน\" คัดลอกโปรไฟล์ | แต่ละ year plan เลื่อนขึ้นไปพร้อมนักศึกษา |\n\n> **เปลี่ยนการตัดสินใจก่อนหน้า** ใน `tech-stack-list.txt`: เดิม \"หนึ่งโปรไฟล์ = หนึ่งเวอร์ชันหลักสูตร\" → ตอนนี้ **หนึ่ง YEAR PLAN = หนึ่งเวอร์ชันหลักสูตร** หนึ่งโปรไฟล์อาจมีหลายเวอร์ชัน\n"}, {"g": "ฉบับแปลไทย (ขั้น 1-4)", "id": "th-3", "t": "3 Sitemap", "p": "th/3-sitemap.md", "md": "# 3 Sitemap\n\nเสร็จ 2026-10-24 · ทุกหน้า ใครเห็น และหน้าเชื่อมกันอย่างไร · สร้างจาก `2-user-journeys` (A = หัวหน้า, B = อาจารย์, C = ผู้ดูแลระบบสถาบัน)\n\n> **ภาพ:** แผนภาพต้นไม้ `sitemap-tree.png` · แบบละเอียด `sitemap.png`\n\n**สัญลักษณ์:** `[A5]` = ขั้นของเส้นทางที่หน้านั้นรองรับ · `(step)` = อยู่ในแถบขั้นตอนของโปรไฟล์ · **\\*** = หน้าใหม่ ยังไม่อยู่ในเส้นทางผู้ใช้\n\n## ภาพรวม 5 กลุ่มหน้า\n\n| กลุ่ม | ใครเห็น | หน้า |\n|:-:|---|---|\n| **0** | สาธารณะ (ยังไม่ล็อกอิน) | ตั้งค่าครั้งแรก · ล็อกอิน · รีเซ็ตรหัสผ่าน · รับคำเชิญ |\n| **1** | ทุกหน้าหลังล็อกอิน (แถบบน) | การแจ้งเตือน · บัญชีของฉัน |\n| **2** | หัวหน้าภาควิชา | หน้าแรก · โปรไฟล์ · บุคลากร & ห้อง · **พื้นที่ทำงานโปรไฟล์ 9 ขั้น** |\n| **3** | ผู้ดูแลระบบสถาบัน | หน้าแรก · ภาควิชา · ห้องร่วม · ปฏิทิน · รูปแบบหลักสูตร · ระบบ |\n| **4** | อาจารย์ | หน้าแรก · เวลาว่าง · รายการของฉัน · ตารางของฉัน · คำขอของฉัน |\n\n---\n\n## 0. สาธารณะ (ยังไม่ล็อกอิน)\n\n| เลข | หน้า | รายละเอียด |\n|:-:|---|---|\n| 0.0 \\* | **ตั้งค่าครั้งแรก** | แสดง **ครั้งเดียว** หลังติดตั้ง: ชื่อสถาบัน · บัญชีผู้ดูแลคนแรก · ภาษา แล้วหายไป (self-hosted, 2026-10-24) |\n| 0.1 | ล็อกอิน | |\n| 0.2 | ลืม / รีเซ็ตรหัสผ่าน | |\n| 0.3 | รับคำเชิญ `[A1 B1]` | ตั้งรหัสผ่าน หรือ \"เข้าด้วยบัญชีเดิมของฉัน\" (อยู่ภาควิชาอื่นแล้ว) |\n\n## 1. ทุกหน้าหลังล็อกอิน (แถบบน)\n\nแถบบนมี 3 อย่าง:\n\n- **ตัวสลับภาควิชา:** คนหนึ่งอยู่ได้หลายภาควิชา และเป็นหัวหน้าในที่หนึ่ง เป็นอาจารย์ในอีกที่ได้\n- **กระดิ่งแจ้งเตือน** → 1.1\n- **เมนูบัญชี** → 1.2 และออกจากระบบ\n\n| เลข | หน้า | รายละเอียด |\n|:-:|---|---|\n| 1.1 \\* | การแจ้งเตือน | คำเชิญ · กำหนดส่ง · การเตือน · \"แก้โดย <หัวหน้า>: <หมายเหตุ>\" · เผยแพร่แล้ว |\n| 1.2 \\* | บัญชีของฉัน | ชื่อ · รหัสผ่าน · ภาษา (ไทย / อังกฤษ) · ตั้งค่าอีเมล |\n\n## 2. หัวหน้าภาควิชา\n\n| เลข | หน้า | รายละเอียด |\n|:-:|---|---|\n| 2.1 | **หน้าแรก** `[A1]` | ปุ่มใหญ่ \"เริ่มตารางเรียนภาคนี้\" (หรือ \"ทำต่อ <โปรไฟล์>\") · ด้านล่าง: สิ่งที่ต้องทำตอนนี้ (อาจารย์ที่ล่าช้า, blocker ที่ค้าง, คำขอใหม่) |\n| 2.2 | **โปรไฟล์** `[A2]` | รายการ: ชื่อ ภาคเรียน ชั้นปี สถานะ (ร่าง / ตรวจทาน / เผยแพร่) · ปุ่ม **ใหม่** \\| **คัดลอกจากภาคก่อน** |\n| 2.3 \\* | **บุคลากร & ห้องของภาควิชา** | อาจารย์ของภาควิชา (เชิญ ลบ ดูว่าใครเข้าแล้ว) และห้องของภาควิชาเอง (ชื่อ ประเภท ที่นั่ง) อยู่ **นอก** โปรไฟล์ จึงพิมพ์ครั้งเดียวใช้ซ้ำได้ทุกภาค ห้องร่วมมาจากผู้ดูแล (3.3) |\n| 2.4 | **พื้นที่ทำงานโปรไฟล์** | เปิดจาก 2.2 · แถบขั้นตอนด้านบน (เสร็จ / ปัจจุบัน / ล้าสมัย / ล็อก) · แท็บชั้นปี (ปี 1 \\| ปี 2 \\| …) ในทุกขั้นที่ทำต่อชั้นปี |\n\n### 2.4 พื้นที่ทำงานโปรไฟล์: 9 ขั้น\n\n| ขั้น | หน้า | ทำอะไร | ต่อชั้นปี |\n|:-:|---|---|:-:|\n| 1 | **ตั้งค่า** `[A3]` | ชื่อ ภาคเรียน → อัปโหลด PDF → การ์ด \"สิ่งที่เราพบ\" (แต่ละค่า + หน้า PDF) | |\n| 1a | ↳ 2.4.1 **ตั้งค่ารูปแบบ** `[A3]` | เฉพาะเมื่อไม่รู้จักเลย์เอาต์: ชี้หน้าตัวอย่าง ตั้งชื่อคอลัมน์ บันทึกเป็น format definition (สถานะ unverified) | |\n| 2 | **ตรวจข้อมูล** `[A4]` | ตาราง \\| ผังกระบวนวิชา · แผง PDF ข้างเปิดเมื่อคลิกค่าใดก็ได้ · \"แถวแดงถัดไป\" · ไปต่อไม่ได้ตราบที่ยังมีแถวแดง | ✅ |\n| 3 | **รอบเวลาว่าง** `[A5]` | เลือกอาจารย์ของภาคนี้ (จาก 2.3) · กำหนดส่ง · กระดานสถานะ · การเตือน | |\n| 4 | **ข้อมูลอาจารย์** `[A6]` | blocker และ warning แต่ละข้อมีเธรดความเห็น · ต้องว่างจึงไปต่อได้ | |\n| 5 | **กฎ + วิชาเลือก** `[A7]` | ตารางเวลา · กลุ่ม · จำนวนห้อง · วิชาเลือก (Schedule / Reserve) · น้ำหนักกฎ · \"Check\" → รายงาน pre-check → Acknowledge (ปลดล็อก Generate) | ✅ |\n| 6 | **สร้าง + จัดตาราง** `[A8]` | ตาราง · ถาดคาบที่ยังไม่ลง · ตัวเลือก · ปักหมุด · รันใหม่ชั้นปีนี้ · แท็บย่อย [จัดตาราง] [พรีวิวพิมพ์] | ✅ |\n| 7 | **ห้อง + อาจารย์** `[A9]` | มอบหมายต่อคาบ · การชนบนคาบ · พรีวิว A4 สดด้านล่าง | |\n| 8 | **อาจารย์ตรวจทาน** `[A10]` | ส่งเข้า REVIEW · รายการคำขอเปลี่ยน (ใคร อะไร เหตุผล ผลกระทบ) · **DIRECT EDIT** บนตารางพร้อม \"ตกลงกับ ___\" | |\n| 9 | **เผยแพร่ + พิมพ์** `[A11]` | เผยแพร่ → เวอร์ชันล็อก · ดาวน์โหลดต่อกลุ่ม / อาจารย์ / ห้อง | |\n| — | ↳ 2.4.2 **เวอร์ชัน + บันทึก** `[A11 A12]` | ทุกเวอร์ชัน · ใครเปลี่ยนอะไร ทำไม · เปิดเวอร์ชันเก่าได้ · \"เริ่มการเปลี่ยนแปลง\" หลังเผยแพร่ → เวอร์ชันใหม่ (A12) | |\n\n> **กฎแถบขั้น:** ขั้นหนึ่งปลดล็อกเมื่อขั้นก่อนหน้าเสร็จ การย้อนไปแก้ขั้นที่เสร็จแล้วจะทำให้ขั้นหลัง **\"ล้าสมัย\"** เฉพาะ **ชั้นปีนั้น** ถ้าการเปลี่ยนอยู่ภายในแท็บชั้นปีเดียว\n\n## 3. ผู้ดูแลระบบสถาบัน\n\nดูแลการติดตั้งของสถาบันนี้ด้วย ไม่มีผู้ดูแลแพลตฟอร์ม (2026-10-24)\n\n| เลข | หน้า | รายละเอียด |\n|:-:|---|---|\n| 3.1 | หน้าแรกผู้ดูแล `[C3]` | ภาควิชาไหนเผยแพร่แล้วในภาคนี้ ไหนล่าช้า · มีอัปเดตไหม |\n| 3.2 | ภาควิชา + หัวหน้า `[C2 C3]` | สร้างภาควิชา · เชิญ / ลบหัวหน้า |\n| 3.3 | ห้องร่วม `[C2]` | ห้องที่หลายภาควิชาใช้ · การจองระหว่างภาควิชา (สเปก C5/F2) |\n| 3.4 \\* | **ปฏิทินการศึกษา** | วันที่ภาคเรียนและวันหยุด โปรไฟล์เลือกภาคเรียนจากที่นี่ (สเปก: **ไม่เอาวันที่ภาคเรียนจากไฟล์หลักสูตร**) |\n| 3.5 \\* | **รูปแบบหลักสูตร** | รูปแบบที่มากับรุ่นที่ออก (จากโครงการโอเพนซอร์ส) + ที่สร้างที่นี่ใน 2.4.1 (unverified → ผู้ดูแลอนุมัติสำหรับสถาบันนี้) · \"ส่งออก\" ไฟล์รูปแบบเพื่อส่งให้โครงการ ให้สถาบันอื่นได้ใช้ด้วย |\n| 3.6 \\* | **ระบบ** | สำรองข้อมูล (ดาวน์โหลด / กู้คืน) · เซิร์ฟเวอร์อีเมล (SMTP, ไม่บังคับ) · เวอร์ชัน + บันทึกอัปเดต · สถานะบริการ · บันทึกการรัน solver |\n\n## 4. อาจารย์\n\n| เลข | หน้า | รายละเอียด |\n|:-:|---|---|\n| 4.1 | หน้าแรก `[B]` | สิ่งที่ครบกำหนด: กำหนดส่งเวลาว่าง · รายการเกี่ยวกับฉัน · การตรวจทานที่เปิดอยู่ |\n| 4.2 | เวลาว่างของฉัน `[B2]` | ตารางไม่ว่างรายสัปดาห์ · จัดอันดับวิชา · ชั่วโมงสูงสุดต่อวัน · แก้ได้จนถึงกำหนด · ใบรับ |\n| 4.3 | รายการของฉัน `[B3]` | รายการ blocker / warning เกี่ยวกับฉัน พร้อมเธรดความเห็น |\n| 4.4 | ตารางของฉัน `[B4 B5]` | เฉพาะคาบของฉัน · ร่าง (ใน REVIEW) หรือเผยแพร่แล้ว · พิมพ์ / ดาวน์โหลด · \"ขอเปลี่ยน\" → 4.5 |\n| 4.5 | คำขอของฉัน `[B4]` | รอ / อนุมัติ / ปฏิเสธ + หมายเหตุ · การเปลี่ยนที่หัวหน้าทำให้ฉัน (พร้อมหมายเหตุ) |\n\n---\n\n## หน้าเชื่อมกันอย่างไร (เส้นทางหลัก)\n\n| สถานการณ์ | ทางผ่านหน้า |\n|---|---|\n| **ติดตั้ง** | แอดมินเซิร์ฟเวอร์รัน `docker compose up` → 0.0 ตั้งค่าครั้งแรก → 3.1 |\n| **หัวหน้า ภาคใหม่** | 0.1 → 2.1 → 2.2 (คัดลอกจากภาคก่อน) → ขั้นของ 2.4 (1) … (9) |\n| **หัวหน้า อาจารย์ใหม่** | 2.3 เชิญ → อีเมล → อาจารย์ 0.3 → 4.1 |\n| **รอบสอบถาม** | หัวหน้า 2.4(3) เปิดรอบ → อาจารย์ได้แจ้งเตือน 1.1 → 4.2 → หัวหน้าดูสถานะใน 2.4(3) |\n| **รายการปัญหา** | หัวหน้า 2.4(4) ↔ อาจารย์ 4.3 (เธรดความเห็น **เดียวกัน** มองจากสองฝั่ง) |\n| **ตรวจทาน** | หัวหน้า 2.4(8) ส่งร่าง → อาจารย์ 4.4 → 4.5 ส่งคำขอ → หัวหน้า 2.4(8) อนุมัติ/ปฏิเสธ → อาจารย์ 1.1 |\n| **เปลี่ยนตัวต่อตัว** | หัวหน้า 2.4(8) direct edit → อาจารย์ 1.1 \"แก้โดย <หัวหน้า>: <หมายเหตุ>\" → 4.4 |\n| **หลังเผยแพร่** | หัวหน้า 2.4.2 \"เริ่มการเปลี่ยนแปลง\" → เวอร์ชันใหม่ → อาจารย์ที่ได้รับผลกระทบ 1.1 |\n| **PDF ที่ไม่รู้จัก** | หัวหน้า 2.4(1) → 2.4.1 → ผู้ดูแลสถาบัน 3.5 อนุมัติ → (ไม่บังคับ) ส่งออกไปโครงการโอเพนซอร์ส |\n\n## การเปลี่ยนแปลงสเปกที่สิ่งนี้บ่งชี้ (ยังไม่ได้ใช้)\n\n- **แถบขั้นตอน 9 ขั้น** แทน 7 ขั้นใน \"TOP BAR\" ของ `tech-stack-list.txt`: Detect รวมเข้า Setup · Availability / Teacher input / Teacher review เป็นขั้นใหม่\n- **อาจารย์ + ห้อง** ย้ายออกจาก \"สร้างโปรไฟล์\" ไปหน้าภาควิชา (2.3) โปรไฟล์เพียงเลือกจากที่นั่น\n- **ผู้ดูแลสถาบัน** ได้หน้าปฏิทิน (3.4) รูปแบบ (3.5) และระบบ (3.6) · ไม่มีผู้ดูแลแพลตฟอร์ม\n\n## ยังเปิดอยู่\n\n- **การแจ้งเตือน:** เสนอ ในแอปเสมอ + อีเมลเฉพาะเมื่อ 3.6 มีเซิร์ฟเวอร์อีเมล (self-hosted ทำให้เหมาะที่สุด)\n- **ล็อกอิน:** เสนอ บัญชีในตัว (ไม่ใช้บริการภายนอก) · single sign-on ของสถาบัน = ภายหลัง\n\n## ตัดสินใจแล้ว\n\n**2026-10-24 (ผู้ใช้, ตอนเริ่มขั้นที่ 4):**\n\n1. **ทุกหลักสูตร** ของภาควิชาใน **หนึ่ง** โปรไฟล์ (ค.บ., เทียบโอน, ศษ.ม., ปร.ด.) → แท็บพื้นที่ทำงาน = หลักสูตร × ชั้นปี\n2. เวลาว่าง **ครั้งเดียวต่อคน** (ใช้ร่วมทุกภาควิชา) · หัวหน้าเห็น \"ไม่ว่างในภาควิชาอื่น\"\n3. บทบาท **ASSISTANT (ผู้ช่วย):** ใช้หน้าโปรไฟล์เหมือนหัวหน้า แต่มีหัวหน้าเท่านั้นที่เผยแพร่ได้\n\n**2026-10-24:** ไม่มีลิงก์สาธารณะสำหรับนักศึกษา อาจารย์แจกตารางที่พิมพ์ / PDF ให้นักศึกษาเอง\n"}, {"g": "ฉบับแปลไทย (ขั้น 1-4)", "id": "th-4", "t": "4 User flows", "p": "th/4-user-flows.md", "md": "# 4 User flows\n\nร่าง 2026-10-24 · เส้นทางคลิกทีละขั้นของแต่ละงาน พร้อมสิ่งที่เกิดเมื่อผิดพลาด\n\nสร้างจาก: `2-user-journeys` (ขั้น A/B/C) · `3-sitemap` (เลขหน้า) · `tech-stack-list.txt` (การตัดสินใจ)\n\n## วิธีอ่าน\n\n| สัญลักษณ์ | ความหมาย |\n|---|---|\n| `[หน้า]` | หน้าที่เปิดอยู่ (เลขหน้าตาม sitemap) |\n| `(การกระทำ)` | สิ่งที่ผู้ใช้ทำ |\n| `<คำถาม?>` | จุดแยกเส้นทาง → ใช่ / ไม่ |\n| ==> | ผลลัพธ์ปลายทาง |\n| **!!** | ข้อผิดพลาดหรือเส้นทางปัญหา |\n\n**บทบาท:** **ADMIN** = ผู้ดูแลสถาบัน · **HEAD** = หัวหน้าภาควิชา · **ASSISTANT** = ผู้ช่วย (ใช้หน้าของหัวหน้า แต่เผยแพร่ไม่ได้) · **TEACHER** = อาจารย์ คนเดียวถือได้หลายบทบาทในต่างภาควิชา (ตัวสลับภาควิชา)\n\n> **ตัดสินใจเมื่อเริ่มขั้นนี้ (2026-10-24):** ทุกหลักสูตรของภาควิชาใน **หนึ่ง** โปรไฟล์ (แท็บ = หลักสูตร × ชั้นปี) · เวลาว่าง **ครั้งเดียวต่อคน** · มีบทบาท **ASSISTANT**\n\n## สารบัญ\n\n| Flow | งาน | ผู้ทำ | เส้นทาง |\n|:-:|---|---|---|\n| F1 | ตั้งค่าสถาบัน | ADMIN | C1-C2 |\n| F2 | เข้าร่วมด้วยคำเชิญ | HEAD / ASSISTANT / TEACHER | A1, B1 |\n| F3 | เริ่มตารางเรียนภาคนี้ | HEAD / ASSISTANT | A1-A3 |\n| F4 | อัปโหลดและอ่านไฟล์หลักสูตร | HEAD / ASSISTANT | A3-A4 |\n| F5 | รอบเวลาว่าง | HEAD เปิด · TEACHER ตอบ | A5, B2 |\n| F6 | แก้ปัญหาจากข้อมูลอาจารย์ | HEAD · TEACHER | A6, B3 |\n| F7 | กฎ ตรวจ สร้าง จัดตาราง | HEAD / ASSISTANT | A7-A8 |\n| F8 | ห้องและอาจารย์ | HEAD / ASSISTANT | A9 |\n| F9 | อาจารย์ตรวจทานและการเปลี่ยนแปลง | HEAD · TEACHER | A10, B4 |\n| F10 | เผยแพร่และเปลี่ยนภายหลัง | HEAD เท่านั้น | A11-A12, B5 |\n| F11 | อนุมัติรูปแบบใหม่ | ADMIN | จาก F4 |\n| F12 | มอบงานให้ผู้ช่วย | HEAD | บทบาทใหม่ |\n\n---\n\n## F1 ตั้งค่าสถาบัน\n\n**ผู้ทำ** ADMIN (ครั้งเดียว) · **เส้นทาง** C1-C2\n\n1. แอดมินเซิร์ฟเวอร์รัน `docker compose up` → **[0.0 ตั้งค่าครั้งแรก]**\n2. (ชื่อสถาบัน, ภาษา, บัญชีผู้ดูแลคนแรก) → **[3.1 หน้าแรกผู้ดูแล]**\n3. **[3.4 ปฏิทินการศึกษา]** (ภาคเรียนของปีนี้: วันเริ่ม / สิ้นสุด วันหยุด)\n4. **[3.2 ภาควิชา & หัวหน้า]** (เพิ่มภาควิชา) → (เชิญหัวหน้าทางอีเมล)\n   - ตั้งเซิร์ฟเวอร์อีเมลใน 3.6 แล้ว? → **ใช่:** ส่งอีเมลเชิญ · **ไม่:** หน้าแสดง **ลิงก์เชิญ** ให้คัดลอกไปส่งเอง\n5. **[3.3 ห้องร่วม]** (ห้องที่หลายภาควิชาใช้: ชื่อ ประเภท ที่นั่ง)\n\n**==>** สถาบันพร้อม · 3.1 แสดงแต่ละภาควิชา: เชิญแล้ว / เข้าร่วมแล้ว / มีโปรไฟล์ / เผยแพร่แล้ว\n\n**!!** หัวหน้าไม่ยอมรับเชิญ → 3.2 แสดง \"เชิญเมื่อ 7 วันก่อน\" + (ส่งอีกครั้ง)\n\n## F2 เข้าร่วมด้วยคำเชิญ\n\n**ผู้ทำ** HEAD / ASSISTANT / TEACHER · **เส้นทาง** A1, B1\n\n(เปิดลิงก์เชิญ) → **[0.3 รับคำเชิญ]**\n\n| มีบัญชีอยู่แล้ว (ภาควิชาอื่น)? | ทำ |\n|---|---|\n| ใช่ | (ล็อกอิน) → ภาควิชาใหม่ถูกเพิ่มในตัวสลับภาควิชา |\n| ไม่ | (ตั้งชื่อ + รหัสผ่าน) → สร้างบัญชี |\n\n**==>** ไปที่หน้าแรกของบทบาทที่ถูกเชิญ (2.1 หรือ 4.1) · ครั้งแรก: แนะนำ 3 ขั้น\n\n**!!** ลิงก์หมดอายุ → \"ขอให้หัวหน้า / ผู้ดูแลส่งใหม่\" (ไม่สร้างบัญชี)\n\n## F3 เริ่มตารางเรียนภาคนี้\n\n**ผู้ทำ** HEAD / ASSISTANT · **เส้นทาง** A1-A3\n\n1. **[2.1 หน้าแรก]** (\"เริ่มตารางเรียนภาคนี้\")\n2. มีโปรไฟล์ของภาคก่อนไหม?\n   - **ใช่** → **[2.2 โปรไฟล์]** (**คัดลอกจากภาคก่อน**) เก็บบุคลากร ห้อง กฎ หลักสูตร · ชั้นปีของแต่ละหลักสูตรเลื่อนขึ้นหนึ่งปี · เพิ่มกลุ่มปี 1 ใหม่\n   - **ไม่** → **[2.2 โปรไฟล์]** (ใหม่)\n3. **[2.4 ขั้น 1 ตั้งค่า]** เลือกภาคเรียนจากปฏิทินการศึกษา (ไม่เอาจาก PDF)\n4. เลือกหลักสูตรที่สอนในภาคนี้ (ค.บ. / เทียบโอน / ศษ.ม. / ปร.ด. …)\n5. ต่อแต่ละหลักสูตร: อัปโหลดไฟล์หลักสูตร (PDF, Word, Excel, สแกน, รูปถ่าย) → **F4**\n\n**==>** พื้นที่ทำงานแสดงหนึ่งแท็บต่อ หลักสูตร × ชั้นปี ทุกขั้น \"ยังไม่เริ่ม\"\n\n**!!** ภาคเรียนไม่อยู่ในปฏิทิน → \"ขอให้ผู้ดูแลเพิ่ม\" (3.4) หัวหน้าพิมพ์วันที่เองไม่ได้\n\n## F4 อัปโหลดและอ่านไฟล์หลักสูตร\n\n**ผู้ทำ** HEAD / ASSISTANT · **เส้นทาง** A3-A4\n\n**[2.4 ขั้น 1]** (อัปโหลด) → ระบบเก็บ `og_upload` (ไฟล์ตามที่ให้มา **ไม่เคยแก้**)\n\n**ไฟล์ชนิดไหน** (ดูจากเนื้อหา ไม่ใช่ชื่อ):\n\n| ชนิด | ทำ |\n|---|---|\n| PDF ที่มีข้อความ / Word / Excel | แปลง → normalise → `normalised_upload` |\n| สแกน / รูปถ่าย / หน้า PDF ที่ไม่มีข้อความ | OCR + glyph tool → `normalised_upload` |\n| **!!** ไม่ใช่เอกสาร (ว่าง เสีย zip PDF ที่ล็อก) | \"อ่านไฟล์นี้ไม่ได้: <เหตุผล>\" · ไม่บันทึกอะไร |\n\n**เลย์เอาต์เป็นรูปแบบที่รู้จักไหม:**\n\n- **ใช่** → การ์ด \"สิ่งที่เราพบ\": รูปแบบ · เวอร์ชันหลักสูตร · ชั้นปี · ภาคเรียน · รูปแบบหน่วยกิต แต่ละค่ามีหน้าที่มา → (ยืนยัน) หรือ (ไม่ถูก → เลือกรูปแบบอื่น)\n- **ไม่** → **[2.4.1 ตั้งค่ารูปแบบ]** (ชี้ว่าคอลัมน์ไหนคือรหัส / ชื่อ / หน่วยกิต บนหน้าตัวอย่าง) → บันทึกเป็น format definition **\"unverified\"** → ADMIN เห็นใน 3.5 → **F11**\n\n**[2.4 ขั้น 2 ตรวจข้อมูล]** ต่อแท็บ หลักสูตร × ชั้นปี: ตาราง \\| ผังกระบวนวิชา\n\n- ค่าที่ตัวอ่าน **มั่นใจ**: ปกติ\n- ค่าที่ **ไม่มั่นใจ**: **สีแดง** พร้อมเหตุผล + ภาพครอบตัดของหน้า\n- (แถวแดงถัดไป) → PDF เปิดข้างตาราง ไฮไลต์ตำแหน่ง → (แก้ค่า) หรือ (ถูกแล้ว)\n- ยังมีแดงเหลือ? → **ใช่:** \"ไปต่อ\" ยังล็อก (\"เหลือ 3 ค่าที่ต้องการคุณ\") · **ไม่:** ขั้น 2 เสร็จ\n\n**==>** ทุกแถวของแผนมี: หลักสูตร · ชั้นปี · ภาคเรียน · รหัส (หรือ \"slot\") · ชื่อ · หน่วยกิต L-P-S\n\n**!!** วิชาเดียวกันอ่านได้ต่างกันระหว่าง \"แผน\" กับ \"รายการวิชา\" → แดง แสดงสองค่า หัวหน้าเลือก\n**!!** อัปโหลดไฟล์ใหม่แทนที่ไฟล์เดิม → ขั้นหลังจากนั้น \"ล้าสมัย\" **เฉพาะหลักสูตรนั้น**\n\n## F5 รอบเวลาว่าง\n\n**ผู้ทำ** HEAD/ASSISTANT เปิดรอบ · TEACHER ตอบ · **เส้นทาง** A5, B2\n\n**HEAD** **[2.4 ขั้น 3]**: (เลือกอาจารย์ของภาคนี้จาก 2.3) (ตั้งกำหนดส่ง) (เปิดรอบ) → อาจารย์แต่ละคนได้แจ้งเตือน (1.1 + อีเมลถ้าตั้ง)\n\n**TEACHER** **[4.1 หน้าแรก]** \"ส่งเวลาว่างภายใน 5 วัน\" → **[4.2 เวลาว่างของฉัน]**\n\n| ภาคนี้กรอกให้ภาควิชาอื่นไปแล้ว? | ทำ |\n|---|---|\n| ใช่ | แสดงตารางอันเดิม (ครั้งเดียวต่อคน) มีแต่ **การจัดอันดับวิชา** ที่แยกตามภาควิชา |\n| ไม่ | (คลิกเวลาไม่ว่างบนตารางรายสัปดาห์) (จัดอันดับวิชาที่ภาควิชานี้เปิด) (ชั่วโมงสูงสุด / วัน) |\n\n(ส่ง) → ใบรับ: \"ส่งแล้ว หัวหน้าของคุณเห็น: …\" (แก้ได้จนถึงกำหนดส่ง)\n\n**HEAD ติดตาม:** กระดานสถานะ ส่งแล้ว / ยังไม่ส่ง / ล่าช้า → (ส่งเตือน) · เลยกำหนดแล้วมีคนขาด? → (กรอกแทน) หรือ (ทำเครื่องหมาย \"ว่างได้ทุกเวลา\")\n\n**==>** ขั้น 3 เสร็จเมื่ออาจารย์ที่เลือกทุกคนมีคำตอบ\n\n**!!** เวลาไม่ว่างของอาจารย์เปลี่ยนหลังกำหนด → ขอให้หัวหน้า · หัวหน้าแก้ (บันทึกไว้)\n\n## F6 แก้ปัญหาจากข้อมูลอาจารย์\n\n**ผู้ทำ** HEAD/ASSISTANT · TEACHER ให้ความเห็น · **เส้นทาง** A6, B3\n\n**[2.4 ขั้น 4]** ระบบทำรายการปัญหาเอง:\n\n| ชนิด | ปัญหา | ทางแก้ |\n|---|---|---|\n| 🔴 BLOCKER | วิชาที่ไม่มีใครสอนได้ | มอบวิชาให้อาจารย์ · ทำเครื่องหมาย \"อาจารย์ภายนอก / ต้องจ้าง\" · แบ่งกลุ่ม |\n| 🔴 BLOCKER | อาจารย์สองคนอยากสอนวิชาเดียวกัน | เลือกคนเดียว · แบ่งกลุ่มให้ทั้งสอง |\n| 🟠 WARNING | วิชาของอาจารย์ใช้ชั่วโมงมากกว่าที่ว่าง | แก้ · ยอมรับพร้อมหมายเหตุ |\n\n(เปิดรายการ) → เธรดความเห็น (อาจารย์เห็นใน 4.3 และตอบที่นั่น)\n\nมีอะไรยังไม่ตัดสินใจ? → **ใช่:** ขั้น 4 ยังเปิด · **ไม่:** เสร็จ\n\n**==>** ทุกวิชามีอาจารย์ (หรืออาจารย์ภายนอกที่ทำเครื่องหมาย) · ทุกการตัดสินใจบันทึก: **ใคร เมื่อไหร่ ทำไม**\n\n## F7 กฎ ตรวจ สร้าง จัดตาราง\n\n**ผู้ทำ** HEAD/ASSISTANT · **เส้นทาง** A7-A8\n\n### ขั้น 5: กฎ\n\n- ตารางเวลา (จากโปรไฟล์) · กลุ่มต่อ หลักสูตร × ชั้นปี · จำนวนห้อง · วิชาเลือก\n- วิชาเลือกแต่ละช่อง → **(Schedule: เลือกวิชา)** หรือ **(Reserve: เก็บชั่วโมงไว้ว่าง)**\n- กฎ soft: เปิด/ปิด + น้ำหนัก · กฎ hard (จากหลักสูตร) แสดงแต่แก้ไม่ได้\n- **(Check)** → รายงาน pre-check: OK / ปัญหา / กฎเสี่ยง\n\n| เป็นไปไม่ได้เมื่อนับดู? | ทำ |\n|---|---|\n| ใช่ | เหตุผล + วิธีแก้ใกล้สุด (\"ปี 2 ต้องการ 38 ชม. สัปดาห์มี 30\") → กลับไปกฎ |\n| ไม่ | **(Acknowledge)** → Generate ปลดล็อก |\n\n### ขั้น 6: สร้างและจัดตาราง\n\n1. **(Generate)** → ได้ตัวเลือกที่ดีที่สุด + คะแนนคุณภาพ\n2. ลงครบทุกคาบ? → **ใช่:** ตารางเรียน · **ไม่:** **ตารางบางส่วน + ถาด** (แต่ละคาบมีเหตุผล + วิธีแก้ใกล้สุด)\n3. (ลากคาบ) → ตรวจสดตอนวาง: OK หรือช่องแดง + เหตุผล\n4. (ปักหมุดคาบที่ตกลง) · (รันใหม่รอบหมุด: เฉพาะ หลักสูตร × ชั้นปีนี้ที่ขยับ)\n5. อาจารย์ที่ไม่ว่างใน **ภาควิชาอื่น** แสดงเป็นช่องเทา \"ไม่ว่างที่อื่น\"\n\n**==>** ทุกคาบมีเวลา · ไม่ฝ่าฝืนกฎ hard\n\n**!!** FET ค้างหรือแครช → \"ตัวจัดตารางหยุด: <เหตุผล>\" · **เก็บผลดีล่าสุดไว้**\n\n## F8 ห้องและอาจารย์\n\n**ผู้ทำ** HEAD/ASSISTANT · **เส้นทาง** A9\n\n1. **[2.4 ขั้น 7]** เวลาล็อกแล้ว → วางห้องอัตโนมัติ (เฉพาะห้องของ FET)\n2. ต่อแต่ละคาบ: (ยืนยันอาจารย์) → ตรวจการชนต่อการมอบหมาย\n   - ห้องร่วมถูกภาควิชาอื่นจองแล้ว? → **แดงที่คาบนั้น** + \"จองโดย <ภาควิชา>\"\n3. พรีวิว A4 ด้านล่างเปลี่ยนสด (หนึ่งตารางต่อกลุ่ม · ต่ออาจารย์ ต่อห้องได้ด้วย)\n\n**==>** ทุกคาบมีห้องและอาจารย์ · พรีวิวดูเหมือนกระดาษที่พิมพ์\n\n## F9 อาจารย์ตรวจทานและการเปลี่ยนแปลง\n\n**ผู้ทำ** HEAD/ASSISTANT · TEACHER · **เส้นทาง** A10, B4\n\n1. **HEAD** **[2.4 ขั้น 8]** (ส่งตรวจทาน) → อาจารย์ได้แจ้งเตือน\n2. **TEACHER** **[4.4 ตารางของฉัน]** (เฉพาะคาบของฉัน ติดป้าย **DRAFT**)\n\n| อาจารย์พอใจ? | ทำ |\n|---|---|\n| ใช่ | ไม่ต้องทำอะไร |\n| ไม่ | (ขอเปลี่ยน: คาบไหน อะไร ทำไม) → **[4.5 คำขอของฉัน]** \"รอ\" |\n\n3. **HEAD** เห็นรายการคำขอ: ใคร · อะไร · เหตุผล · **ผลกระทบ** (\"นี่จะย้ายอีก 2 คาบ\")\n   - **(อนุมัติ)** → รันใหม่แบบน้อยที่สุด อย่างอื่นปักหมุด → แจ้งอาจารย์ + เห็นเก่า / ใหม่\n   - **(ปฏิเสธพร้อมหมายเหตุ)** → แจ้งอาจารย์\n   - **คุยตัวต่อตัว:** (direct edit บนตาราง) + \"ตกลงกับ ___\" → ตรวจสด → อาจารย์ได้ \"แก้โดย <หัวหน้า>: <หมายเหตุ>\" พร้อมเก่า / ใหม่\n\n**==>** ไม่มีคำขอค้าง (หรือหัวหน้าตัดสินใจเผยแพร่เลย คำขอที่ค้างยังเห็นอยู่)\n\n## F10 เผยแพร่และเปลี่ยนภายหลัง\n\n**ผู้ทำ** HEAD เท่านั้น · **เส้นทาง** A11-A12, B5\n\n1. **[2.4 ขั้น 9]** (เผยแพร่)\n   - **ASSISTANT?** → \"มีแต่หัวหน้าที่เผยแพร่ได้\" + (ขอให้หัวหน้า) → หัวหน้าได้แจ้งเตือน\n2. → **เวอร์ชัน 1 ล็อก** · แจ้งอาจารย์ทุกคน · (ดาวน์โหลด / พิมพ์) ต่อกลุ่ม อาจารย์ ห้อง\n\n**ภายหลัง:**\n\n1. **[2.4.2 เวอร์ชัน]** (เริ่มการเปลี่ยนแปลง) → ร่างเวอร์ชันใหม่ (เวอร์ชันที่เผยแพร่ยังใช้ได้)\n2. (เปลี่ยน) → ตรวจผลกระทบ + เปลี่ยนน้อยที่สุด → (เผยแพร่) → **เวอร์ชัน 2** แจ้งเฉพาะอาจารย์ที่ได้รับผลกระทบ\n\n**==>** นักศึกษาได้ตารางใหม่จากอาจารย์ (ไม่มีล็อกอินนักศึกษา ไม่มีลิงก์สาธารณะ)\n\n## F11 อนุมัติรูปแบบใหม่\n\n**ผู้ทำ** ADMIN · **จาก** F4\n\n**[3.5 รูปแบบหลักสูตร]** \"1 รูปแบบ unverified จาก <ภาควิชา>\" → (เปิด) → หน้าตัวอย่างพร้อมคอลัมน์ที่หัวหน้าทำเครื่องหมาย และสิ่งที่อ่านได้จาก 3 หน้าอื่น\n\n| ดูถูกต้อง? | ทำ |\n|---|---|\n| ใช่ | **(อนุมัติ)** ทุกภาควิชาในสถาบันใช้ได้ · **(ส่งออก)** เพื่อส่งให้โครงการ |\n| ไม่ | **(ส่งกลับพร้อมหมายเหตุ)** → หัวหน้าเห็นในขั้น 1 |\n\n## F12 มอบงานให้ผู้ช่วย\n\n**ผู้ทำ** HEAD · **บทบาทใหม่**\n\n**[2.3 บุคลากร & ห้อง]** (เชิญใครสักคนเป็น ASSISTANT) → F2 สำหรับเขา\n\n| ผู้ช่วยทำได้ | ผู้ช่วยทำไม่ได้ |\n|---|---|\n| เห็นหน้าแรก โปรไฟล์ และพื้นที่ทำงานเหมือนหัวหน้า · ทำขั้น 1-8 | เผยแพร่ (F10) · ลบหัวหน้า · เชิญผู้ช่วยคนอื่น |\n\n**==>** ทุกการเปลี่ยนแปลงยังบันทึก **ใคร** ทำ (หัวหน้าหรือผู้ช่วย)\n\n---\n\n## ยังเปิดอยู่ (ตัดสินใจทีหลัง ไม่ขวางการไหลของงาน)\n\n- วิธีล็อกอิน (เสนอบัญชีในตัว) และการแจ้งเตือน (เสนอในแอป + อีเมลไม่บังคับ)\n- ผู้ช่วยทำอะไรได้ใน 2.3 บุคลากร & ห้อง (เชิญอาจารย์ได้ไหม? เสนอ: ได้)\n"}, {"g": "ต้นฉบับ (อังกฤษ/ไทยปน)", "id": "o-start", "t": "START-HERE", "p": "START-HERE.txt", "md": "```text\nTIMETABLE SYSTEM - DESIGN, STEPS 1 TO 5\n=======================================\nAn automatic class-timetable system for Thai universities: it reads the curriculum PDF (มคอ.2),\nheads and teachers plan the term together, and it makes a clash-free timetable to print.\nOpen source; each institution installs it on its own server. These are the design steps, before any code.\n\nHOW TO LOOK AT IT (no install needed)\n  - pictures: double-click any .png\n  - the prototype: double-click 5-wireframes/prototype.html (opens in your browser, works offline)\n  - text files (.txt): any text editor\n\nREAD IN THIS ORDER\n  1-users-and-goals/   who uses it and what they need            -> users-goals-map.png\n  2-user-journeys/     what each user goes through in one term   -> user-journeys.txt\n  3-sitemap/           every page, grouped by who sees it        -> sitemap-tree.png (simple), sitemap.png (detailed)\n  4-user-flows/        the click-by-click path of 12 tasks       -> flows/F1.png ... F12.png (text: user-flows.txt)\n  5-wireframes/        rough layouts of 28 screens, clickable    -> prototype.html  (\"view as\" switches the user)\n\nGOOD TO KNOW\n  - the wireframes are grey on purpose: they show layout and flow, not the final look\n  - the sample data is a real curriculum (KMUTNB Computer Education); people's names are made up\n  - some files mention tech-stack-list.txt - that is the full technical spec, not included here\n  - the .py files only redraw the pictures; you do not need them\n\nWHAT WOULD HELP MOST\n  try the prototype as a department head and as a teacher, and note anything confusing:\n  a step you could not find, a word you did not understand, or something you expected to work differently\n\n```"}, {"g": "ต้นฉบับ (อังกฤษ/ไทยปน)", "id": "o-1", "t": "1 Users and goals", "p": "1-users-and-goals/users-and-goals.txt", "md": "```text\nUSERS AND GOALS - Automatic Class Timetable System\n==================================================\nVersion: 2026-10-24 (stage 1 of the web design process: users and goals)\nRelated files in this folder:\n  tech-stack-list.txt        full spec (tech stack, flow, decisions) - its USERS AND GOALS section is the source of this file\n  users-goals-map.svg / .png diagram: users -> goals -> tech stack, and the parts that belong to both\n\n--------------------------------------------------\nVISION\n--------------------------------------------------\nOne system for every department, versatile enough for institutions across the whole country (FINAL product).\nBuild a local demo first. SELF-HOSTED + OPEN SOURCE (2026-10-24): each institution installs its own copy on its own server.\n\nWho uses it: institution personnel only.\nStudents NEVER log in - they only receive the finished timetable (print / file).\n\n--------------------------------------------------\nTHE PROBLEM TODAY\n--------------------------------------------------\n- Timetables are made by hand in Excel and on paper. Nothing is automated.\n- It takes 3 days to a week per term.\n- Most of that time is teachers talking to each other: who can teach when, and who teaches which subject.\n- Changes keep coming even after the \"final\" table is made.\n\n--------------------------------------------------\nUSERS\n--------------------------------------------------\nDepartment head (MAIN user)\n  What they do : build the timetable for the chosen years, once per term; run the teacher availability round;\n                 approve changes; publish and print\n  Uses         : every page of the web app\n  Account      : invited by the institution admin\n\nTeacher\n  What they do : give busy times, subjects they can / want to teach, max hours per day;\n                 check their own timetable; send change requests\n  Uses         : my availability | my timetable | my requests (sees ONLY their own timetable)\n  Account      : invited by a department head; one account can belong to several departments\n\nInstitution admin\n  What they do : create departments, invite department heads, enter rooms shared by several departments\n                 ALSO runs the institution's own install (self-hosted, 2026-10-24): updates, backups,\n                 mail settings, approving new curriculum formats\n  Uses         : admin pages (departments, heads, shared rooms, formats, system)\n  Account      : created at install (first-run setup page)\n\n(No platform admin: each institution runs its own copy. The open-source maintainers ship the code and the\n shared curriculum formats, but never see any institution's data.)\n\nOther departments\n  What they do : the same as a department head, in their own profiles\n  Why it matters: they share rooms (and some teachers) - their published timetables book those rooms\n\nStudents (NOT a user of the system)\n  What they get: the published timetable of their group (A4 print / file)\n  Account      : none, ever\n\n--------------------------------------------------\nGOALS (of the department head)               -> served by (tech stack)\n--------------------------------------------------\nG1 A clash-free timetable for every group     -> FET solver, pre-check, our own rule checker (core lib)\nG2 Much faster than 3 days - 1 week           -> availability round (web + project service), FET < 1 s,\n                                                 \"copy from last term\", N candidate timetables\nG3 Stay in control                            -> arrange page (React + dnd-kit), live check (POST /api/check),\n   (move classes, pin agreed ones, electives)    pins + re-run around pins (FET locks), Schedule / Reserve electives\nG4 Trust the data from the PDF                -> import service (pdftotext + curriculum format readers),\n                                                 review page (table + flow chart), every value links to its PDF page\nG5 An official-looking A4 print               -> print preview (web), Thai font (Noto Sans Thai / Sarabun), PDF export\nG6 Reuse work next term                       -> storage (PostgreSQL), profile manager, copy from last term\n\nGoals of the teacher\nT1 Their busy times and wishes are respected  -> availability grid, teacher rules in FET (now CORE, not later)\nT2 Know about changes that affect them        -> review state, change requests, notifications, version history\n\nGoal of the institution admin\nI1 Departments do not double-book shared rooms -> global rooms + room bookings from published timetables\n\n--------------------------------------------------\nSUCCESS MEASURES\n--------------------------------------------------\n- Full term from PDF to print in under 30 minutes of work (first target; aim: as fast as possible)\n- Zero hard clashes in a saved timetable\n- Every class placed, or listed as unplaced with a reason and the nearest fix\n- No hand-editing of files\n- Measured inside the app: time per step, number of manual moves, number of FET runs,\n  quality score (soft rules kept + head's 1-5 rating) -> benchmark later to find the sweet spot of speed vs quality\n\n--------------------------------------------------\nTHE SYSTEM MUST NEVER                         -> how the tech stack guarantees it\n--------------------------------------------------\nN1 Change a timetable without the user asking -> only the project service writes; every change logged; versions kept\nN2 Show teachers' data outside the institution -> login + roles; each institution runs its OWN install, so its data\n                                                 never leaves its server (PostgreSQL in Docker); Thailand PDPA rules\nN3 Let students in                            -> no student role exists\n\n--------------------------------------------------\nOUT OF SCOPE (for now)\n--------------------------------------------------\n- Students choosing electives in the system (Reserve keeps the time free for them)\n- Exam timetables\n\n--------------------------------------------------\nPARTS THAT BELONG TO BOTH (users & goals AND tech stack)\n--------------------------------------------------\nThese are features a user asked for that also need a specific piece of the tech stack:\n  Login + roles            users: all personnel     tech: built-in accounts (PROPOSED), roles checked by the project service\n  Availability round       users: head + teachers   tech: web pages + project service + teacher rules in FET\n  Live check on drop       users: head              tech: dnd-kit + POST /api/check + core lib checker\n  Print preview (A4)       users: head -> students  tech: web print layout + Thai font\n  Versions + change log    users: head + teachers   tech: project service (single writer) + storage\n  Copy from last term      users: head              tech: profile manager + storage\n\n--------------------------------------------------\nGAPS FOUND WHILE WRITING THIS\n--------------------------------------------------\n- The tech stack has no AUTH (login) component yet - needed for G2/T1/N2. To choose.\n- Notifications (email / in-app) are not in the tech stack yet - needed for T2.\n\n```"}, {"g": "ต้นฉบับ (อังกฤษ/ไทยปน)", "id": "o-2", "t": "2 User journeys", "p": "2-user-journeys/user-journeys.txt", "md": "```text\n\n--------------------------------------------------\nUSER JOURNEYS (draft 2026-10-23; revision 1 2026-10-24 after user feedback) - stage by stage: DOES | SEES (page) | THINKS / FEELS | PAIN RISK | WHAT WE DO\n--------------------------------------------------\nJOURNEY A - DEPARTMENT HEAD (one term)\n\nA1 Get access\n   DOES   opens the invite email from the institution admin, sets a password, logs in\n   SEES   login page -> home\n   FEELS  \"Is this hard to learn?\"\n   RISK   gives up if the first screen is confusing\n   WE DO  home shows one clear button: \"Start this term's timetable\"; a 3-step intro the first time\n   STATUS OK (user, 2026-10-24)\n\nA2 Profile manager\n   DOES   opens last term's profile, or creates a new one\n   SEES   list of recent profiles (name, curriculum format, term, status: draft / review / published)\n   FEELS  \"I don't want to type everything again\"\n   RISK   re-entering teachers and rooms every term\n   WE DO  \"Copy from last term\" keeps teachers, rooms, rules; only the new PDF/term changes\n   STATUS OK - good enough for now\n\nA3 Create profile + basic settings   (REVISED 2026-10-24: the user no longer picks a format from a preset list)\n   DOES   names it, picks the term; uploads the curriculum PDF(s) straight away;\n          adds teachers and rooms now or later (room COUNTS required before scheduling)\n   SEES   short form (name, term) -> upload -> \"what we found\" card:\n          format, curriculum version, years + terms found, credit pattern, weeks per term - each with the PDF page it came from\n   FEELS  \"Which format is mine?\" -> now: \"Is what it found right?\"\n   RISK   wrong preset chosen = wrong settings everywhere after; a NEW curriculum type the system doesn't know yet\n   WE DO  DETECT FIRST, CONFIRM AFTER: the system reads the PDF and FILLS the settings; the user only confirms or corrects\n          each setting shows its evidence (page + the text it matched), so a wrong value is easy to spot\n          unknown layout -> never guessed silently -> guided setup: user points at a sample page\n            (which column is code / name / credits / hours), saved as a new FORMAT DEFINITION\n          FORMAT DEFINITION = data (a settings file), not code: a curriculum that only changes its layout\n            needs no programmer and no service update; only a truly new credit system needs new code\n          a new format starts as \"unverified\" until the platform admin checks it, then other institutions can use it\n\nA4 Upload PDF + review data\n   DOES   uploads the curriculum PDF, checks subjects in the table and the flow chart, fixes red rows\n   SEES   review page (table | flow chart), faulty rows in red with the reason\n   FEELS  \"Did it read my PDF correctly?\"\n   RISK   trusting wrong hours or credits; mismatch with chosen format\n   WE DO  every value links to its PDF page; mismatch warning; nothing continues while red rows remain\n          FAST CHECK (user, 2026-10-24): click any value -> the PDF opens beside the table at that page,\n            with the exact spot highlighted; \"next red row\" button jumps through the faults one by one\n\nA5 Availability round\n   DOES   invites teachers who are not in yet, opens the round with a deadline, watches who submitted\n   SEES   status board (submitted / not yet / late), reminder button\n   FEELS  \"Chasing people is the slow part\"\n   RISK   teachers miss the deadline\n   WE DO  automatic reminders; after the deadline the head fills missing ones or marks \"available any time\"\n   STATUS OK\n\nA6 Resolve teacher input\n   DOES   fixes the flagged items: subject nobody can teach, two teachers want one subject, overloaded teacher\n   SEES   checklist of problems, each with a comment thread\n   FEELS  \"This used to be days of talking\"\n   RISK   endless discussion\n   WE DO  the system builds the problem list ITSELF from what teachers submitted (nobody has to spot them)\n          two kinds of item:\n            BLOCKER  scheduling cannot work until it is fixed\n                     - a subject no teacher can teach  -> head assigns a teacher (or marks \"outside teacher / to hire\")\n                     - two teachers want one subject   -> head picks one, or splits groups between them\n            WARNING  it can run, but someone may be unhappy\n                     - a teacher's subjects need more hours than their free time -> head changes it, or ACCEPTS with a note\n          each item has a comment thread; it closes only with a decision, which is logged (who, when, why)\n          to continue: zero blockers open, and every warning fixed or accepted (\"the list must be empty\" = nothing undecided)\n\nA7 Rules + electives\n   DOES   checks the time grid, groups, room counts, electives (Schedule / Reserve), rule weights\n   SEES   rules page; hard rules shown greyed (from the curriculum), soft rules with weight levels\n   FEELS  \"What do these rules mean?\"\n   RISK   making everything hard -> nothing fits\n   WE DO  plain-language rule names, profile defaults, pre-check explains impossible cases before running\n          PRE-CHECK REPORT (user, 2026-10-24): after the check, a short report (OK / problems / risky rules)\n            that the head must ACKNOWLEDGE before Generate unlocks; the acknowledgement is logged with the run\n\nA8 Generate + arrange\n   DOES   presses Generate, compares the best candidates, drags classes, pins agreed ones\n   SEES   timetable grid, tray of unplaced classes, red cells with reasons, quality score\n   FEELS  \"Can I trust this? Can I fix it myself?\"\n   RISK   a partial result feels like failure\n   WE DO  partial result + tray + reason + nearest fix; live check on every drop; re-run around pins\n   STATUS OK\n\nA9 Rooms + teachers + preview\n   DOES   confirms rooms (FET picks), confirms teacher per class, checks the A4 preview\n   SEES   assignment page with live A4 preview below\n   FEELS  \"Does it look like the real paper?\"\n   RISK   clashes found late\n   WE DO  clash shown on the exact class; preview identical to the print\n   STATUS OK\n\nA10 Review by teachers\n   DOES   sends the draft to REVIEW; reads change requests\n   SEES   change-request list: who, what, reason, IMPACT (what would move)\n   FEELS  \"Every change breaks something else\"\n   RISK   one change reshuffles the whole table\n   WE DO  minimal-change re-run (everything else pinned); approve / reject with a note\n          TALKED IN PERSON (user, 2026-10-24): heads and teachers often agree small things face to face.\n            The head must NOT have to file a request or walk the whole list for that:\n            DIRECT EDIT - in REVIEW the head can move a class / swap a teacher directly on the grid;\n              same live check + impact preview (\"this also moves 2 classes\"), one field: \"agreed with ___\" (optional note)\n            it is logged as a change like any other, and the affected teacher(s) are notified with the note\n            small edits that touch nothing else apply at once; edits that move other classes ask \"apply?\" first\n            formal requests stay for teachers who did NOT talk to the head, or for big changes\n\nA11 Publish + print\n   DOES   publishes, prints / downloads per group (and per teacher, per room)\n   SEES   finish page: whole result, version number + date\n   FEELS  \"Done - and I can prove it is clash-free\"\n   WE DO  locked version, change log, students get the print (they never log in)\n   STATUS OK\n\nA12 After publishing (any time in the term)\n   DOES   handles a late change request -> new version\n   WE DO  same impact check + minimal change; affected teachers notified; old versions kept\n          direct edit (see A10) also works here, but always creates a new version\n   STATUS OK\n\nJOURNEY B - TEACHER\n\nB1 Invited    opens invite link, sets password (or joins with an existing account if already in another department)\nB2 Submit     fills the weekly busy grid, ranks subjects they can teach, max hours per day; can edit until the deadline\n              FEELS \"Will my wishes be respected?\" -> WE DO show \"submitted\" receipt + what the head will see\nB3 Discuss    gets a comment on a flagged item (e.g. two people want one subject), answers inside the system\nB4 Review     sees ONLY their own timetable in REVIEW; sends a change request with a reason if needed\n              FEELS \"Is it worth asking?\" -> WE DO show the request status (waiting / approved / rejected + note)\n              if they agreed it in person, they don't file anything: they get a notice \"changed by <head>: <note>\"\n              and the old/new slot side by side, so they can see it matches what was agreed\nB5 Final      gets notified on publish and on any later change; downloads / prints their own timetable\nB2 also shows the blocker/warning items about THEM (from A6) so they know what the head is deciding\nSTATUS all B stages OK (user, 2026-10-24)\n\nJOURNEY C - INSTITUTION ADMIN (once, then rarely)\nC1 receives the institution account from the platform admin\nC2 creates departments, invites department heads, enters SHARED rooms (used by several departments)\nC3 later: adds/removes heads, sees which departments have published\nSTATUS all C stages OK\n\nPages this implies (input for the sitemap, next stage):\n  login | home | profile manager | create profile | upload + detect/confirm | review (table | flow chart | PDF side panel) |\n  format setup (unknown layout) | availability round | teacher input checklist |\n  rules | generate + arrange | rooms + teachers + preview | change requests | finish / publish |\n  teacher: my availability | my timetable | my requests | admin: departments | heads | shared rooms\n\n\n--------------------------------------------------\nPROFILE STRUCTURE - one PDF with many years (DECIDED 2026-10-24, user OK)\n--------------------------------------------------\nQuestion: a 5-year PDF -> one profile with 5 year sections, or split into 5 separate profiles?\nProposal: ONE profile per department per term, holding one YEAR PLAN per year being taught.\n\n  PROFILE  \"CED Computer Ed - term 1/2027\"        <- the thing that is reviewed, published, versioned\n    sources:  PDF 2564 (years 1-3)  |  PDF 2559 (year 4)     <- 1..n PDFs; a year can come from an older curriculum\n    shared:   teachers, rooms, time grid, rules\n    YEAR PLAN 1  (from 2564, term 1 subjects)  state: done\n    YEAR PLAN 2  (from 2564, term 1 subjects)  state: out of date\n    YEAR PLAN 3  ...\n    YEAR PLAN 4  (from 2559)\n    (year 5 = off-site teaching practice -> listed, nothing to schedule)\n\nWhy not split into 5 profiles:\n  - the SAME teachers and rooms serve all years at the SAME time. Split profiles would each think teacher X is free,\n    so clashes would only be found by cross-profile checks - the most fragile part.\n  - one review, one publish, one version for the whole department, instead of 5 that can drift apart.\n\nHow it keeps changes small and safe:\n  - each year plan has its own tab and its own state (done / out of date); editing year 2's data marks ONLY year 2 out of date\n  - re-run is per year: the other years are pinned, so their classes cannot move\n  - a year plan reads from exactly ONE curriculum version, so subjects are never mixed inside a year\n  - the user can schedule only some years now (Scope) and add the rest later\n  - \"Copy from last term\" copies the profile; each year plan moves up with its students\n\nThis changes an earlier decision in tech-stack-list.txt (\"one profile = one curriculum version\"):\n  now: one YEAR PLAN = one curriculum version; a profile may hold several versions.\n\n```"}, {"g": "ต้นฉบับ (อังกฤษ/ไทยปน)", "id": "o-3", "t": "3 Sitemap", "p": "3-sitemap/sitemap.txt", "md": "```text\n--------------------------------------------------\nSITEMAP (DONE 2026-10-24; tree diagram: sitemap-tree.png (make-sitemap-tree.py); detailed: sitemap.png (make-sitemap.py)) - every page, who sees it, how pages connect\nBuilt from 2-user-journeys/user-journeys.txt (A = head, B = teacher, C = institution admin)\n--------------------------------------------------\nMarks:  [A5] = journey stage the page serves   (step) = inside the profile step bar   * = new page, not in the journeys yet\n\n0. PUBLIC (not logged in)\n   0.0 First-run setup *            shown ONCE after install: institution name, first admin account, language;\n                                    then it disappears (self-hosted, 2026-10-24)\n   0.1 Login\n   0.2 Forgot / reset password\n   0.3 Accept invite [A1 B1]        set password, OR \"join with my existing account\" (already in another department)\n\n1. ON EVERY PAGE AFTER LOGIN (top bar)\n   - Department switcher            one person can be in several departments, and can be head in one, teacher in another\n   - Notifications bell -> 1.1\n   - Account menu -> 1.2, log out\n   1.1 Notifications *              invites, deadlines, reminders, \"changed by <head>: <note>\", published\n   1.2 My account *                 name, password, language (Thai / English), email settings\n\n2. DEPARTMENT HEAD\n   2.1 Home [A1]                    one big button \"Start this term's timetable\" (or \"Continue <profile>\");\n                                    below it: what needs me now (late teachers, open blockers, new requests)\n   2.2 Profiles [A2]                list: name, term, years, status (draft / review / published);\n                                    buttons: New | Copy from last term\n   2.3 Department people & rooms *  teachers of the department (invite, remove, see who joined) and the\n                                    department's own rooms (name, type, seats). Lives OUTSIDE profiles, so it is\n                                    typed once and every term reuses it. Shared rooms come from the admin (3.3).\n   2.4 PROFILE WORKSPACE            opened from 2.2; step bar on top (done / current / out of date / locked);\n                                    YEAR TABS (Year 1 | Year 2 | ...) on every step that works per year\n       (1) Setup [A3]               name, term -> upload PDF(s) -> \"What we found\" card (each setting + its PDF page)\n            2.4.1 Format setup [A3] only when the layout is unknown: point at a sample page, name the columns,\n                                    saved as a format definition (status: unverified)\n       (2) Review data [A4]         per year tab: Table | Flow chart; PDF side panel opens on any value click;\n                                    \"next red row\"; nothing continues while red rows remain\n       (3) Availability round [A5]  pick teachers for this term (from 2.3), deadline, status board, reminders\n       (4) Teacher input [A6]       blockers and warnings, each with its comment thread; must be empty to continue\n       (5) Rules + electives [A7]   time grid, groups, room counts, electives (Schedule / Reserve), rule weights;\n                                    \"Check\" -> pre-check report -> Acknowledge (unlocks Generate)\n       (6) Generate + arrange [A8]  per year tab: grid, tray of unplaced classes, candidates, pins, re-run this year;\n                                    sub-tabs [Arrange] [Print preview]\n       (7) Rooms + teachers [A9]    assign per class, clashes on the class, live A4 preview below\n       (8) Teacher review [A10]     send to REVIEW; change-request list (who, what, reason, impact);\n                                    DIRECT EDIT on the grid with \"agreed with ___\"\n       (9) Publish + print [A11]    publish -> locked version; downloads per group / teacher / room\n            2.4.2 Versions + change log [A11 A12]  every version, who changed what, why; open any old version;\n                                    \"start a change\" after publish -> new version (A12)\n\n3. INSTITUTION ADMIN  (also runs this institution's install - there is no platform admin, 2026-10-24)\n   3.1 Admin home [C3]              which departments have published this term, which are late; update available?\n   3.2 Departments + heads [C2 C3]  create department, invite / remove head\n   3.3 Shared rooms [C2]            rooms used by several departments; bookings between departments (spec C5/F2)\n   3.4 Academic calendar *          term dates and holidays; profiles pick their term here (spec: never take term\n                                    dates from the curriculum PDF)\n   3.5 Curriculum formats *         formats shipped with the release (from the open-source project) + formats made here\n                                    in 2.4.1 (unverified -> admin approves for this institution);\n                                    \"export\" a format file to send it to the project so other institutions get it\n   3.6 System *                     backups (download / restore), mail server (SMTP, optional), version + update notes,\n                                    service status, solver run log\n\n4. TEACHER\n   4.1 Home [B]                     what is due: availability deadline, items about me, review open\n   4.2 My availability [B2]         weekly busy grid, rank subjects, max hours per day; edit until deadline; receipt\n   4.3 My items [B3]                the blocker / warning items about me, with their comment threads\n   4.4 My timetable [B4 B5]         only my classes; draft (in REVIEW) or published; print / download;\n                                    \"request a change\" -> 4.5\n   4.5 My requests [B4]             waiting / approved / rejected + note; changes the head made for me (with note)\n\n--------------------------------------------------\nHOW PAGES CONNECT (the main paths)\n--------------------------------------------------\nInstall:            server admin runs `docker compose up` -> 0.0 first-run setup -> 3.1\nHead, new term:     0.1 -> 2.1 -> 2.2 (Copy from last term) -> 2.4 steps (1) ... (9)\nHead, new teacher:  2.3 invite -> email -> teacher 0.3 -> 4.1\nRound:              head 2.4(3) opens round -> teachers get 1.1 notice -> 4.2 -> head sees status in 2.4(3)\nProblem items:      head 2.4(4)  <->  teacher 4.3   (the SAME comment thread, seen from both sides)\nReview:             head 2.4(8) sends draft -> teacher 4.4 -> 4.5 request -> head 2.4(8) approve/reject -> teacher 1.1\nIn-person change:   head 2.4(8) direct edit -> teacher 1.1 \"changed by <head>: <note>\" -> 4.4\nAfter publish:      head 2.4.2 \"start a change\" -> new version -> affected teachers 1.1\nUnknown PDF:        head 2.4(1) -> 2.4.1 -> institution admin 3.5 approves -> (optional) export to the open-source project\n\nStep bar rule: a step unlocks when the one before is done. Going back to a done step and changing it marks the\nlater steps \"out of date\" - for THAT YEAR only when the change is inside one year tab.\n\n--------------------------------------------------\nCHANGES TO THE SPEC THIS IMPLIES (not applied yet)\n--------------------------------------------------\n- Step bar: 9 steps (above) instead of the 7 in tech-stack-list.txt \"TOP BAR\"; Detect is now part of Setup,\n  and Availability / Teacher input / Teacher review are new steps.\n- Teachers + rooms move out of \"Create profile\" into a department page (2.3); the profile only picks from it.\n- Institution admin gets calendar (3.4), formats (3.5) and system (3.6) pages; there is no platform admin.\n\n--------------------------------------------------\nOPEN\n--------------------------------------------------\n- Notifications: PROPOSED in-app always + email only when 3.6 has a mail server (self-hosted makes this the natural fit)\n- Login: PROPOSED built-in accounts (no outside service); institution single sign-on = LATER\nDECIDED 2026-10-24 (user, at the start of step 4):\n- ALL programs of a department in ONE profile (B.Ed., transfer, M.Ed., Ph.D.) -> workspace tabs = program x year\n- availability ONCE PER PERSON (shared by every department); heads see \"busy in another department\"\n- an ASSISTANT role: the same profile pages as the head, but only the head publishes\nDECIDED 2026-10-24: no public student link - teachers share the printed / PDF table with students.\n\n```"}, {"g": "ต้นฉบับ (อังกฤษ/ไทยปน)", "id": "o-4", "t": "4 User flows", "p": "4-user-flows/user-flows.txt", "md": "```text\n--------------------------------------------------\nUSER FLOWS (draft 2026-10-24) - the click-by-click path for each task, with what happens when it goes wrong\nBuilt from: 2-user-journeys (stages A/B/C), 3-sitemap (page numbers), tech-stack-list.txt (decisions)\n--------------------------------------------------\nHow to read:   [page]   (action)   <question?>  -> yes / no   ==> end   !! = error or problem path\nRoles: ADMIN = institution admin | HEAD = department head | ASSISTANT = assistant (head's pages, cannot publish)\n       TEACHER. One person can hold different roles in different departments (department switcher).\nDecided at the start of this step (2026-10-24): all programs of a department in ONE profile (tabs = program x year);\navailability ONCE PER PERSON; an ASSISTANT role.\n\n==================================================\nF1  SET UP THE INSTITUTION  (ADMIN, once)                                          journey C1-C2\n==================================================\n(server admin runs docker compose up) -> [0.0 First-run setup]\n   (institution name, language, first admin account) -> [3.1 Admin home]\n-> [3.4 Academic calendar] (this year's terms: start / end dates, holidays)\n-> [3.2 Departments & heads] (add a department) -> (invite its head by email)\n     <mail server set in 3.6?>  -> yes: invite email sent\n                                -> no : the page shows an invite LINK to copy and send by hand\n-> [3.3 Shared rooms] (rooms used by several departments: name, type, seats)\n==> institution ready; 3.1 shows each department: invited / joined / has a profile / published\n!!  head never accepts -> 3.2 shows \"invited 7 days ago\" + (send again)\n\n==================================================\nF2  JOIN BY INVITE  (HEAD, ASSISTANT or TEACHER)                                      journey A1, B1\n==================================================\n(opens the invite link) -> [0.3 Accept invite]\n   <already has an account (another department)?>\n       -> yes: (log in) -> the new department is added to the department switcher\n       -> no : (set name + password) -> account made\n==> lands on the Home of the role it was invited for (2.1 or 4.1); first time: a 3-step intro\n!!  link expired -> \"ask your head / admin to send it again\" (no account is made)\n\n==================================================\nF3  START THIS TERM'S TIMETABLE  (HEAD or ASSISTANT)                                  journey A1-A3\n==================================================\n[2.1 Home] (\"Start this term's timetable\")\n   <a profile for the last term exists?>\n       -> yes: [2.2 Profiles] (Copy from last term)  - keeps people, rooms, rules, programs; each program's\n               years move up one; NEW year-1 groups are added\n       -> no : [2.2 Profiles] (New)\n-> [2.4 step 1 Setup] (pick the term from the academic calendar - never from the PDF)\n   (choose the programs taught this term: B.Ed. / transfer / M.Ed. / Ph.D. ...)\n   (for each program: upload its curriculum file(s) - PDF, Word, Excel, scan, photo)\n   -> see F4 (reading the files)\n==> the workspace shows one tab per program x year, every step \"not started\"\n!!  the term is not in the calendar -> \"ask the admin to add it\" (3.4); the head cannot type dates here\n\n==================================================\nF4  UPLOAD AND READ A CURRICULUM FILE  (HEAD or ASSISTANT)                            journey A3-A4\n==================================================\n[2.4 step 1] (upload) -> the system stores og_upload (the file as given, never changed)\n   <what is it really? (by content, not by name)>\n       -> PDF with text / Word / Excel -> convert -> normalise -> normalised_upload\n       -> scan / photo / PDF pages without text -> OCR + glyph tool -> normalised_upload\n       -> !! not a document (empty, broken, a zip, a locked PDF) -> \"this file cannot be read: <reason>\"; nothing saved\n   <is the layout a known format?>\n       -> yes: \"What we found\" card: format, curriculum version, years, terms, credit pattern - each with its page\n               (confirm) or (this is wrong -> pick another format)\n       -> no : [2.4.1 Format setup] (show which column is code / name / credits on a sample page)\n               -> saved as a format definition, \"unverified\" -> ADMIN sees it in 3.5 -> F11\n-> [2.4 step 2 Review data]  per program x year tab: Table | Flow chart\n   values the reader is SURE of: plain | values it is NOT sure of: RED, each with its reason + the crop of the page\n   (next red) -> the PDF opens beside the table, the spot highlighted -> (fix the value) or (it is right)\n   <any red left?>  -> yes: \"Continue\" stays locked (\"3 values still need you\")\n                    -> no : step 2 done\n==> every plan row has: program, year, term, code (or \"slot\"), name, credits L-P-S\n!!  the same course reads differently in the plan and in the course list -> red, both values shown, head picks\n!!  a later upload replaces a file -> the steps after it become \"out of date\" for THAT program only\n\n==================================================\nF5  AVAILABILITY ROUND  (HEAD/ASSISTANT opens, TEACHER answers)                       journey A5, B2\n==================================================\nHEAD: [2.4 step 3] (pick this term's teachers from 2.3) (set a deadline) (open the round)\n   -> each teacher gets a notice (1.1, + email if set)\nTEACHER: [4.1 Home] \"availability due in 5 days\" -> [4.2 My availability]\n   <filled it in for another department this term already?>\n       -> yes: the SAME grid is shown (once per person) - only the subject ranking is per department\n       -> no : (click busy times on the weekly grid) (rank the subjects this department offers) (max hours / day)\n   (submit) -> receipt: \"submitted - your head sees: ...\"  (can edit until the deadline)\nHEAD: status board: submitted / not yet / late -> (send reminder)\n   <deadline passed and someone missing?>\n       -> (fill it in for them) or (mark \"available any time\")\n==> step 3 done when every chosen teacher has                         journey A11-A12, B5\n==================================================\n[2.4 step 9] (publish)  <ASSISTANT?> -> \"only the head can publish\" + (ask the head) -> the head gets a notice\n-> version 1, locked; every teacher notified; (download / print) per group, teacher, room\nLATER: [2.4.2 Versions] (start a change) -> a new draft version, the published one stays valid\n   (change) -> impact check + minimal change -> (publish) -> version 2; only affected teachers notified\n==> students get the new paper from their teachers (no student login, no public link)\n\n==================================================\nF11 APPROVE A NEW FORMAT  (ADMIN)                                                  from F4\n==================================================\n[3.5 Curriculum formats] \"1 unverified format from <department>\"\n(open) -> the sample page with the columns the head marked, and what it read from 3 other pages\n   <looks right?> -> yes: (approve) -> every department here can use it; (export) to send it to the project\n                  -> no : (send back with a note) -> the head sees it in step 1\n\n==================================================\nF12 GIVE THE WORK TO AN ASSISTANT  (HEAD)                                          new role\n==================================================\n[2.3 People & rooms] (invite someone as ASSISTANT) -> F2 for them\n-> the assistant sees the same Home, Profiles and workspace as the head, can do steps 1-8\n   cannot: publish (F10), remove the head, invite other assistants\n==> every change still logged with WHO did it (head or assistant)\n\n==================================================\nSTILL OPEN (decide later, does not block the flows)\n==================================================\n- login method (built-in accounts proposed) and notifications (in-app + optional email proposed)\n- what an assistant may do in 2.3 People & rooms (invite teachers? proposed: yes)\n\n```"}];
