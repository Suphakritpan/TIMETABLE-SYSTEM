server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;            # curriculum uploads

  location /api/ {
    proxy_pass http://backend:8000;    # service name in compose.yaml
    proxy_read_timeout 600s;           # a scanned curriculum can take minutes to read
  }

  location / { try_files $uri /index.html; }   # hash router needs only index.html; this keeps deep links safe
}
